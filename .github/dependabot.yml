# Dependabot configuration for Bramble.
#
# Covers every dependency ecosystem present in the repo: five npm lockfiles
# (the root release toolchain, webapp/, webapp/ws-proxy/, webapp/mock/,
# simulator/ui/), two Go modules
# (simulator/gosim/, simulator/tests/), four Dockerfiles (webapp/,
# docker/firmware-builder/, emulator/, simulator/), and the GitHub Actions
# workflows.
#
# Cadence and grouping are tuned for the CI contract documented in
# docs/ci.md. Every workflow always triggers on every pull request, heavy
# jobs skip per area but their contexts always report, and any change under
# .github/workflows forces the full matrix. On a small self-hosted runner
# pool that makes each dependency PR expensive, so:
#
#   * Everything runs monthly, not daily or weekly. This is a cadence for
#     routine version drift only. Dependabot security updates are driven by
#     advisories rather than by this schedule, so a new CVE still opens a
#     PR immediately; the monthly setting does not delay security fixes.
#   * Times are staggered across the month's first day so the ecosystems do
#     not all queue against the runner pool at once.
#   * Minor and patch updates are grouped into one PR per directory, so a
#     month of drift costs one CI run per ecosystem instead of a dozen.
#     Major updates are deliberately left ungrouped: they need to be read
#     and validated individually, and burying one inside a group PR is how
#     a breaking Electron or Vite bump gets rubber-stamped.
#   * open-pull-requests-limit is held low so a burst of majors cannot
#     saturate CI.
#
# Commit messages use the deps and deps-dev scopes from the scope-enum in
# commitlint.config.cjs. Both are outside every component scope gated by the
# .releaserc.*.cjs configs, so a Dependabot merge can never cut a release.
#
# Group names are kept short ("patch", "gha") on purpose (issue #190): for a
# single-package grouped update, Dependabot's generated PR title is
# "bump X from A to B in DIR in the GROUP group across N directories", and
# that suffix's length is dictated entirely by the group name, which the
# directory already makes redundant. A longer descriptive name here
# (webapp-docker-minor-patch, simulator-tests-minor-patch, ...) pushed real
# titles past commitlint's 120-char header-max-length; the group name is a
# label for the Dependabot dashboard, not user-facing prose, so shortening it
# costs nothing but characters. This alone is not sufficient in every case
# (a long npm package name/version pair can still exceed 120 chars even with
# the shortest defensible group name), so commit-msg-lint.yml also carries a
# narrow, actor-gated commitlint accommodation for dependabot[bot] titles;
# see commitlint.dependabot.config.cjs.

version: 2

updates:
  # ---------------------------------------------------------------- npm ---
  # The root package.json holds nothing but the semantic-release toolchain that
  # release-components.yml and the Release config job install with npm ci. It is
  # small and security-relevant (it runs in the job that holds the release write
  # token), so it gets its own entry rather than riding along with the webapp.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /webapp/ws-proxy
    schedule:
      interval: monthly
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /webapp/mock
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /simulator/ui
    schedule:
      interval: monthly
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ----------------------------------------------------------- Go modules ---
  - package-ecosystem: gomod
    directory: /simulator/gosim
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /simulator/tests
    schedule:
      interval: monthly
      time: "07:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # -------------------------------------------------------- GitHub Actions ---
  # Actions updates are the expensive ones: touching .github/workflows forces
  # every heavy job in the matrix. Group all of them, majors included, into a
  # single monthly PR so the full matrix runs once rather than once per action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
      include: scope
    groups:
      gha:
        patterns:
          - "*"

  # ---------------------------------------------------------------- docker ---
  # Four Dockerfiles carry pinned FROM base images. A base-image bump can
  # trigger a heavy rebuild, so these follow the same monthly, staggered,
  # minor-and-patch-grouped pattern as npm and gomod, with majors left
  # individual. Note that most of these tags float at major or minor
  # granularity (node:24-slim, golang:1.25-bookworm, debian:bookworm), so in
  # practice the grouped bucket mostly catches golang minor moves and the
  # interesting updates arrive as ungrouped majors, which is the intent.
  #
  # A Node major bump arrives here as one of those ungrouped majors, and it
  # will fail CI on its own until .nvmrc moves with it: .nvmrc is the single
  # source of truth for the Node major and scripts/lint/check-node-version.sh
  # gates every reference against it. That red check is the intended
  # behavior, not a broken bot. Merging a Node major means editing .nvmrc
  # plus every file that check names, which is a human decision (the previous
  # unattended bump is how the published image ended up on a different major
  # than every CI job and the desktop installers).
  #
  # Only FROM lines are tracked. emulator/Dockerfile also git-clones ESP-IDF
  # via an IDF_VERSION build arg, which Dependabot cannot see, so that pin
  # still has to be moved by hand. It is not unguarded, though:
  # scripts/lint/check-idf-version.sh asserts every ESP-IDF reference in the
  # tree matches .esp-idf-version, and that check gates every pull request.
  - package-ecosystem: docker
    directory: /webapp
    schedule:
      interval: monthly
      time: "08:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The ESP-IDF base image is deliberately NOT auto-updated. CLAUDE.md states
  # that firmware builds need ESP-IDF v5.4.1 specifically, scripts/ci-ensure-idf.sh
  # fails the build and asks for v5.4.1 by name when it is absent, and
  # docs/ci/idf-node-runner-image.md derives the published runner tag
  # bramble/idf-node:v5.4.1 from this exact base. An unattended bump would move
  # the toolchain out from under every firmware build and desync the runner
  # image tag, and because firmware is only lightly compiled on pull requests
  # the breakage would surface late and be hard to attribute.
  #
  # This ignore is load-bearing, not cruft. Moving ESP-IDF is a deliberate,
  # human-driven change that has to land together with CLAUDE.md, the runner
  # image, and the CI scripts above. Do not remove it to "unblock" a bump.
  - package-ecosystem: docker
    directory: /docker/firmware-builder
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: espressif/idf

  - package-ecosystem: docker
    directory: /emulator
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /simulator
    schedule:
      interval: monthly
      time: "10:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
