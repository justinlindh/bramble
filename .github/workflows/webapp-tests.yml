name: Webapp Tests

on:
  push:
    branches:
      - main
      - audit/**
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp-tests.yml'
  pull_request:
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp-tests.yml'

jobs:
  webapp-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run webapp test suite
        run: npm test
