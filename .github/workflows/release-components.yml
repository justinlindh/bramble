name: Release Components

# Publishes GitHub Releases for the four independently versioned components
# (protocol, firmware, webapp, sim). Each component has its own scope-gated
# .releaserc.<component>.cjs: only conventional commits scoped to that
# component cut a release for it. GitHub squash-merge commits are expanded
# into their per-bullet virtual commits first (scripts/release/
# semantic-release-squash-expander.cjs) so cross-component PRs still version
# every component their body touches.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (analyze only, no tags or releases)"
        required: false
        default: false
        type: boolean
      webapp_installers_tag:
        description: >-
          Existing webapp-vX.Y.Z tag to rebuild desktop installers for.
          Skips semantic-release entirely and attaches the installers to that
          tag's release, then publishes it. This only works while that
          release is still an unpublished DRAFT: once a release is published
          it is immutable and rejects new assets (HTTP 422), so this cannot
          recover a release that already completed a run. Combine with dry_run
          to build the installers without uploading anything.
        required: false
        default: ""
        type: string
      firmware_factory_tag:
        description: >-
          Existing firmware-vX.Y.Z tag to rebuild factory images for.
          Skips semantic-release entirely and attaches the images to that
          tag's release, then publishes it. This only works while that
          release is still an unpublished DRAFT: once a release is published
          it is immutable and rejects new assets (HTTP 422), so this cannot
          recover a release that already completed a run. Combine with dry_run
          to build the images without uploading anything.
        required: false
        default: ""
        type: string

# Read by default; the three jobs that create tags, releases or assets opt into
# contents: write themselves. issues: write and pull-requests: write are
# deliberately absent: all four .releaserc.<component>.cjs pass
# successComment: false, failComment: false and failTitle: false to
# @semantic-release/github, and those flags short-circuit the plugin's entire
# issue and pull-request surface. The released-labels call sits inside the
# successComment branch of the plugin's success handler, the issue open and
# close paths sit behind the failComment/failTitle checks, and addReleases
# defaults to false. The plugin also skips its token-permission probe when it
# detects GitHub Actions, so nothing here ever needed those two scopes.
permissions:
  contents: read

# A single serialized group so back-to-back merges queue instead of racing
# semantic-release into silently skipping a tag. Never cancel an in-flight
# release run.
concurrency:
  group: release-components
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    # Skipped only when a manual dispatch asks to rebuild assets for an existing
    # tag; the asset jobs below key off that skip.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.webapp_installers_tag == '' && inputs.firmware_factory_tag == '')
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Four semantic-release runs over a full-history checkout; the asset builds
    # live in their own jobs with their own budgets. A cap is load-bearing here
    # because concurrency.cancel-in-progress is false: without one, a single
    # wedged run holds the release-components group for the six-hour default and
    # every merge behind it waits.
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      firmware_published: ${{ steps.firmware.outputs.published }}
      firmware_tag: ${{ steps.firmware.outputs.tag }}
      webapp_published: ${{ steps.webapp.outputs.published }}
      webapp_tag: ${{ steps.webapp.outputs.tag }}
      webapp_version: ${{ steps.webapp.outputs.version }}
    env:
      # "true" only on a manual dispatch that requested a dry run; empty on push.
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Same Node major as every other Node job in CI, so the release
          # toolchain does not run on whatever the runner image happens to ship.
          node-version: 20

      - name: Install release dependencies
        # npm ci against the committed root package-lock.json, not a floating
        # `npm install --no-save semantic-release@24 ...`: that form re-resolved
        # every transitive dependency on every push to main, inside the job that
        # holds the write token, so an upstream publish could change the release
        # tooling with no commit and no review. The root package.json exists only
        # to pin this toolchain (the webapp keeps its own package.json), and the
        # Release config job in quality.yml installs from the same lockfile so
        # its scope-gating regression test exercises the versions that actually
        # cut releases.
        run: npm ci --no-audit --no-fund

      # Components run sequentially in one job so their tag fetches never race.
      # GITHUB_TOKEN is step-scoped rather than job-scoped so only the four
      # semantic-release invocations see the write-capable token.
      - name: Release protocol
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$DRY" = "true" ]; then
            npx semantic-release --extends ./.releaserc.protocol.cjs --dry-run
          else
            npx semantic-release --extends ./.releaserc.protocol.cjs
          fi

      - name: Release firmware
        id: firmware
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # semantic-release exposes no machine-readable "did it publish?" exit
          # signal (it exits 0 whether or not a release was cut), so detect a
          # publish by the firmware-v* tag it creates and pushes in this
          # checkout. Diff the tag set across the run; a new tag means a real
          # release. A dry run creates no tag, so this reports published=false.
          # comm needs both inputs in the same LEXICAL (LC_ALL=C) order. Never
          # feed it "sort -V": once a component reaches double digits, version
          # order (firmware-v1.5.10 before v1.5.9) diverges from byte order, comm
          # prints "input is not in sorted order" and exits 1, which under
          # set -e -o pipefail fails this step AFTER semantic-release already
          # published, leaving a bare release. Set membership is all we need, so
          # lexical order is correct here.
          before="$(git tag -l 'firmware-v*' | LC_ALL=C sort)"
          # Capture semantic-release's exit status instead of letting set -e
          # abort the step on it. semantic-release pushes the tag and creates the
          # draft release before its run finishes, so any later failure (a GitHub
          # API hiccup, a plugin error) would otherwise skip the tag diff below,
          # leave `published` unset, and strand the draft with no factory images
          # and no way to re-cut it (the tag already exists). Diff the tags,
          # publish the outputs, then re-raise the failure at the end of the
          # step: the firmware-factory-images job gates on the output under
          # !cancelled(), not on this job's result, so the draft still gets its
          # images attached and published while the run is still marked failed.
          status=0
          if [ "$DRY" = "true" ]; then
            npx semantic-release --extends ./.releaserc.firmware.cjs --dry-run || status=$?
          else
            npx semantic-release --extends ./.releaserc.firmware.cjs || status=$?
          fi
          after="$(git tag -l 'firmware-v*' | LC_ALL=C sort)"
          # LC_ALL=C on comm too: comm's own sorted-order check uses the ambient
          # locale's collation, and the self-hosted burst runner's locale is not
          # guaranteed to match byte order. Pin both so the whole comparison is
          # locale-independent.
          new="$(LC_ALL=C comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | tail -1)"
          if [ -n "$new" ]; then
            {
              echo "published=true"
              echo "tag=$new"
              echo "version=${new#firmware-v}"
            } >> "$GITHUB_OUTPUT"
            echo "Firmware release published: $new"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No firmware release published this run"
          fi
          exit "$status"

      - name: Release webapp
        id: webapp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same tag-diff publish detection as the firmware step above, with the
          # same LC_ALL=C requirement: version sort would break comm at the
          # double-digit rollover and fail the step after publishing. The
          # desktop-installer jobs below consume these outputs. The exit status
          # is captured and re-raised for the same reason as well: a failure
          # after the tag push must not skip the diff and strand the draft.
          before="$(git tag -l 'webapp-v*' | LC_ALL=C sort)"
          status=0
          if [ "$DRY" = "true" ]; then
            npx semantic-release --extends ./.releaserc.webapp.cjs --dry-run || status=$?
          else
            npx semantic-release --extends ./.releaserc.webapp.cjs || status=$?
          fi
          after="$(git tag -l 'webapp-v*' | LC_ALL=C sort)"
          # LC_ALL=C on comm too (see the firmware step): comm's sorted-order
          # check uses the ambient locale, which the burst runner does not pin.
          new="$(LC_ALL=C comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | tail -1)"
          if [ -n "$new" ]; then
            {
              echo "published=true"
              echo "tag=$new"
              echo "version=${new#webapp-v}"
            } >> "$GITHUB_OUTPUT"
            echo "Webapp release published: $new"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No webapp release published this run"
          fi
          exit "$status"

      - name: Release sim
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$DRY" = "true" ]; then
            npx semantic-release --extends ./.releaserc.sim.cjs --dry-run
          else
            npx semantic-release --extends ./.releaserc.sim.cjs
          fi

  # ---------------------------------------------------------------------------
  # Per-board factory images for the firmware release. Plain images for INITIAL
  # esptool flashing only: the build signs each app with a throwaway key
  # (BRAMBLE_OTA_ALLOW_GENERATED_KEY=1), never the production OTA signing key,
  # and the OTA update channel is not involved here.
  #
  # semantic-release created the firmware release as a DRAFT (draftRelease: true
  # in .releaserc.firmware.cjs) precisely so these assets can be attached: a
  # published release is immutable and rejects asset uploads with HTTP 422. The
  # attach script uploads to the draft, then flips it to published (immutable)
  # with the assets already in place. It uses the REST API via curl, so the
  # runner needs no gh CLI.
  #
  # This is a separate job, not a tail of the release job, so a
  # firmware_factory_tag dispatch can re-run it against an existing tag. Without
  # that lever a failed image build left the firmware-v* tag pushed and its
  # release a permanent unpublished draft: re-running the release job cuts
  # nothing because the tag already exists, and the release can never be
  # published. It mirrors the webapp_installers_tag escape hatch below.
  firmware-factory-images:
    needs: release
    # Gate on the firmware_published OUTPUT, not needs.release.result: the
    # firmware release step runs before the webapp and sim steps, so a failure
    # in one of those (or in the firmware step itself after the tag was pushed)
    # marks the release job 'failure' while a real draft release is waiting for
    # its images. The outputs stay readable regardless.
    # !cancelled() lifts the implicit success() gate, which would otherwise skip
    # this job before the condition is ever read, both for that failure case and
    # for a firmware_factory_tag dispatch that skips the release job on purpose.
    if: >-
      !cancelled() &&
      (needs.release.outputs.firmware_published == 'true' ||
       (needs.release.result == 'skipped' && inputs.firmware_factory_tag != ''))
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Three sequential ESP-IDF board builds (45m step budget) plus the upload.
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      FW_TAG: ${{ inputs.firmware_factory_tag || needs.release.outputs.firmware_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a normal release run the tag sits on this push's HEAD, so the
          # default sha is the tagged commit; a manual rebuild checks out the
          # requested tag itself.
          ref: ${{ inputs.firmware_factory_tag || github.sha }}
          # Nothing in this job pushes, and the image build runs a full ESP-IDF
          # toolchain over the tree. Do not leave a contents:write git
          # credential in .git/config for it; the attach step below carries its
          # own step-scoped GH_TOKEN.
          persist-credentials: false

      - name: Resolve version from tag
        id: ver
        run: |
          set -euo pipefail
          case "$FW_TAG" in
            firmware-v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Unexpected firmware tag: '$FW_TAG'" >&2; exit 1 ;;
          esac
          echo "version=${FW_TAG#firmware-v}" >> "$GITHUB_OUTPUT"

      - name: Build firmware factory images
        # Three sequential ESP-IDF board builds; each already saturates the
        # runner's cores via ninja. Local timing on 8 CPUs: see PR body.
        timeout-minutes: 45
        env:
          BRAMBLE_OTA_ALLOW_GENERATED_KEY: "1"
          # Step outputs flow through env, never inline in run: text
          # (script-injection hardening; the firmware-vX.Y.Z tag format
          # constrains them today, env keeps that true if it ever loosens).
          FW_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          bash scripts/release/build-factory-images.sh "$FW_VERSION"

      - name: Attach factory images to firmware release and publish
        # A dry-run dispatch builds the images without uploading anything, the
        # same way the webapp installer legs build under dry_run and only the
        # publish job is suppressed.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/release/attach-release-assets.sh \
            "$FW_TAG" \
            dist/factory/bramble_*_factory.bin \
            dist/factory/SHA256SUMS

  # ---------------------------------------------------------------------------
  # Desktop installers for the webapp release. Linux (AppImage, deb, pacman)
  # and Windows (NSIS) cross-build in electronuserland/builder:20-wine on the
  # Linux runner; macOS dmgs need real Apple hardware, so they build on a
  # GitHub-hosted mac runner. All installers are UNSIGNED: there are no Apple
  # or Windows code-signing certificates, CSC_IDENTITY_AUTO_DISCOVERY stays
  # false, and users will see the usual Gatekeeper / SmartScreen warnings.
  # The OTA firmware signing chain is unrelated to and untouched by these jobs.
  #
  # Desktop auto-update: the Windows and Linux legs also emit electron-updater
  # feed files (latest.yml, latest-linux.yml) that get attached to the release;
  # a self-updating build (Windows NSIS, Linux AppImage) reads them to discover
  # and install a newer version. macOS and Linux deb/pacman are notify-only and
  # publish no feed (see the per-job upload notes and webapp/electron/updater.ts).
  #
  # semantic-release does not commit a version bump into webapp/package.json
  # (.releaserc.webapp.cjs has no npm/git plugin), so every build injects the
  # released version with -c.extraMetadata.version; installer filenames and
  # app.getVersion() then match the webapp-vX.Y.Z tag.
  #
  # Each job's explicit `if:` REPLACES the implicit success() gate, so every
  # gate re-checks needs.*.result explicitly. The jobs run either when the
  # release job just published a webapp release, or when a manual dispatch
  # named an existing tag via webapp_installers_tag (release job skipped).

  webapp-installers-linux-win:
    needs: release
    # Gate on the webapp_published output, not needs.release.result: the webapp
    # release step runs before the sim step, so a failure there (or in the webapp
    # step itself after the tag was pushed) marks the whole release job 'failure'
    # even though the webapp release already published. Its outputs stay readable
    # regardless, so keying on the output attaches installers to a real release
    # that would otherwise be left bare.
    # !cancelled() lifts the implicit success() gate: a webapp_installers_tag
    # dispatch skips the release job on purpose, and without a status function
    # here GitHub would skip this dependent job too before ever reading the
    # condition below.
    if: >-
      !cancelled() &&
      (needs.release.outputs.webapp_published == 'true' ||
       (needs.release.result == 'skipped' && inputs.webapp_installers_tag != ''))
    # GitHub-hosted on purpose (never RUNNER_LABEL): this is a job-level
    # container: job, and the self-hosted burst pool cannot run container jobs.
    # Burst runners do not mount the runner's node externals into the job
    # container, so every step dies at Checkout with 'exec /__e/node24/bin/node:
    # no such file or directory'. The electron-builder wine image is
    # self-contained (node + wine for NSIS, no ESP-IDF/go tooling), so a hosted
    # runner needs nothing from the self-hosted pool; releases are infrequent,
    # so hosted minutes are fine.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      # electron-builder's own image: node + wine for NSIS cross-builds. Pinned
      # to the Node 20 variant rather than the floating :wine tag, which always
      # points at the newest Node base electron-builder publishes (Node 24 when
      # this was pinned: :wine and :24-wine resolve to the same digest). That
      # meant this leg silently built the renderer and electron bundles under a
      # different Node major than the macOS leg below and than every other Node
      # job in this repo, and would move again on the next upstream base bump.
      # Node 20 is the repo-wide pin (.nvmrc, webapp/package.json engines).
      image: electronuserland/builder:20-wine
      options: --user 0:0
    env:
      WEBAPP_TAG: ${{ inputs.webapp_installers_tag || needs.release.outputs.webapp_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a normal release run the tag sits on this push's HEAD, so the
          # default sha is the tagged commit; a manual rebuild checks out the
          # requested tag itself.
          ref: ${{ inputs.webapp_installers_tag || github.sha }}

      - name: Resolve version from tag
        id: ver
        run: |
          set -euo pipefail
          case "$WEBAPP_TAG" in
            webapp-v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Unexpected webapp tag: '$WEBAPP_TAG'" >&2; exit 1 ;;
          esac
          echo "version=${WEBAPP_TAG#webapp-v}" >> "$GITHUB_OUTPUT"

      # The macOS leg runs the identical two commands. That duplication is not
      # removable: electron-builder packs the app's production dependencies out
      # of webapp/node_modules, so `npm ci` has to run on both platforms
      # regardless, and hoisting only `build:electron` into a shared job would
      # trade a few seconds of electron-vite for a third npm ci plus an artifact
      # round trip. What the two legs must NOT do is disagree on the Node major,
      # which is why the container above is pinned to :20-wine and setup-node on
      # the macOS leg pins the same 20.
      - name: Build renderer and electron bundles
        run: |
          set -euo pipefail
          cd webapp
          npm ci
          npm run build:electron

      - name: Package Linux and Windows installers
        env:
          # Installers are unsigned; suppress signing lookups.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Headless wine: skip the mono/gecko first-run installers, which
          # hang forever without a display (observed locally).
          WINEDLLOVERRIDES: "mscoree,mshtml="
          WINEDEBUG: "-all"
          # The container runs as root (--user 0:0), but the Actions runner
          # injects HOME=/github/home, which the self-hosted runner mounts
          # owned by a different uid. wine refuses to create its config dir in
          # a directory it does not own ("not owned by you"), failing the
          # Windows rcedit step. Point HOME at root's own home so wine and the
          # electron-builder cache land in a uid-0-owned, writable location.
          HOME: /root
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cd webapp
          # --publish never: electron-builder.yml declares a github publish
          # provider (so the latest*.yml update feed gets emitted), and GitHub
          # Actions sets CI=true, which otherwise flips electron-builder into
          # implicit "onTagOrDraft" publishing and makes it attempt a real
          # upload that fails here (no GH_TOKEN in this job). This job only
          # builds; the webapp-installers-publish job attaches every asset,
          # feed files included.
          npx electron-builder --linux --win --publish never --config electron-builder.yml \
            -c.extraMetadata.version="$VER"
          # find, not `ls | grep`: portable across the GNU find on the linux/win
          # container and the BSD find on the macos runner, and it never parses
          # ls output. Informational listing of the installers just produced.
          find release -maxdepth 1 -type f ! -name '*unpacked*' -exec ls -lh {} +

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: webapp-installers-linux-win
          # latest.yml (Windows NSIS) and latest-linux.yml (Linux AppImage) are
          # the electron-updater feed files. electron-builder emits them because
          # electron-builder.yml declares a github publish provider; attaching
          # them to the release is what lets a self-updating build discover a
          # newer version. deb and pacman carry no feed (the system package
          # manager owns those installs).
          path: |
            webapp/release/*.AppImage
            webapp/release/*.deb
            webapp/release/*.pacman
            webapp/release/*.exe
            webapp/release/latest.yml
            webapp/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 1

  webapp-installers-mac:
    needs: release
    # See webapp-installers-linux-win: gate on the output, not the job result.
    # !cancelled() lifts the implicit success() gate: a webapp_installers_tag
    # dispatch skips the release job on purpose, and without a status function
    # here GitHub would skip this dependent job too before ever reading the
    # condition below.
    if: >-
      !cancelled() &&
      (needs.release.outputs.webapp_published == 'true' ||
       (needs.release.result == 'skipped' && inputs.webapp_installers_tag != ''))
    # Hosted mac runner on purpose (never RUNNER_LABEL: the self-hosted pool
    # is Linux). One arm64 runner packages both dmgs: the app has no native
    # runtime modules (all runtime deps are pure JS; verified against
    # webapp/package-lock.json install-script/gypfile markers), so
    # electron-builder just fetches the per-arch Electron binaries.
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WEBAPP_TAG: ${{ inputs.webapp_installers_tag || needs.release.outputs.webapp_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.webapp_installers_tag || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Must stay the same major as the linux/win leg's container image tag
          # (electronuserland/builder:20-wine): both legs build the same
          # platform-independent renderer and electron bundles.
          node-version: 20

      - name: Resolve version from tag
        id: ver
        run: |
          set -euo pipefail
          case "$WEBAPP_TAG" in
            webapp-v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Unexpected webapp tag: '$WEBAPP_TAG'" >&2; exit 1 ;;
          esac
          echo "version=${WEBAPP_TAG#webapp-v}" >> "$GITHUB_OUTPUT"

      - name: Build renderer and electron bundles
        run: |
          set -euo pipefail
          cd webapp
          npm ci
          npm run build:electron

      - name: Package macOS dmgs (arm64 + x64, unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cd webapp
          # --publish never: see the Linux/Windows job. The github publish
          # provider plus CI=true would otherwise make electron-builder attempt
          # a real upload that fails here (no GH_TOKEN). This job only builds;
          # the mac dmgs are attached by the webapp-installers-publish job.
          npx electron-builder --mac --arm64 --x64 --publish never --config electron-builder.yml \
            -c.extraMetadata.version="$VER"
          # find, not `ls | grep`: portable across the GNU find on the linux/win
          # container and the BSD find on the macos runner, and it never parses
          # ls output. Informational listing of the installers just produced.
          find release -maxdepth 1 -type f ! -name '*unpacked*' -exec ls -lh {} +

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: webapp-installers-mac
          # dmg only, no latest-mac.yml: the dmgs are unsigned, so Squirrel.Mac
          # cannot validate and apply an in-app update. The desktop app treats
          # macOS as a notify-only platform (it opens the releases page), so no
          # mac update feed is published, by design.
          path: webapp/release/*.dmg
          if-no-files-found: error
          retention-days: 1

  webapp-installers-publish:
    needs: [release, webapp-installers-linux-win, webapp-installers-mac]
    # Both build legs must have succeeded (a partial installer set must never
    # publish), and a dry-run dispatch builds without uploading.
    # !cancelled() lifts the implicit success() gate so this job is evaluated
    # even though the release job is skipped on a webapp_installers_tag
    # dispatch; the explicit result checks below still require both build legs.
    if: >-
      !cancelled() &&
      needs.webapp-installers-linux-win.result == 'success' &&
      needs.webapp-installers-mac.result == 'success' &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run) &&
      (needs.release.outputs.webapp_published == 'true' ||
       (needs.release.result == 'skipped' && inputs.webapp_installers_tag != ''))
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      WEBAPP_TAG: ${{ inputs.webapp_installers_tag || needs.release.outputs.webapp_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.webapp_installers_tag || github.sha }}
          # Nothing here pushes; the attach step below carries its own
          # step-scoped GH_TOKEN, so no contents:write git credential needs to
          # sit in .git/config for the rest of the job.
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: dist/installers
          pattern: webapp-installers-*
          merge-multiple: true

      # semantic-release created this release as a DRAFT (draftRelease: true in
      # .releaserc.webapp.cjs) so these installers can be attached: a published
      # release is immutable and rejects asset uploads with HTTP 422. The script
      # uploads to the draft (replace-by-name, so a re-attach on a still-draft
      # release is safe), then flips it to published with the installers in
      # place. A webapp_installers_tag dispatch only works while that tag's
      # release is still a draft; an already-published release is immutable and
      # cannot take new assets, so recovering a bare published release means
      # cutting a new version, not re-attaching to the old tag.
      - name: Attach installers to webapp release and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist/installers
          ( cd dist/installers && sha256sum -- * > SHA256SUMS && cat SHA256SUMS )
          bash scripts/release/attach-release-assets.sh "$WEBAPP_TAG" dist/installers/*
