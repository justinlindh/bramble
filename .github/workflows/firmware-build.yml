# Dispatch-only: builds and signs the per-board firmware images, publishes them
# to the OTA endpoint, and verifies the published release in the OTA index.
name: Firmware Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # No cancel-in-progress: this workflow publishes to the production OTA
  # endpoint, so overlapping dispatches queue rather than cancel each other.
  group: firmware-build-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  firmware-build:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and channel
        id: version
        run: |
          REF_NAME="${GITHUB_REF_NAME:-}"
          if [[ "$REF_NAME" =~ ^firmware-v(.+)$ ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            CHANNEL="dev"
            VERSION=$(CHANNEL=dev bash scripts/ci-publish-ota.sh --print-version)
            echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved: channel=$(grep channel "$GITHUB_OUTPUT" | tail -1) version=$(grep version "$GITHUB_OUTPUT" | tail -1)"

      - name: Ensure ESP-IDF toolchain
        run: bash scripts/ci-ensure-idf.sh

      - name: Install OTA release signing key
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::OTA_SIGNING_KEY secret is not set; refusing to build unsigned release artifacts"
            exit 1
          fi
          umask 077
          printf '%s\n' "$OTA_SIGNING_KEY" > /tmp/ota_signing_key.pem

      - name: Build firmware artifacts
        env:
          BRAMBLE_BUILD_VERSION: ${{ steps.version.outputs.version }}
          BRAMBLE_OTA_SIGNING_KEY: /tmp/ota_signing_key.pem
        run: |
          source scripts/ci-source-idf.sh
          # Strip leading v for PROJECT_VER
          export BRAMBLE_BUILD_VERSION="${BRAMBLE_BUILD_VERSION#v}"
          bash scripts/ci-build-firmware.sh

      - name: Verify artifact signatures against the committed release public key
        run: |
          source scripts/ci-source-idf.sh
          for board in heltec-v3 tdeck-plus heltec-v4 bramble-pager; do
            echo "Verifying signature: $board"
            espsecure.py verify_signature --version 2 \
              --keyfile keys/ota-release-pub.pem \
              "build-artifacts/firmware-ci/$board/bramble.bin"
          done

      - name: Publish OTA via authenticated endpoint
        env:
          OTA_PUBLISH_KEY: ${{ secrets.OTA_PUBLISH_KEY }}
          OTA_PUBLISH_URL: https://bramblemesh.org/ota/publish
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          missing=()
          command -v curl >/dev/null 2>&1 || missing+=(curl)
          command -v jq >/dev/null 2>&1 || missing+=(jq)
          if [ ${#missing[@]} -gt 0 ]; then
            # The container runner runs as root; the ubuntu-latest fallback
            # does not, so escalate when we are not already root.
            sudo_cmd=()
            if [ "$(id -u)" -ne 0 ]; then
              if command -v sudo >/dev/null 2>&1; then
                sudo_cmd=(sudo)
              else
                echo "::error::missing ${missing[*]} and no root or sudo available to install them"
                exit 1
              fi
            fi
            "${sudo_cmd[@]}" apt-get update
            "${sudo_cmd[@]}" apt-get install -y "${missing[@]}"
          fi
          chmod +x scripts/ci-publish-ota.sh

          for board in heltec-v3 tdeck-plus heltec-v4 bramble-pager; do
            echo "Publishing board: $board"
            BOARD="$board" \
            BOOTLOADER="build-artifacts/firmware-ci/$board/bootloader.bin" \
            PARTITION="build-artifacts/firmware-ci/$board/partition-table.bin" \
            FIRMWARE="build-artifacts/firmware-ci/$board/bramble.bin" \
            scripts/ci-publish-ota.sh
          done

      - name: Verify published release completeness in index
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -fsSL https://bramblemesh.org/ota/index.json -o /tmp/ota-index.json

          jq -e \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --argjson boards '["heltec-v3","tdeck-plus","heltec-v4","bramble-pager"]' \
            '
            def matches_board_artifact($board; $name):
              ((.file // "") | endswith("/" + $board + "/" + $name)) or
              ((.path // "") | endswith("/" + $board + "/" + $name));

            def has_required_for_board($board):
              any(.artifacts[]?; .board == $board and matches_board_artifact($board; "bootloader.bin")) and
              any(.artifacts[]?; .board == $board and matches_board_artifact($board; "partition-table.bin")) and
              any(.artifacts[]?; .board == $board and matches_board_artifact($board; "bramble.bin"));

            (.releases | map(select(.version == $version and .channel == $channel)) | first) as $release
            | $release != null
            and ([$boards[] | . as $b | $release | has_required_for_board($b)] | all)
            ' /tmp/ota-index.json >/dev/null

          echo "Verified complete published release in index: channel=$CHANNEL version=$VERSION boards=heltec-v3,tdeck-plus,heltec-v4,bramble-pager"

      - name: Remove signing key from workspace
        if: always()
        run: rm -f keys/ota_signing_key.pem /tmp/ota_signing_key.pem

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-build-artifacts
          path: |
            build-artifacts/firmware-ci/**/*.bin
            build-artifacts/firmware-ci/**/flasher_args.json
            build-artifacts/firmware-ci/**/SHA256SUMS.txt
          if-no-files-found: error
