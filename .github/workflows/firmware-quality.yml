name: Firmware Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firmware-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect changed areas
    uses: ./.github/workflows/_detect-changes.yml

  static-checks:
    name: Static checks
    needs: detect
    # No `if:` on purpose: this single-pod bundle is THE universal gate. It runs
    # on every trigger (including docs-only PRs, where it is the ONLY job that
    # executes) so a required context always reports. The individual checks are
    # cheap and pass trivially when their scope did not change. Each check is its
    # own step so a failure attributes to the exact tool in the UI.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assert required tools are pre-baked on the runner
        run: |
          for tool in shellcheck clang-format cppcheck actionlint uv; do
            command -v "$tool" >/dev/null || { echo "::error::$tool missing from runner image"; exit 1; }
          done
      - name: No internal refs
        run: bash scripts/lint/check-no-internal-refs.sh
      - name: Required shellcheck (strict wrapper)
        run: bash scripts/lint/run-shellcheck.sh --strict
      - name: Ruff (required baseline profile)
        run: uvx --from 'ruff==0.12.10' ruff check scripts --select E9,F63,F7,F82
      - name: Required clang-format (full strict scope)
        run: bash scripts/lint/run-clang-format-check.sh --strict
      - name: cppcheck
        # The scoped suppressions below are cppcheck 2.13 false positives
        # (the previous runner shipped 2.7, which did not flag them):
        # unknownMacro fires because lvgl headers are not on the include path
        # (LV_SYMBOL_RIGHT), and both uninitvar findings are loops that only
        # read entries below a count that starts at zero.
        run: |
          cppcheck --enable=warning,performance,portability --std=c11 --quiet --error-exitcode=2 --suppress=normalCheckLevelMaxBranches \
            --suppress=unknownMacro:components/ui_graphics/screens/scr_chat_messages.c \
            --suppress=uninitvar:components/ui_graphics/screens/scr_map.c \
            --suppress=uninitvar:components/ui_graphics/screens/scr_nodes.c \
            main components
      - name: RPC contract (spec vs firmware registry)
        run: bash scripts/check-rpc-contract.sh
      - name: Actionlint (PR-gating workflows)
        run: |
          actionlint -color -oneline -ignore 'shellcheck reported issue.*SC2317' -config-file .actionlint.yaml \
            .github/workflows/_detect-changes.yml \
            .github/workflows/quality.yml \
            .github/workflows/firmware-quality.yml \
            .github/workflows/webapp-quality.yml
