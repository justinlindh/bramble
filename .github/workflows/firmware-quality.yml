name: Firmware Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firmware-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # NO `detect` JOB HERE, DELIBERATELY. This workflow defines exactly one job
  # and that job has no `if:`, so it has nothing to gate on: the reusable
  # detector was called, spent a pod on a full-history checkout, computed
  # fourteen booleans, and not one of them was ever read (`static-checks`
  # referenced `needs.detect.outputs.*` zero times). Worse than the wasted
  # pod, `needs:` serialized it: the universal gate, the only job that runs on
  # a docs-only PR, could not start until that dead pod finished. If a future
  # job here does need area gating, add the `detect` job back together with
  # the `needs:` and the `if:` that reads it, never on its own.
  static-checks:
    name: Static checks
    # No `if:` on purpose: this single-pod bundle is THE universal gate. It runs
    # on every trigger (including docs-only PRs, where it is the ONLY job that
    # executes) so a required context always reports. The individual checks are
    # cheap and pass trivially when their scope did not change. Each check is its
    # own step so a failure attributes to the exact tool in the UI.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Assert required tools are pre-baked on the runner
        # ruff and markdownlint-cli2 joined this list with the bramble#222 bake
        # wave (runner image 1.2.0): both were previously fetched at run time
        # (ruff from PyPI via uvx, markdownlint via the wrapper's npx
        # fallback), which made this always-run required gate depend on
        # external registries on every PR. Their exact pinned versions are
        # asserted by their own steps below.
        run: |
          for tool in shellcheck clang-format cppcheck actionlint ruff markdownlint-cli2; do
            command -v "$tool" >/dev/null || { echo "::error::$tool missing from runner image"; exit 1; }
          done
      - name: Assert clang-format matches the pinned version
        # .clang-format-version is the single source of truth (see docs/ci.md
        # and issue #161). clang-format versions disagree on macro and
        # designated-initializer layout, so a runner drift here does not fail
        # loud, it fails as a confusing formatting diff that no local run can
        # reproduce. Fail fast and name both versions instead.
        run: |
          want="$(tr -d '[:space:]' < .clang-format-version)"
          got="$(clang-format --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [[ "$got" != "$want" ]]; then
            echo "::error::clang-format version mismatch: runner image has ${got:-unknown}, pinned version is ${want} (see .clang-format-version and docs/ci.md). Bump the runner image or .clang-format-version so they agree."
            exit 1
          fi
          echo "clang-format ${got} matches the pinned version (${want})."
      - name: No internal refs
        run: bash scripts/lint/check-no-internal-refs.sh
      - name: No em dash
        run: bash scripts/lint/check-no-em-dash.sh
      - name: Markdownlint
        # markdownlint-cli2 is baked into the runner image (bramble#222). The
        # wrapper uses the PATH binary after asserting it matches the pinned
        # version (fail-loud on image drift), and keeps its pinned `npx`
        # fallback for environments without the bake, so this step still needs
        # no install step of its own.
        run: bash scripts/lint/run-markdownlint.sh
      - name: Board matrix covers every shipped board
        # Guards the gating hole this check was added for: if a board is added
        # to scripts/ci-build-firmware.sh (the release path) without being
        # added to the board-build-smoke matrix in quality.yml, it would ship
        # with no automatic build ever compiling it.
        run: bash scripts/lint/check-board-matrix.sh
      - name: ESP-IDF version pins agree
        run: bash scripts/lint/check-idf-version.sh
      - name: Node version pins agree
        # Same anti-drift shape as the ESP-IDF check: .nvmrc is the single
        # source of truth for the Node major, and this fails loud when a CI
        # pin, a Dockerfile base image or the engines floor disagrees. The
        # shipped container image and the shipped desktop installers were
        # built on different Node majors before this existed.
        run: bash scripts/lint/check-node-version.sh
      - name: Required shellcheck (strict wrapper)
        run: bash scripts/lint/run-shellcheck.sh --strict
      - name: Ruff (required baseline profile)
        # Baked into the runner image (bramble#222); the uvx invocation this
        # replaced downloaded ruff from PyPI inside an always-run required
        # gate on every PR (and the 16-runner startup herd DNS incident broke
        # exactly that path once). The version assert fails loud on image
        # drift instead of silently linting with a different ruff.
        run: |
          want="0.12.10"
          got="$(ruff --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [[ "$got" != "$want" ]]; then
            echo "::error::ruff version mismatch: runner image has ${got:-unknown}, pinned version is ${want}. Bump RUFF_VERSION in the private runner-image definition or this pin so they agree."
            exit 1
          fi
          ruff check scripts --select E9,F63,F7,F82
      - name: Required clang-format (full strict scope)
        run: bash scripts/lint/run-clang-format-check.sh --strict
      - name: cppcheck
        # The scoped suppressions below are cppcheck 2.13 false positives
        # (the previous runner shipped 2.7, which did not flag them):
        # unknownMacro fires because lvgl headers are not on the include path
        # (LV_SYMBOL_RIGHT), and both uninitvar findings are loops that only
        # read entries below a count that starts at zero.
        run: |
          cppcheck --enable=warning,performance,portability --std=c11 --quiet --error-exitcode=2 --suppress=normalCheckLevelMaxBranches \
            --suppress=unknownMacro:components/ui_graphics/screens/scr_chat_messages.c \
            --suppress=uninitvar:components/ui_graphics/screens/scr_map.c \
            --suppress=uninitvar:components/ui_graphics/screens/scr_nodes.c \
            main components
      - name: RPC contract (spec vs firmware registry)
        run: bash scripts/check-rpc-contract.sh
      - name: Actionlint (every workflow)
        # A glob, not a hand-maintained file list. The list this replaced named
        # four workflows, so every other one (the release, publish, review-bot,
        # commit-lint, PR-template, and watchdog workflows, and any workflow
        # added later) was never linted at all. That is worse than it sounds:
        # `ci_core` deliberately excludes non-gating workflows from the heavy
        # suites, so a PR touching only an unlinted workflow got no automated
        # validation of it whatsoever, and a YAML or expression error there
        # produces NO check run, which branch protection cannot tell apart from
        # a check still pending (see docs/ci.md). Globbing means a new workflow
        # is covered by construction instead of by remembering to extend a list.
        run: |
          actionlint -color -oneline -ignore 'shellcheck reported issue.*SC2317' -config-file .actionlint.yaml \
            .github/workflows/*.yml
