name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect changed areas
    uses: ./.github/workflows/_detect-changes.yml

  host-tests:
    name: Host tests
    needs: detect
    if: needs.detect.outputs.firmware == 'true' || needs.detect.outputs.workflows == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assert host test deps are pre-baked on the runner
        run: |
          for tool in cmake make gcc g++; do
            command -v "$tool" >/dev/null || { echo "::error::$tool missing from runner image"; exit 1; }
          done
          test -f /usr/include/openssl/ssl.h || { echo "::error::libssl-dev missing from runner image"; exit 1; }
      - name: Run host test suite
        # LeakSanitizer needs ptrace, and the pod runners sit behind
        # kernel.yama.ptrace_scope=2 (admin-only ptrace), where an added
        # SYS_PTRACE capability never reaches a non-root process's effective
        # set on its own. The scale set adds SYS_PTRACE to the container
        # bounding set; this wrapper re-enters the same uid/gid with the cap
        # made ambient so every test process inherits it. On hosted runners
        # (ptrace_scope<=1) the wrapper is a harmless no-op.
        run: |
          sudo -nE env "PATH=$PATH" setpriv --reuid="$(id -u)" --regid="$(id -g)" \
            --init-groups --inh-caps +sys_ptrace --ambient-caps +sys_ptrace \
            bash test/run_all_tests.sh

  board-build-smoke:
    name: Board build smoke (heltec-v3)
    needs: detect
    if: |
      github.event_name != 'pull_request' &&
      (needs.detect.outputs.firmware == 'true' || needs.detect.outputs.workflows == 'true')
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ESP-IDF toolchain
        run: bash scripts/ci-ensure-idf.sh
      - name: Build heltec-v3 via wrapper
        env:
          HOME: /tmp/cihome
          ESP_ROM_ELF_DIR: /tmp/esp-rom-elf
          # Smoke artifacts are discarded; a throwaway signing key is fine here.
          BRAMBLE_OTA_ALLOW_GENERATED_KEY: "1"
        run: |
          mkdir -p "$HOME" "$ESP_ROM_ELF_DIR"
          # shellcheck disable=SC1091
          source scripts/ci-source-idf.sh
          bash scripts/flash.sh local heltec-v3 build

  gosim-integration:
    name: gosim integration
    needs: detect
    if: |
      needs.detect.outputs.firmware == 'true' ||
      needs.detect.outputs.simulator == 'true' ||
      needs.detect.outputs.workflows == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Assert cgo build deps are pre-baked on the runner
        run: |
          command -v gcc >/dev/null || { echo "::error::gcc missing from runner image"; exit 1; }
          test -f /usr/include/openssl/ssl.h || { echo "::error::libssl-dev missing from runner image"; exit 1; }
      - name: Build and test the gosim simulator
        # gosim is a multi-node mesh simulator that compiles the real firmware
        # routing/packet/crypto components via cgo (all.c) and drives them end to
        # end. Running it in CI catches component drift into the simulator and
        # routing regressions the board-build-only handlers never exercise.
        run: |
          cd simulator/gosim
          go build ./...
          # -count=1 defeats go's test cache, which can serve stale results
          # across cgo-compiled C edits (observed on this runner setup).
          go test -count=1 ./...

  emulator:
    name: Emulator suite (advisory)
    # Merged scenario suite + browser E2E: builds the linux firmware node,
    # gosim, and the UI ONCE, then runs the headless scenarios followed by the
    # browser E2E. NON-REQUIRED (advisory): it runs on every PR to give signal
    # but does not gate merges. The scenario step runs its two scenarios in
    # PARALLEL (separate gosim processes, each keyed to its own PID for socket
    # path and node-state dir, so no port/state collision) with trimmed retry
    # budgets. The E2E step is continue-on-error while it bakes.
    needs: detect
    if: |
      needs.detect.outputs.firmware == 'true' ||
      needs.detect.outputs.simulator == 'true' ||
      needs.detect.outputs.emulator == 'true' ||
      needs.detect.outputs.workflows == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Mark workspace safe for git inside the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ensure ESP-IDF toolchain
        run: bash scripts/ci-ensure-idf.sh
      - name: Build the linux firmware node
        env:
          HOME: /tmp/cihome
          ESP_ROM_ELF_DIR: /tmp/esp-rom-elf
          # The node is a host binary; a throwaway signing key is fine here.
          BRAMBLE_OTA_ALLOW_GENERATED_KEY: "1"
        run: |
          mkdir -p "$HOME" "$ESP_ROM_ELF_DIR"
          # shellcheck disable=SC1091
          source scripts/ci-source-idf.sh
          cd emulator/node
          idf.py --preview set-target linux
          idf.py build
      - name: Build gosim
        run: |
          cd simulator/gosim
          go build -o bramble-gosim .
      - name: Build the UI
        run: |
          cd simulator/ui
          npm ci
          npm run build
      - name: Run headless scenario suite
        # Real-time multi-node scenarios; the two run in parallel inside the
        # script. Gates on delivered/rendered content (channel message on
        # screen; DM desync symptom + #138 self-heal).
        run: bash emulator/ci/run_scenarios.sh
      - name: Run browser E2E suite
        # Real headless Chromium against a real UI build (Task 13). Advisory
        # while it bakes: a failure here does not fail the job.
        continue-on-error: true
        run: bash emulator/e2e/run_e2e.sh
