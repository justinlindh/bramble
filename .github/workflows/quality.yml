name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# PR runs share a per-ref group and newer pushes cancel older runs. Main
# pushes get a per-SHA group instead: a shared group would let a rapid merge
# train cancel the pending run of an already-merged commit (GitHub keeps at
# most one pending run per group), leaving that commit on trunk with no
# quality run and the badge showing the cancelled run as failing (observed
# 2026-08-04, commits f6a8760f and 30f108d4).
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect changed areas
    uses: ./.github/workflows/_detect-changes.yml

  host-tests:
    name: Host tests
    needs: detect
    # coverage_tooling: the Host coverage ratchet step below runs the coverage
    # scripts and reads ci/coverage-baseline.json, so a ratchet-only change must
    # re-run this job to self-verify.
    if: |
      needs.detect.outputs.firmware == 'true' ||
      needs.detect.outputs.host_test == 'true' ||
      needs.detect.outputs.coverage_tooling == 'true' ||
      needs.detect.outputs.ci_core == 'true'
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs, pushes, and dispatches follow
    # RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Restore crypto dependency sources
        # The ASan and coverage build trees share one FetchContent download
        # dir (test/build-deps, set in test/CMakeLists.txt), cached so the
        # pinned mbedtls/Monocypher archives are not re-fetched every run.
        uses: actions/cache@v6
        with:
          path: test/build-deps
          key: host-test-deps-${{ hashFiles('components/crypto/crypto_deps.cmake') }}
      - name: Assert host test deps are pre-baked on the runner
        run: |
          for tool in cmake make gcc g++; do
            command -v "$tool" >/dev/null || { echo "::error::$tool missing from runner image"; exit 1; }
          done
          test -f /usr/include/openssl/ssl.h || { echo "::error::libssl-dev missing from runner image"; exit 1; }
      - name: Run host test suite
        # LeakSanitizer needs ptrace, and the pod runners sit behind
        # kernel.yama.ptrace_scope=2 (admin-only ptrace), where an added
        # SYS_PTRACE capability never reaches a non-root process's effective
        # set on its own. The scale set adds SYS_PTRACE to the container
        # bounding set; this wrapper re-enters the same uid/gid with the cap
        # made ambient so every test process inherits it. On hosted runners
        # (ptrace_scope<=1) the wrapper is a harmless no-op.
        run: |
          sudo -nE env "PATH=$PATH" setpriv --reuid="$(id -u)" --regid="$(id -g)" \
            --init-groups --inh-caps +sys_ptrace --ambient-caps +sys_ptrace \
            bash test/run_all_tests.sh
      - name: Host coverage ratchet
        # A second, gcov-instrumented build (ASan off) in test/build-coverage/.
        # It aggregates line coverage over product code (components/, main/) with
        # scripts/ci/host_coverage.py using only gcov + python3 (no gcovr, so no
        # pip install can strand this required gate), then fails if coverage drops
        # more than the tolerance below ci/coverage-baseline.json. The pristine
        # ASan run above stays the pass/fail gate; this run only needs execution.
        run: bash scripts/ci/run-host-coverage.sh

  board-build-smoke:
    name: Board build smoke (${{ matrix.board }})
    # Covers ESP-IDF board targets. The nRF52840 boards (Wio-WM1110 dev kit and
    # SenseCAP T1000-E) build in the separate nRF52840 build job below.
    # scripts/ci-build-firmware.sh has always listed four boards, but only heltec-v3 was ever built by an
    # automatic run, so a change to components/display or components/ui_graphics
    # could break the other three with every required context green until
    # someone manually dispatched a release build. The four targets diverge on
    # display stack (ST7789/LVGL vs SSD1680 e-paper vs SSD1306), touch,
    # keyboard, and trackball, so heltec-v3 alone does not represent them.
    #
    # This also drops the former `github.event_name != 'pull_request'` guard:
    # the build now gates PRs, which is the whole point (breakage must surface
    # before merge, not at release). ccache makes that affordable.
    #
    # CONTEXT NAMES: this matrix produces four contexts, "Board build smoke
    # (heltec-v3)", "(tdeck-plus)", "(heltec-v4)", and "(bramble-pager)". The
    # heltec-v3 one keeps the exact name the un-matrixed job had, so the
    # existing required check is preserved; the other three are NEW required
    # context names and can be added to branch protection.
    #
    # THE AREA GATE IS ON THE STEPS, NOT THE JOB, AND MUST STAY THERE.
    # A job-level `if:` that evaluates false stops GitHub from ever expanding
    # the matrix: instead of four check runs it publishes a single one carrying
    # the raw literal "Board build smoke (${{ matrix.board }})". Required
    # contexts named after the expanded legs would then never report on a
    # docs-only, webapp-only, or dependency PR, and branch protection would
    # wait for them forever. Gating each step instead keeps the matrix
    # unconditional: every leg always produces its real context, and out of
    # scope it reports success having done no work. That is what the
    # always-report contract in docs/ci.md requires.
    needs: detect
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs, pushes, and dispatches follow
    # RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      # Every board reports its own result. Cancelling siblings on the first
      # failure would hide whether a break is one board or all four, which is
      # exactly the information this matrix exists to produce.
      fail-fast: false
      # The self-hosted pool is small and shares pods with the host tests,
      # gosim, and the emulator suite. Two board builds at a time keeps the
      # rest of the wave moving; queued jobs do not burn their own timeout.
      max-parallel: 2
      matrix:
        board: [heltec-v3, tdeck-plus, heltec-v4, bramble-pager]
    steps:
      - uses: actions/checkout@v7
        if: needs.detect.outputs.firmware == 'true' || needs.detect.outputs.idf_build_scripts == 'true' || needs.detect.outputs.size_tooling == 'true' || needs.detect.outputs.ci_core == 'true'
      - name: Ensure ESP-IDF toolchain
        if: needs.detect.outputs.firmware == 'true' || needs.detect.outputs.idf_build_scripts == 'true' || needs.detect.outputs.size_tooling == 'true' || needs.detect.outputs.ci_core == 'true'
        run: bash scripts/ci-ensure-idf.sh
      - name: Configure ccache
        id: ccache
        if: needs.detect.outputs.firmware == 'true' || needs.detect.outputs.idf_build_scripts == 'true' || needs.detect.outputs.size_tooling == 'true' || needs.detect.outputs.ci_core == 'true'
        # Sets IDF_CCACHE_ENABLE (the env switch idf.py reads to put ccache in
        # front of the compiler) and pins CCACHE_DIR outside the workspace and
        # outside the overridden HOME the build step uses. Emits the ESP-IDF
        # version so the cache key can key on it: a toolchain bump must not
        # reuse objects built by the previous compiler.
        run: bash scripts/ci-ccache-env.sh
      - name: Restore ccache
        # continue-on-error: ccache is an accelerator, not a gate (see
        # docs/ci.md). A cache-service outage or a DNS blip on the pod must
        # cost a cold build, never a red check: on 2026-07-24 a transient
        # EAI_AGAIN resolving results-receiver.actions.githubusercontent.com
        # failed this step after its internal retries and took the whole
        # board leg with it. The build below tolerates an empty CCACHE_DIR
        # (plain cold compile), so nothing downstream needs this step's
        # outcome. This is the accelerator exception to the no-advisory-tier
        # rule, not a check being softened: no terminal step is needed
        # because no correctness signal is produced here.
        continue-on-error: true
        if: |
          (needs.detect.outputs.firmware == 'true' ||
           needs.detect.outputs.idf_build_scripts == 'true' ||
           needs.detect.outputs.size_tooling == 'true' ||
           needs.detect.outputs.ci_core == 'true') &&
          steps.ccache.outputs.available == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.ccache.outputs.dir }}
          key: ccache-${{ matrix.board }}-idf${{ steps.ccache.outputs.idf_version }}-${{ hashFiles('sdkconfig.defaults*', 'CMakeLists.txt', 'partitions*.csv') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.board }}-idf${{ steps.ccache.outputs.idf_version }}-${{ hashFiles('sdkconfig.defaults*', 'CMakeLists.txt', 'partitions*.csv') }}-
            ccache-${{ matrix.board }}-idf${{ steps.ccache.outputs.idf_version }}-
      - name: Build ${{ matrix.board }} via wrapper
        if: needs.detect.outputs.firmware == 'true' || needs.detect.outputs.idf_build_scripts == 'true' || needs.detect.outputs.size_tooling == 'true' || needs.detect.outputs.ci_core == 'true'
        env:
          HOME: /tmp/cihome
          ESP_ROM_ELF_DIR: /tmp/esp-rom-elf
          # Smoke artifacts are discarded; a throwaway signing key is fine here.
          BRAMBLE_OTA_ALLOW_GENERATED_KEY: "1"
        run: |
          mkdir -p "$HOME" "$ESP_ROM_ELF_DIR"
          # shellcheck disable=SC1091
          source scripts/ci-source-idf.sh
          bash scripts/flash.sh local "${{ matrix.board }}" build
      - name: Firmware size ratchet (${{ matrix.board }})
        # Real esp32s3 flash-image and static-DRAM tracking on the board that was
        # just built. This is PR-time because the board build now gates PRs (four
        # boards, ccache): scripts/ci/check-firmware-size.sh reads bramble.bin and
        # `idf.py size` and fails when either grows past ci/size-baseline.json plus
        # tolerance, so a silent tens-of-KiB flash bloat or a shrinking RAM margin
        # (this project shipped a stack overflow only hardware caught) surfaces
        # before merge. Same area gate as the build so it never runs without one.
        if: needs.detect.outputs.firmware == 'true' || needs.detect.outputs.idf_build_scripts == 'true' || needs.detect.outputs.size_tooling == 'true' || needs.detect.outputs.ci_core == 'true'
        env:
          HOME: /tmp/cihome
          ESP_ROM_ELF_DIR: /tmp/esp-rom-elf
        run: |
          mkdir -p "$HOME" "$ESP_ROM_ELF_DIR"
          # shellcheck disable=SC1091
          source scripts/ci-source-idf.sh
          bash scripts/ci/check-firmware-size.sh "${{ matrix.board }}"
      - name: ccache statistics
        if: |
          always() &&
          (needs.detect.outputs.firmware == 'true' ||
           needs.detect.outputs.idf_build_scripts == 'true' ||
           needs.detect.outputs.size_tooling == 'true' ||
           needs.detect.outputs.ci_core == 'true') &&
          steps.ccache.outputs.available == 'true'
        run: ccache --show-stats

  fuzz:
    name: Parser fuzzing
    # Bounded libFuzzer campaign over components/packet/packet.c and the
    # fragment reassembler, the code that parses attacker-controlled LoRa
    # frames before any AEAD tag or HMAC is verified (issue #76). The seed
    # corpora are committed, so 30 seconds per target is a real gate rather
    # than a coin flip: the run starts from valid frames of every wire type
    # instead of rediscovering the formats from scratch.
    needs: detect
    # The fuzz harness lives under test/fuzz/ (host_test) and compiles the parser
    # from components/ (firmware); either moving is a reason to re-fuzz.
    if: |
      needs.detect.outputs.firmware == 'true' ||
      needs.detect.outputs.host_test == 'true' ||
      needs.detect.outputs.ci_core == 'true'
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs, pushes, and dispatches follow
    # RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Assert clang with libFuzzer is pre-baked on the runner
        # Hard failure, never a skip. A missing toolchain that silently
        # passed the job would be an advisory check in disguise, which
        # docs/quality-policy.md forbids. run_fuzz.sh repeats this probe so
        # a local run fails the same way.
        run: |
          command -v clang >/dev/null || { echo "::error::clang missing from runner image (needed for libFuzzer)"; exit 1; }
          clang --version
      - name: Run bounded fuzzing campaign
        env:
          FUZZ_SECONDS: '30'
        run: bash test/fuzz/run_fuzz.sh
      - name: Upload crash reproducers on failure
        # The reproducing input is the entire value of a fuzz finding, and
        # it lives in a pod that is about to disappear.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/fuzz/artifacts/
          retention-days: 14
          if-no-files-found: ignore

  nrf-build:
    name: nRF52840 build
    # Builds the bare-metal nRF52840 target (nrf/, bare FreeRTOS + nrfx, no
    # ESP-IDF) with arm-none-eabi-gcc. The build itself enforces the RAM
    # budget gate (nrf/scripts/size_report.py runs post-link and fails over
    # budget). Compiles components/ sources directly, so the firmware area
    # re-runs it too.
    needs: detect
    if: |
      needs.detect.outputs.firmware == 'true' ||
      needs.detect.outputs.nrf == 'true' ||
      needs.detect.outputs.ci_core == 'true'
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs, pushes, and dispatches follow
    # RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Assert baked ARM toolchain matches the pin
        # arm-none-eabi-gcc + newlib-nano are baked into the runner image
        # (image 1.3.0), the same Noble distro package this job used to
        # apt-get install per run on ubuntu-latest, so the compiler the job
        # builds with does not change. ninja, ccache and cmake were already
        # baked. Per the bramble#222 bake contract the job asserts the pin
        # instead of installing and fails loud on image drift.
        run: |
          command -v arm-none-eabi-gcc >/dev/null || { echo "::error::arm-none-eabi-gcc missing from runner image (bramble#222 bake contract, image 1.3.0)"; exit 1; }
          want="13.2.1"
          got="$(arm-none-eabi-gcc --version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [[ "$got" != "$want" ]]; then
            echo "::error::arm-none-eabi-gcc version mismatch: runner image has ${got:-unknown}, pinned version is ${want}. Bump ARM_GCC_VERSION in the private runner-image definition or this pin so they agree."
            exit 1
          fi
          ninja --version
          ccache --version | head -1
      - name: Restore pinned dependency sources
        uses: actions/cache@v6
        with:
          path: |
            nrf/build/_deps
            nrf/build-t1000e/_deps
          key: nrf-deps-${{ hashFiles('nrf/CMakeLists.txt', 'components/crypto/crypto_deps.cmake') }}
          # The key hashes the whole CMakeLists, which changes for many
          # non-dependency reasons; the fallback restore lets FetchContent
          # re-verify stamps and fetch only what actually moved.
          restore-keys: nrf-deps-
      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: nrf-ccache-${{ github.sha }}
          restore-keys: nrf-ccache-
      - name: Configure and build (includes the RAM budget gate)
        # Both shipping configurations build: the dev kit (swd layout, the
        # default) and the T1000-E (uf2 layout, its own board header and UF2
        # packaging). Each build runs the RAM budget gate post-link, so a
        # change that fits one board but blows the other's budget fails here
        # instead of on someone's bench. ccache is shared across the two, so
        # the second build recompiles only the board-conditional objects.
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S nrf -B nrf/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_ASM_COMPILER_LAUNCHER=ccache
          cmake --build nrf/build
          cmake -S nrf -B nrf/build-t1000e -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DBRAMBLE_NRF_BOARD=t1000e -DBRAMBLE_NRF_LAYOUT=uf2 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_ASM_COMPILER_LAUNCHER=ccache
          cmake --build nrf/build-t1000e
          ccache -s | head -6
      - name: Upload memory report
        uses: actions/upload-artifact@v7
        with:
          name: nrf-size-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            nrf/build/size-report.json
            nrf/build-t1000e/size-report.json
          retention-days: 14

  release-config:
    name: Release config
    # Two release/publish-pipeline node tests share this pod because both need
    # only a node runtime and nothing else. The steps are gated INDIVIDUALLY on
    # their own areas (not the job) so neither pays the other's cost:
    #   - release_config (.releaserc.* + scripts/release/ + root package.json):
    #     the per-component semantic-release configs and the squash-expander they
    #     wrap decide whether any binary ever publishes; a silent scope-gating
    #     regression stops every release. That test needs npm ci.
    #   - ota_index: the OTA firmware-index validator that publish-firmware-release.sh
    #     runs on its generated index.json; a schema regression would ship an index
    #     the OTA journey cannot consume. That test needs no deps.
    # The job runs whenever either area (or ci_core, the safety rule) changed, and
    # each step's if: keeps an index-only change off npm ci and a config-only change
    # off the validator test. The context name is unchanged so branch protection is
    # untouched.
    needs: detect
    if: needs.detect.outputs.release_config == 'true' || needs.detect.outputs.ota_index == 'true' || needs.detect.outputs.ci_core == 'true'
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs, pushes, and dispatches follow
    # RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install semantic-release analyzer deps
        # The regression test loads the real .releaserc.<component>.cjs files,
        # which require the analyzer packages at load time. Installing from the
        # root lockfile, exactly as release-components.yml does, is what makes
        # the test exercise the versions that actually cut releases: a
        # hand-listed set of major ranges here could drift from the release job
        # and pass against code the pipeline never runs.
        if: needs.detect.outputs.release_config == 'true' || needs.detect.outputs.ci_core == 'true'
        run: npm ci --no-audit --no-fund
      - name: Release-rule scope-gating regression
        # Asserts, per component, that an in-scope fix/feat/perf/breaking cuts
        # the right release level and that out-of-scope / non-releasing commits
        # do not. Guards the { scope: '*', release: false } catch-all bug that
        # suppressed every component release.
        if: needs.detect.outputs.release_config == 'true' || needs.detect.outputs.ci_core == 'true'
        run: node scripts/release/semantic-release-squash-expander.test.cjs
      - name: OTA firmware-index validator
        # Pins scripts/validate-firmware-index.js to docs/ota-release-schema.md:
        # a schema-complete index validates, one missing required fields fails
        # and names them. No npm deps: it spawns node against the committed
        # fixtures.
        if: needs.detect.outputs.ota_index == 'true' || needs.detect.outputs.ci_core == 'true'
        run: node test/test-validate-firmware-index.js

  gosim-integration:
    name: gosim integration
    needs: detect
    # coverage_tooling: the gosim coverage ratchet step runs check_coverage.py
    # against ci/coverage-baseline.json, so a ratchet-only change re-runs it.
    if: |
      needs.detect.outputs.firmware == 'true' ||
      needs.detect.outputs.simulator == 'true' ||
      needs.detect.outputs.coverage_tooling == 'true' ||
      needs.detect.outputs.ci_core == 'true'
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs, pushes, and dispatches follow
    # RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
      - name: Assert cgo build deps are pre-baked on the runner
        run: |
          command -v gcc >/dev/null || { echo "::error::gcc missing from runner image"; exit 1; }
          test -f /usr/include/openssl/ssl.h || { echo "::error::libssl-dev missing from runner image"; exit 1; }
      - name: Build and test the gosim simulator
        # gosim is a multi-node mesh simulator that compiles the real firmware
        # routing/packet/crypto components via cgo (all.c) and drives them end to
        # end. Running it in CI catches component drift into the simulator and
        # routing regressions the board-build-only handlers never exercise.
        run: |
          cd simulator/gosim
          go build ./...
          # -count=1 defeats go's test cache, which can serve stale results
          # across cgo-compiled C edits (observed on this runner setup).
          # -covermode=set -coverprofile captures coverage in this same run so
          # the ratchet step below needs no second (timing-sensitive) go test.
          go test -covermode=set -coverprofile=cover.out -count=1 ./...
      - name: gosim coverage ratchet
        # Ratchet the coverage captured by the test run above against
        # ci/coverage-baseline.json. Go coverage is toolchain-stable, so this
        # number matches locally and on the pods.
        run: |
          cd simulator/gosim
          PCT="$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/,"",$NF); print $NF}')"
          echo "gosim total statement coverage: ${PCT}%"
          python3 "$GITHUB_WORKSPACE/scripts/ci/check_coverage.py" gosim "$PCT"

  emulator:
    name: Emulator suite
    # Merged scenario suite + browser E2E: builds the linux firmware node,
    # gosim, and the UI ONCE, then runs the headless scenarios followed by the
    # browser E2E. GATING: this job is a required merge context. The two suite
    # steps carry continue-on-error ONLY as an error-collection mechanism (a
    # single run always reports both suites' results even when the first
    # fails); the terminal "Fail if any suite failed" step turns either
    # failure into the job's failure, so nothing here is advisory.
    needs: detect
    if: |
      needs.detect.outputs.firmware == 'true' ||
      needs.detect.outputs.simulator == 'true' ||
      needs.detect.outputs.emulator == 'true' ||
      needs.detect.outputs.idf_build_scripts == 'true' ||
      needs.detect.outputs.ci_core == 'true'
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs, pushes, and dispatches follow
    # RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Sized for the scenario suite's starvation headroom, not the healthy
    # path: emu-dm-desync may legitimately use up to ~21 min of wall clock on
    # a CPU-starved pod (see the budget comment in
    # emulator/ci/run_scenarios.sh) on top of the builds, the other
    # scenarios, and the browser E2E. A healthy run still completes in
    # roughly 6 to 8 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Mark workspace safe for git inside the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Ensure ESP-IDF toolchain
        run: bash scripts/ci-ensure-idf.sh
      - name: Configure ccache
        id: ccache
        run: bash scripts/ci-ccache-env.sh
      - name: Restore ccache
        # continue-on-error for the same accelerator-not-gate reason as the
        # board matrix's restore step above: a cache-service or DNS blip
        # costs a cold build, never a red Emulator suite.
        continue-on-error: true
        if: steps.ccache.outputs.available == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.ccache.outputs.dir }}
          key: ccache-emulator-linux-idf${{ steps.ccache.outputs.idf_version }}-${{ hashFiles('emulator/node/sdkconfig.defaults*', 'emulator/node/CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            ccache-emulator-linux-idf${{ steps.ccache.outputs.idf_version }}-${{ hashFiles('emulator/node/sdkconfig.defaults*', 'emulator/node/CMakeLists.txt') }}-
            ccache-emulator-linux-idf${{ steps.ccache.outputs.idf_version }}-
      - name: Build the linux firmware node
        env:
          HOME: /tmp/cihome
          ESP_ROM_ELF_DIR: /tmp/esp-rom-elf
          # The node is a host binary; a throwaway signing key is fine here.
          BRAMBLE_OTA_ALLOW_GENERATED_KEY: "1"
        run: |
          mkdir -p "$HOME" "$ESP_ROM_ELF_DIR"
          # shellcheck disable=SC1091
          source scripts/ci-source-idf.sh
          cd emulator/node
          idf.py --preview set-target linux
          idf.py build
      - name: Build the Heltec OLED firmware node
        # The e2e suite's heltec-oled.spec.ts (added in #62) self-skips unless
        # emulator/node/build-heltec/bramble-node.elf exists, so without this
        # step the OLED render path added in #62 ships unexercised by CI.
        # build_node_heltec.sh builds the Heltec/OLED profile into its own build
        # dir and sdkconfig, coexisting with the pager build above.
        env:
          HOME: /tmp/cihome
          ESP_ROM_ELF_DIR: /tmp/esp-rom-elf
          # The node is a host binary; a throwaway signing key is fine here.
          BRAMBLE_OTA_ALLOW_GENERATED_KEY: "1"
        run: |
          mkdir -p "$HOME" "$ESP_ROM_ELF_DIR"
          # shellcheck disable=SC1091
          source scripts/ci-source-idf.sh
          bash emulator/scripts/build_node_heltec.sh
      - name: ccache statistics
        if: always() && steps.ccache.outputs.available == 'true'
        run: ccache --show-stats
      - name: Build gosim
        run: |
          cd simulator/gosim
          go build -o bramble-gosim .
      - name: Build and test the UI
        run: |
          cd simulator/ui
          npm ci
          npm test
          npm run build
      - name: Run headless scenario suite
        # Real-time multi-node scenarios, run sequentially inside the script.
        # Gates on delivered/rendered content (channel message on screen; DM
        # desync symptom + #138 self-heal). continue-on-error is error
        # collection only: the E2E step below still runs and reports, and the
        # terminal step fails the job on this step's failure.
        id: scenarios
        continue-on-error: true
        env:
          EMU_CI_LOG_DIR: ${{ runner.temp }}/emu-scenario-logs
        run: bash emulator/ci/run_scenarios.sh
      - name: Run browser E2E suite
        # Real headless Chromium against a real UI build (Task 13). Gates via
        # the terminal step; continue-on-error is error collection only, so a
        # scenario failure and an E2E failure both surface in one run.
        id: e2e
        continue-on-error: true
        run: bash emulator/e2e/run_e2e.sh
      - name: Upload scenario logs on failure
        # The full gosim event logs (frames, console, deaths) outlive the pod
        # so a failure's evidence is never lost to a discarded mktemp.
        if: steps.scenarios.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: emu-scenario-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/emu-scenario-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Fail if any suite failed
        # The terminal gate for the collect-then-fail pattern above: the two
        # suite steps never fail the job directly (so both always report), and
        # this step turns any suite failure into the job failure the required
        # merge context sees.
        run: |
          failed=0
          [ "${{ steps.scenarios.outcome }}" = "success" ] || { echo "::error::headless scenario suite failed"; failed=1; }
          [ "${{ steps.e2e.outcome }}" = "success" ] || { echo "::error::browser E2E suite failed"; failed=1; }
          exit "$failed"

  docker-build:
    name: Docker build (${{ matrix.image }})
    # Issue #195: no workflow built the shipped Dockerfiles, so a base-image
    # bump could merge with every required context green and nothing having
    # ever constructed the image. This job builds each covered Dockerfile
    # (never pushes; it exists to catch a broken build before merge, not to
    # publish) so future Dependabot docker bumps are self-verifying.
    #
    # COVERAGE: all four shipped Dockerfiles (webapp, simulator, emulator,
    # firmware-builder). The gate caught a real latent bug in the emulator
    # image on its first run: emulator/Dockerfile's ESP-IDF stage resolves
    # managed components (libsodium, lvgl) from the Espressif component
    # registry at build time, and the manager bundled with v5.4.1 defaulted
    # to the dead api.components.espressif.com subdomain, so the image had
    # never been buildable from a clean checkout. The registry-URL pin in
    # emulator/Dockerfile fixes that for CI and developers alike.
    #
    # RUNNER + CACHING: these legs run on GitHub-hosted ubuntu-latest, not
    # the self-hosted pool, because the caching model requires it. The pool's
    # runner pods provide docker through an ephemeral dind sidecar whose
    # daemon state dies with the pod, so every build there was fully cold
    # (neither the layer cache nor the Dockerfiles' cache mounts survived a
    # single job) and multi-GB image builds competed with the firmware
    # suites for pool pods and pool disk I/O. Hosted runners ship docker and
    # buildx ready for the GitHub cache service backend: each leg restores
    # and saves its layer cache with type=gha under a per-image scope,
    # mode=max so intermediate multi-stage layers are cached too, which is
    # where the dependency-install cost lives. The Dockerfiles order their
    # dependency layers before any source COPY, so on a warm cache an
    # ordinary code change rebuilds only the final compile layers. Hosted
    # runners also reach components-file.espressif.com from the default
    # build network, which retires the `--network=host` workaround the
    # emulator leg needed on the pool (the component file host was not
    # reachable from the build's default bridge network there).
    #
    # THE AREA GATE IS ON THE STEPS, NOT THE JOB, AND MUST STAY THERE: see
    # Board build smoke's comment above for why a job-level `if:` on a matrix
    # job strands the expanded contexts. Every leg here always reports its
    # own real "Docker build (<image>)" context; out of scope, it does no
    # work and reports success.
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every image reports its own result, same reasoning as Board build
      # smoke: a webapp-only bump breaking the emulator image (or vice versa)
      # must not hide behind a cancelled sibling. No max-parallel: the legs
      # run on isolated hosted VMs, so there is no shared pool to protect.
      fail-fast: false
      matrix:
        include:
          - image: webapp
            dockerfile: webapp/Dockerfile
            context: webapp
          - image: simulator
            dockerfile: simulator/Dockerfile
            context: .
          - image: emulator
            dockerfile: emulator/Dockerfile
            context: .
          - image: firmware-builder
            dockerfile: docker/firmware-builder/Dockerfile
            context: docker/firmware-builder
    steps:
      - name: Decide whether this leg builds
        # Compute the per-leg area gate ONCE here (always runs, no `if:`), so
        # the remaining steps carry a single `if:` on this output instead of
        # repeating the expression. Each image gates on the union of areas its
        # Dockerfile's COPY instructions actually read (see docs/ci.md):
        # webapp on webapp + web_flasher (the staging step feeds web-flasher/
        # into its build context); simulator on simulator/firmware (it COPYs main/ +
        # components/ for its cgo build); emulator on emulator/simulator/firmware
        # (it additionally builds the linux firmware node and gosim);
        # firmware-builder on docker_firmware_builder ONLY (its build context is
        # docker/firmware-builder/, a toolchain image that does not COPY main/ or
        # components/, so a firmware source change must NOT rebuild it). ci_core
        # (a job-defining workflow edit) is OR'd into every leg per the
        # always-report safety rule.
        id: gate
        env:
          IMAGE: ${{ matrix.image }}
          WEBAPP: ${{ needs.detect.outputs.webapp }}
          WEB_FLASHER: ${{ needs.detect.outputs.web_flasher }}
          SIMULATOR: ${{ needs.detect.outputs.simulator }}
          EMULATOR: ${{ needs.detect.outputs.emulator }}
          FIRMWARE: ${{ needs.detect.outputs.firmware }}
          DOCKER_FW_BUILDER: ${{ needs.detect.outputs.docker_firmware_builder }}
          CI_CORE: ${{ needs.detect.outputs.ci_core }}
        run: |
          set -euo pipefail
          build=false
          case "$IMAGE" in
            # web_flasher too: the staging step below copies web-flasher/ into
            # webapp/public/web-flasher before the build, exactly as the publish
            # workflow does, so the shipped webapp image CONTAINS web-flasher
            # and a web-flasher-only change must rebuild-verify this leg.
            webapp)  { [ "$WEBAPP" = true ] || [ "$WEB_FLASHER" = true ]; } && build=true ;;
            simulator) { [ "$SIMULATOR" = true ] || [ "$FIRMWARE" = true ]; } && build=true ;;
            emulator) { [ "$EMULATOR" = true ] || [ "$SIMULATOR" = true ] || [ "$FIRMWARE" = true ]; } && build=true ;;
            firmware-builder) [ "$DOCKER_FW_BUILDER" = true ] && build=true ;;
          esac
          [ "$CI_CORE" = true ] && build=true
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "leg=${IMAGE} build=${build}"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.build == 'true'
      - name: Stage web-flasher into the webapp build context
        # webapp/Dockerfile's `COPY . .` expects webapp/public/web-flasher/ to
        # be populated, but that path is gitignored (.gitignore) and only ever
        # filled by copying the top-level web-flasher/ tree in first, exactly
        # as webapp-build-publish.yml's "Build and test webapp" step does
        # before it builds the shipped image. Without this, the webapp leg
        # would still build (Vite does not require the dir to exist) but would
        # silently produce an image missing web-flasher, so it would not be
        # verifying the same image that actually ships. Only the webapp leg
        # needs it.
        if: matrix.image == 'webapp' && steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          rm -rf webapp/public/web-flasher
          mkdir -p webapp/public/web-flasher
          cp -a web-flasher/. webapp/public/web-flasher/
      - name: Set up Docker Buildx
        # The docker-container driver this configures is what makes the
        # type=gha cache exporter below available; the hosted image's default
        # docker driver cannot export a layer cache.
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.image }} image (verify only, no push)
        # No push, no load: a successful build IS the assertion. The layer
        # cache round-trips through the GitHub cache service under a
        # per-image scope; mode=max caches intermediate stage layers (the
        # toolchain and dependency-install layers), so a warm build re-runs
        # only the layers a change actually busts. Cache entries follow the
        # same branch scoping as actions/cache: a PR restores from its own
        # branch or from main, and the post-merge push run on main is what
        # publishes the shared warm cache.
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=docker-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.image }}
