# Reusable change-detection workflow. Each PR-gating workflow (quality.yml,
# firmware-quality.yml, webapp-quality.yml) calls this ONCE via `uses:` so the
# diff-to-area mapping lives in a single place instead of being copy-pasted into
# every workflow. It never gates anything itself: it only emits boolean area
# outputs the caller's real jobs skip on via job-level `if:` (see docs/ci.md for
# the always-report contract). A workflow-file change forces every area true so a
# changed job definition is always exercised (the safety rule).
name: Detect changed areas (reusable)

on:
  workflow_call:
    outputs:
      firmware:
        description: main/ components/ test/ api/ scripts/ .releaserc.* and firmware build/lint config touched
        value: ${{ jobs.detect.outputs.firmware }}
      simulator:
        description: simulator/ touched
        value: ${{ jobs.detect.outputs.simulator }}
      emulator:
        description: emulator/ touched
        value: ${{ jobs.detect.outputs.emulator }}
      webapp:
        description: webapp/ touched
        value: ${{ jobs.detect.outputs.webapp }}
      web_flasher:
        description: web-flasher/ touched
        value: ${{ jobs.detect.outputs.web_flasher }}
      workflows:
        description: any .github/workflows file or .actionlint.yaml touched (forces everything)
        value: ${{ jobs.detect.outputs.workflows }}
      docs:
        description: docs/ or README.md touched
        value: ${{ jobs.detect.outputs.docs }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect changed areas
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.detect.outputs.firmware }}
      simulator: ${{ steps.detect.outputs.simulator }}
      emulator: ${{ steps.detect.outputs.emulator }}
      webapp: ${{ steps.detect.outputs.webapp }}
      web_flasher: ${{ steps.detect.outputs.web_flasher }}
      workflows: ${{ steps.detect.outputs.workflows }}
      docs: ${{ steps.detect.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute changed areas
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          resolve_diff_range() {
            if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" && -n "${GITHUB_BASE_REF:-}" ]]; then
              git fetch --no-tags origin "${GITHUB_BASE_REF}" >/dev/null 2>&1
              if git rev-parse --verify "origin/${GITHUB_BASE_REF}" >/dev/null 2>&1; then
                echo "origin/${GITHUB_BASE_REF}...HEAD"
                return 0
              fi
            fi

            if [[ "${GITHUB_EVENT_NAME:-}" == "push" ]]; then
              if [[ -n "${BEFORE_SHA:-}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
                if git cat-file -e "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
                  echo "${BEFORE_SHA}..HEAD"
                  return 0
                fi
              fi
            fi

            # New-branch push (before SHA all zeros), workflow_dispatch, or an
            # unresolved base: fall back to diffing against main.
            git fetch --no-tags origin main >/dev/null 2>&1
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              merge_base="$(git merge-base origin/main HEAD 2>/dev/null)"
              if [[ -n "${merge_base:-}" ]]; then
                echo "${merge_base}...HEAD"
                return 0
              fi
              echo "origin/main...HEAD"
              return 0
            fi

            return 1
          }

          unknown=0
          diff_range="$(resolve_diff_range)" || unknown=1

          changed_files=""
          if [[ "${unknown}" == "0" ]]; then
            changed_files="$(git diff --name-only "${diff_range}" 2>/dev/null)" || unknown=1
          fi

          if [[ "${unknown}" == "1" ]]; then
            echo "::warning::could not resolve a diff range for this event; defaulting all areas to changed"
          fi

          area_changed() {
            if [[ "${unknown}" == "1" ]]; then
              echo true
              return
            fi
            if printf '%s\n' "${changed_files}" | grep -Eq "$1"; then
              echo true
            else
              echo false
            fi
          }

          # firmware is a superset of every firmware-area consumer's real inputs:
          # host tests read test/ + components/ + main/; the board build adds
          # CMakeLists.txt, sdkconfig.defaults*, partitions*.csv; the static
          # bundle's ruff scans scripts/, cppcheck scans main/ components/, the
          # rpc-contract check reads api/ + main/, and the strict clang-format
          # and shell lint wrappers read the root dotfile configs. The
          # .markdownlint-cli2.yaml pattern is retained deliberately: no CI job
          # reads it today (see issue #160), but over-triggering is safe.
          # simulator/ has its own output because the strict clang-format scope
          # scans simulator C sources too.
          firmware=$(area_changed '^(main|components|test|api|scripts)/|^CMakeLists\.txt$|^sdkconfig\.|^partitions[^/]*\.csv$|^\.clang-format$|^\.clang-tidy$|^\.shellcheckrc$|^\.markdownlint-cli2\.yaml$|^\.releaserc\.')
          simulator=$(area_changed '^simulator/')
          emulator=$(area_changed '^emulator/')
          webapp=$(area_changed '^webapp/')
          web_flasher=$(area_changed '^web-flasher/')
          workflows=$(area_changed '^\.github/workflows/|^\.actionlint\.yaml$')
          docs=$(area_changed '^docs/|^README\.md$')

          {
            echo "firmware=${firmware}"
            echo "simulator=${simulator}"
            echo "emulator=${emulator}"
            echo "webapp=${webapp}"
            echo "web_flasher=${web_flasher}"
            echo "workflows=${workflows}"
            echo "docs=${docs}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved diff range: ${diff_range:-<unresolved>}"
          echo "firmware=${firmware} simulator=${simulator} emulator=${emulator} webapp=${webapp} web_flasher=${web_flasher} workflows=${workflows} docs=${docs}"
