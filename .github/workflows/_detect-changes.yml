# Reusable change-detection workflow. Each PR-gating workflow (quality.yml,
# firmware-quality.yml, webapp-quality.yml) calls this ONCE via `uses:` so the
# diff-to-area mapping lives in a single place instead of being copy-pasted into
# every workflow. It never gates anything itself: it only emits boolean area
# outputs the caller's real jobs skip on via job-level `if:` (see docs/ci.md for
# the always-report contract). A change to a JOB-DEFINING gating workflow
# (quality.yml, firmware-quality.yml, webapp-quality.yml, or this file) sets
# ci_core, which forces every heavy job so a changed job definition is always
# exercised (the safety rule). Editing any OTHER workflow does not force them.
name: Detect changed areas (reusable)

on:
  workflow_call:
    outputs:
      firmware:
        description: compiled firmware sources (main/ components/) or root build config (CMakeLists.txt, sdkconfig.*, partitions*.csv) touched
        value: ${{ jobs.detect.outputs.firmware }}
      host_test:
        description: test/ (host test harness) touched
        value: ${{ jobs.detect.outputs.host_test }}
      simulator:
        description: simulator/ touched
        value: ${{ jobs.detect.outputs.simulator }}
      emulator:
        description: emulator/ touched
        value: ${{ jobs.detect.outputs.emulator }}
      webapp:
        description: webapp/ touched
        value: ${{ jobs.detect.outputs.webapp }}
      web_flasher:
        description: web-flasher/ touched
        value: ${{ jobs.detect.outputs.web_flasher }}
      api:
        description: api/ (the RPC contract spec the webapp contract tests pin against) touched
        value: ${{ jobs.detect.outputs.api }}
      idf_build_scripts:
        description: the ESP-IDF sourcing / flash / ccache wrapper scripts (and .esp-idf-version pin) the emulator and board-build jobs invoke touched
        value: ${{ jobs.detect.outputs.idf_build_scripts }}
      release_config:
        description: .releaserc.* or scripts/release/ (the release-rule inputs) touched
        value: ${{ jobs.detect.outputs.release_config }}
      ota_index:
        description: the OTA firmware-index generator/validator, their schema fixtures, or the validator test touched (re-runs the index validator test)
        value: ${{ jobs.detect.outputs.ota_index }}
      docker_firmware_builder:
        description: docker/firmware-builder/ (the firmware-builder image build context) touched
        value: ${{ jobs.detect.outputs.docker_firmware_builder }}
      coverage_tooling:
        description: the coverage ratchet scripts or ci/coverage-baseline.json touched (re-runs the host / gosim / webapp coverage gates)
        value: ${{ jobs.detect.outputs.coverage_tooling }}
      size_tooling:
        description: the firmware-size ratchet scripts or ci/size-baseline.json touched (re-runs the board-build size gate)
        value: ${{ jobs.detect.outputs.size_tooling }}
      nrf:
        description: nrf/ (the bare-metal nRF52840 target tree) touched
        value: ${{ jobs.detect.outputs.nrf }}
      ci_core:
        description: a JOB-DEFINING gating workflow (quality.yml, firmware-quality.yml, webapp-quality.yml, _detect-changes.yml) touched (forces every heavy job so a changed job definition is exercised)
        value: ${{ jobs.detect.outputs.ci_core }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect changed areas
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # 10, not 5: the job is a full-history checkout plus one git diff, and
    # the checkout alone has been observed at 4m49s on loaded pods; a 5m
    # ceiling turned pod slowness into a red gate twice on one PR.
    timeout-minutes: 10
    outputs:
      firmware: ${{ steps.detect.outputs.firmware }}
      host_test: ${{ steps.detect.outputs.host_test }}
      simulator: ${{ steps.detect.outputs.simulator }}
      emulator: ${{ steps.detect.outputs.emulator }}
      webapp: ${{ steps.detect.outputs.webapp }}
      web_flasher: ${{ steps.detect.outputs.web_flasher }}
      api: ${{ steps.detect.outputs.api }}
      idf_build_scripts: ${{ steps.detect.outputs.idf_build_scripts }}
      release_config: ${{ steps.detect.outputs.release_config }}
      ota_index: ${{ steps.detect.outputs.ota_index }}
      docker_firmware_builder: ${{ steps.detect.outputs.docker_firmware_builder }}
      coverage_tooling: ${{ steps.detect.outputs.coverage_tooling }}
      size_tooling: ${{ steps.detect.outputs.size_tooling }}
      nrf: ${{ steps.detect.outputs.nrf }}
      ci_core: ${{ steps.detect.outputs.ci_core }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Blobless clone: this job only ever runs `git diff --name-only`,
          # which reads commits and trees, never file contents. Skipping
          # blobs cuts the fetch from tens of MB to a few, which keeps the
          # job fast even when GitHub's bulk-transfer edge is degraded (a
          # 57KB/s day put full clones past any sane timeout).
          filter: blob:none
      - name: Compute changed areas
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          resolve_diff_range() {
            if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" && -n "${GITHUB_BASE_REF:-}" ]]; then
              git fetch --no-tags origin "${GITHUB_BASE_REF}" >/dev/null 2>&1
              if git rev-parse --verify "origin/${GITHUB_BASE_REF}" >/dev/null 2>&1; then
                echo "origin/${GITHUB_BASE_REF}...HEAD"
                return 0
              fi
            fi

            if [[ "${GITHUB_EVENT_NAME:-}" == "push" ]]; then
              if [[ -n "${BEFORE_SHA:-}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
                if git cat-file -e "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
                  echo "${BEFORE_SHA}..HEAD"
                  return 0
                fi
              fi
            fi

            # New-branch push (before SHA all zeros), workflow_dispatch, or an
            # unresolved base: fall back to diffing against main.
            git fetch --no-tags origin main >/dev/null 2>&1
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              merge_base="$(git merge-base origin/main HEAD 2>/dev/null)"
              if [[ -n "${merge_base:-}" ]]; then
                echo "${merge_base}...HEAD"
                return 0
              fi
              echo "origin/main...HEAD"
              return 0
            fi

            return 1
          }

          unknown=0
          diff_range="$(resolve_diff_range)" || unknown=1

          changed_files=""
          if [[ "${unknown}" == "0" ]]; then
            # --no-renames: rename detection reads blob contents, which a
            # blobless clone would lazily fetch; a rename is just a
            # delete+add for area matching.
            changed_files="$(git diff --name-only --no-renames "${diff_range}" 2>/dev/null)" || unknown=1
          fi

          if [[ "${unknown}" == "1" ]]; then
            echo "::warning::could not resolve a diff range for this event; defaulting all areas to changed"
          fi

          area_changed() {
            if [[ "${unknown}" == "1" ]]; then
              echo true
              return
            fi
            if printf '%s\n' "${changed_files}" | grep -Eq "$1"; then
              echo true
            else
              echo false
            fi
          }

          # firmware is the compiled-firmware source set shared by every firmware
          # BUILD job (host tests, gosim, emulator, board build): the C sources
          # under main/ + components/ and the root build config (CMakeLists.txt,
          # sdkconfig.*, partitions*.csv) those builds read. It deliberately does
          # NOT carry scripts/, api/, .releaserc.*, the lint dotfiles
          # (.clang-format, .clang-format-version, .clang-tidy, .shellcheckrc,
          # .markdownlint-cli2.yaml), or docker/firmware-builder/: those are
          # consumed only by the always-run Static checks bundle (ruff scans
          # scripts/, the rpc-contract check reads api/ + main/, the strict
          # clang-format / shellcheck / markdownlint wrappers read the root
          # dotfiles), by the single-purpose Release config job, or by the
          # firmware-builder Docker leg (its own area below). None of the heavy
          # firmware BUILD jobs read them, so keeping them in firmware ran those
          # suites on scripts-only, api-only, dotfile-only, release-config-only,
          # or firmware-builder-Dockerfile-only PRs for no reason.
          firmware=$(area_changed '^(main|components)/|^CMakeLists\.txt$|^sdkconfig\.|^partitions[^/]*\.csv$')
          # host_test is test/ on its own: the Host tests and Parser fuzzing jobs
          # build it (test/fuzz/ lives here), so a test-harness-only change must
          # not drag in gosim or the emulator suite.
          host_test=$(area_changed '^test/')
          # simulator/ has its own output because the strict clang-format scope
          # (inside Static checks) scans simulator C sources too, and gosim + the
          # emulator suite both build simulator/.
          simulator=$(area_changed '^simulator/')
          emulator=$(area_changed '^emulator/')
          webapp=$(area_changed '^webapp/')
          web_flasher=$(area_changed '^web-flasher/')
          # api is the RPC contract spec. The always-run Static checks bundle
          # covers its firmware side (check-rpc-contract.sh), but the webapp
          # side is a unit test: webapp/test/rpcContractCoverage.test.ts pins
          # src/types/rpcContract.generated.ts against api/openapi.yaml, so an
          # api-only spec edit must run the Webapp checks job or the drift it
          # exists to catch merges unexercised.
          api=$(area_changed '^api/')
          # idf_build_scripts are the exact wrapper scripts the emulator and
          # board-build jobs invoke (source ci-source-idf.sh, run ci-ensure-idf.sh,
          # flash.sh / flash-all, ensure-ota-signing-key.sh, and ci-ccache-env.sh,
          # which both jobs run to configure the compiler cache) plus the
          # .esp-idf-version pin ci-source-idf.sh reads to pick the toolchain.
          # Editing them must re-run those two build jobs even when no firmware
          # source changed; host tests and gosim use no IDF, so they stay out.
          idf_build_scripts=$(area_changed '^scripts/(ci-source-idf|ci-ensure-idf|ci-ccache-env|flash|flash-all|ensure-ota-signing-key)|^\.esp-idf-version$')
          # release_config is what the Release config job loads: the per-component
          # .releaserc.*.cjs files, the release scripts (the squash-expander),
          # and the ROOT package.json/package-lock.json, which pin the
          # semantic-release toolchain that job installs with npm ci. The root
          # lockfile is release tooling only (the webapp has its own under
          # webapp/), so it belongs here and nowhere else.
          release_config=$(area_changed '^\.releaserc\.|^scripts/release/|^package(-lock)?\.json$')
          # ota_index is the OTA publish index tooling that the Release config
          # job's validator step exercises: the generator and validator scripts,
          # their schema fixtures, and the node test that pins the validator to
          # docs/ota-release-schema.md. It is its own area (not folded into
          # release_config) so an index-tooling-only change runs the cheap
          # validator step WITHOUT the release job's npm ci + scope-gating test,
          # and a release-config-only change skips the validator step; ci_core
          # forces both for the safety rule. build-firmware-index.js is included
          # because the validator guards exactly its output.
          ota_index=$(area_changed '^scripts/(build|validate)-firmware-index\.js$|^test/fixtures/firmware-index-(valid|invalid)\.json$|^test/test-validate-firmware-index\.js$')
          # docker_firmware_builder is the firmware-builder image's build context.
          # Its Docker leg builds with context docker/firmware-builder/ (a
          # toolchain image FROM espressif/idf), so it reads only that dir and
          # NOT main/ or components/. Giving it its own area keeps a
          # firmware-builder Dockerfile edit off the host/gosim/emulator/board
          # suites (which never touch it) while still rebuilding the image.
          docker_firmware_builder=$(area_changed '^docker/firmware-builder/')
          # coverage_tooling / size_tooling are the CI ratchet scripts + baselines.
          # Under the old broad firmware area (^scripts/) these rode along on every
          # firmware change; now that firmware is narrowed, they get their own
          # areas so a ratchet-script-only or baseline-only change still re-runs
          # the jobs that execute the ratchet (which it self-verifies) instead of
          # falsely skipping. The local-only update-*-baseline.sh helpers are
          # excluded: no CI job invokes them (Static checks shellcheck covers
          # them). The coverage ratchet runs inside host tests, gosim, and the
          # webapp job; the size ratchet runs inside the board build.
          coverage_tooling=$(area_changed '^scripts/ci/(check_coverage\.py|host_coverage\.py|run-host-coverage\.sh)$|^ci/coverage-baseline\.json$')
          size_tooling=$(area_changed '^scripts/ci/(check-firmware-size\.sh|check_size\.py|extract_firmware_sizes\.py)$|^ci/size-baseline\.json$')
          # nrf is the bare-metal nRF52840 target tree. Its build also compiles
          # components/ sources directly, but that dependency is expressed in
          # the nRF build job's `if:` (which also fires on the firmware area),
          # not by widening this area.
          nrf=$(area_changed '^nrf/')
          # ci_core is the force-everything trigger, but scoped to ONLY the
          # workflows that DEFINE the heavy build/test jobs: quality.yml,
          # firmware-quality.yml, webapp-quality.yml, and the reusable
          # _detect-changes.yml they all call. Editing one of these can change a
          # job definition or the gating logic itself, so every heavy job must
          # re-run to exercise it. Editing ANY OTHER workflow (the claude.yml
          # review bot, commit-msg-lint, pr-template, release/publish workflows,
          # the burst watchdog, dependabot config, .actionlint.yaml) touches
          # nothing the product suites build, so it must NOT force them: that
          # workflow runs its own jobs via its own triggers, and here only the
          # always-on Static checks bundle reports. This is what stops a
          # review-bot-config or markdown edit from running the full emulator /
          # board / docker / host / gosim suite.
          ci_core=$(area_changed '^\.github/workflows/(quality|firmware-quality|webapp-quality|_detect-changes)\.yml$')

          {
            echo "firmware=${firmware}"
            echo "host_test=${host_test}"
            echo "simulator=${simulator}"
            echo "emulator=${emulator}"
            echo "webapp=${webapp}"
            echo "web_flasher=${web_flasher}"
            echo "api=${api}"
            echo "idf_build_scripts=${idf_build_scripts}"
            echo "release_config=${release_config}"
            echo "ota_index=${ota_index}"
            echo "docker_firmware_builder=${docker_firmware_builder}"
            echo "coverage_tooling=${coverage_tooling}"
            echo "size_tooling=${size_tooling}"
            echo "nrf=${nrf}"
            echo "ci_core=${ci_core}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved diff range: ${diff_range:-<unresolved>}"
          echo "firmware=${firmware} host_test=${host_test} simulator=${simulator} emulator=${emulator} webapp=${webapp} web_flasher=${web_flasher} api=${api} idf_build_scripts=${idf_build_scripts} release_config=${release_config} ota_index=${ota_index} docker_firmware_builder=${docker_firmware_builder} coverage_tooling=${coverage_tooling} size_tooling=${size_tooling} nrf=${nrf} ci_core=${ci_core}"
