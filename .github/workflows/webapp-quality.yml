name: Webapp Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Per-SHA group for main pushes so a merge train cannot cancel the pending
# run of an already-merged commit; see the note in quality.yml.
concurrency:
  group: webapp-quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  npm_config_fund: false
  npm_config_audit: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect changed areas
    uses: ./.github/workflows/_detect-changes.yml

  webapp:
    name: Webapp checks
    needs: detect
    # coverage_tooling: the Webapp coverage ratchet step reads
    # ci/coverage-baseline.json via check_coverage.py, so a ratchet-only change
    # must re-run this job to self-verify.
    # api: webapp/test/rpcContractCoverage.test.ts pins the committed
    # src/types/rpcContract.generated.ts against api/openapi.yaml, so an
    # api-only spec edit must run the unit tests here or the exact drift that
    # test exists to catch would merge with this job skipped.
    if: |
      needs.detect.outputs.webapp == 'true' ||
      needs.detect.outputs.api == 'true' ||
      needs.detect.outputs.coverage_tooling == 'true' ||
      needs.detect.outputs.ci_core == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies (lockfile-safe)
        # One npm ci for the whole job: both typechecks, unit tests, the build,
        # and the e2e smoke run all reuse this single install and the single
        # build output below (no second install, no second build).
        run: npm ci --prefix webapp
      - name: Typecheck
        # THE tsc --noEmit run for this job, exactly one. It used to be three.
        # webapp/package.json defines `lint` as a bare alias for `typecheck`,
        # and `build` as `npm run typecheck && vite build`, so the former
        # Lint / Typecheck / Build sequence invoked the identical
        # `tsc --noEmit` three times over one checkout and one install. Two of
        # those were pure cost on a small self-hosted pool, which is the
        # duplicated-work rule in docs/quality-policy.md.
        #
        # The Lint step is gone rather than renamed: there is no eslint,
        # biome, prettier, or any other linter in webapp/ (no config file, no
        # dependency), so the step never linted anything and its name asserted
        # a gate that does not exist. Adding a real linter is a separate
        # decision, not a rename; until someone makes it, this job typechecks
        # and does not claim otherwise.
        run: npm run typecheck --prefix webapp
      - name: Electron typecheck
        run: npm run typecheck:electron --prefix webapp
      - name: Unit tests (with coverage)
        # --coverage collects v8 line coverage in the same run (no second vitest
        # pass) and writes webapp/coverage/coverage-summary.json. Pass/fail is
        # unchanged from a plain `vitest run`.
        run: npm run test:unit --prefix webapp -- --coverage
      - name: Webapp coverage ratchet
        # Ratchet the total line coverage against ci/coverage-baseline.json. v8
        # coverage is deterministic across machines, so the pods match local.
        run: |
          PCT="$(python3 -c "import json;print(json.load(open('webapp/coverage/coverage-summary.json'))['total']['lines']['pct'])")"
          echo "webapp total line coverage: ${PCT}%"
          python3 scripts/ci/check_coverage.py webapp "$PCT"
      - name: Install and smoke-test the mock node server (webapp/mock)
        # webapp/mock is a standalone package with its own package.json and
        # package-lock.json, never installed above: the root npm ci only
        # resolves webapp's own dependency versions. This installs mock's
        # lockfile in isolation and runs its own smoke script from inside
        # that directory, so a dependency bump here (e.g. #181's @noble/hashes
        # major bump) fails this step instead of shipping unexercised.
        working-directory: webapp/mock
        run: |
          npm ci
          node ci-smoke.mjs
      - name: Install and smoke-test the ws-proxy relay (webapp/ws-proxy)
        # Same reasoning as the mock node above: ws-proxy is another
        # standalone package with its own lockfile that Dependabot updates,
        # and nothing previously installed or started it either.
        working-directory: webapp/ws-proxy
        run: |
          npm ci
          bash ci-smoke.sh
      - name: Build webapp
        # vite directly, not `npm run build`, because that script is
        # `npm run typecheck && vite build` and the Typecheck step above
        # already ran that exact tsc over this same checkout and install. The
        # emitted bundle is identical either way; only the redundant typecheck
        # is dropped. `npm run build` keeps its typecheck for local use, where
        # nothing ran tsc beforehand.
        working-directory: webapp
        run: npx vite build
      - name: E2E smoke (reuses the build above)
        env:
          SMOKE_MAX_WAIT_SECONDS: '90'
          SMOKE_START_RUNTIME: '1'
        run: npm run test:e2e:smoke --prefix webapp
      - name: Capture runtime logs on failure
        if: failure()
        run: |
          mkdir -p webapp/e2e-artifacts
          cp -f webapp/e2e-smoke-server.log webapp/e2e-artifacts/server.log || true
      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webapp-e2e-smoke-failure-artifacts
          if-no-files-found: warn
          path: |
            webapp/e2e-artifacts/**
            webapp/test-results/**
            webapp/playwright-report/**
            webapp/e2e-screenshots/**

  web-flasher-tests:
    name: web-flasher tests
    needs: detect
    if: needs.detect.outputs.web_flasher == 'true' || needs.detect.outputs.ci_core == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run web-flasher node:test suite
        # Glob, not a bare directory: `node --test web-flasher/` resolves the
        # directory as a module entry point and dies with MODULE_NOT_FOUND on
        # Node 22 and newer. The quoted glob is expanded by the test runner
        # itself and selects the same 8 tests the bare directory used to.
        run: node --test 'web-flasher/**/*.test.js'
