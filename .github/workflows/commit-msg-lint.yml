name: commit-msg-lint

# Includes `edited` alongside the default opened/synchronize/reopened because
# the "Lint PR title" step below validates the PR title, and the title is
# editable after the last push. That title is the squash-merge commit subject,
# so commitlint's type/scope/length rules gate it and semantic-release derives
# component versions from it: a title edited after a green run has to be
# re-validated. .github/workflows/pr-template.yml spells the same event class
# out for the same reason; these two must not diverge.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  # Every run validates, so superseding one with a newer one loses nothing: the
  # replacement re-derives the verdict for the same head SHA. A cancelled run
  # leaves a `cancelled` context, which blocks rather than passes.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  commitlint:
    name: Commitlint
    # Deliberately unconditional. Every triggered run publishes a `Commitlint`
    # check run, and the newest one on a head SHA is the verdict branch
    # protection reads; a job skipped by an `if:` publishes `skipped`, which
    # counts as success. Gating this job on the event would therefore let a
    # body-only edit replace a real failure with a pass. The always-report
    # contract in docs/ci.md covers skips predicated on the diff, which is
    # fixed for a head SHA; the PR title this job lints is not in the diff.
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs and dispatches follow RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Every other job on the self-hosted pool bounds itself; this one inherited
    # the 360-minute default, so a hung checkout could hold a pool pod for six
    # hours. The work here is a checkout and two commitlint invocations.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert baked commitlint matches the pinned major
        # @commitlint/cli and @commitlint/config-conventional are baked into
        # the runner image (bramble#222, image 1.2.0), replacing an npm
        # registry install that ran on every PR. The extends resolution from
        # the global install against commitlint.config.cjs is verified as part
        # of the image build contract; this assert fails loud if the image
        # drifts from the major this repo's configs are written for.
        run: |
          command -v commitlint >/dev/null || { echo "::error::commitlint missing from runner image (bramble#222 bake contract)"; exit 1; }
          got="$(commitlint --version)"
          case "$got" in
            *@19.*) echo "commitlint ${got} matches pinned major 19" ;;
            *) echo "::error::commitlint version ${got} does not match pinned major 19. Bump COMMITLINT_MAJOR in the private runner-image definition or this pin so they agree."; exit 1 ;;
          esac

      - name: Pick the commitlint config
        # Dependabot's grouped-update titles are structurally longer than a
        # human subject (issue #190): the generated suffix
        # " in the GROUP group across N directories" is Dependabot's own
        # template, not something a commit author controls. Rather than
        # relax header-max-length for every contributor, or exempt
        # dependabot[bot] from commitlint entirely (which would let a
        # genuinely malformed type or scope through unchecked), select a
        # config that changes only that one rule, and only for that one
        # actor. github.event.pull_request.user.login is set by GitHub from
        # the PR's real author and cannot be spoofed by PR content; this is
        # the same actor gate .github/workflows/pr-template.yml already uses
        # for the same bot. See commitlint.dependabot.config.cjs for the
        # config itself.
        id: config
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          config="commitlint.config.cjs"
          if [ "${PR_AUTHOR:-}" = "dependabot[bot]" ]; then
            config="commitlint.dependabot.config.cjs"
          fi
          echo "file=${config}" >> "$GITHUB_OUTPUT"

      - name: Lint PR commits
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONFIG: ${{ steps.config.outputs.file }}
        run: commitlint --config "${CONFIG}" --from "origin/${BASE_REF}" --to "${HEAD_SHA}" --verbose

      - name: Lint PR title
        # GitHub squash-merges use the PR title as the commit subject, which is
        # what commitlint validates here and semantic-release later versions
        # from. A clean per-commit history can still land a bad squash subject.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          CONFIG: ${{ steps.config.outputs.file }}
        run: printf '%s\n' "$PR_TITLE" | commitlint --config "${CONFIG}" --verbose
