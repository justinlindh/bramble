name: PR Template

# Enforce that every section header defined in .github/PULL_REQUEST_TEMPLATE.md
# is present, with its exact Markdown formatting, in the pull request body. The
# required headers are read from the template itself, so this gate stays in sync
# when the template changes. Runs when a PR is opened and re-runs on every
# description edit and new push, so the required context always reports on the
# current head.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  sections:
    name: Template sections
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs and dispatches follow RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify PR body contains every template section header
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TEMPLATE: .github/PULL_REQUEST_TEMPLATE.md
        run: |
          set -euo pipefail

          # Dependabot writes its own machine-generated body (changelog and
          # commit list) and cannot be made to follow the template. The check
          # still runs and still reports, so the required context is never
          # missing; it just has nothing human-authored to enforce against.
          if [ "${PR_AUTHOR:-}" = "dependabot[bot]" ]; then
            echo "Author is dependabot[bot]; the template does not apply to generated dependency PRs."
            exit 0
          fi

          if [ ! -f "$TEMPLATE" ]; then
            echo "No PR template at $TEMPLATE; nothing to enforce."
            exit 0
          fi

          # Required section headers are the level-2 Markdown headings in the
          # template. Trailing whitespace is stripped so comparison is exact.
          mapfile -t headers < <(grep -E '^##[[:space:]]+' "$TEMPLATE" | sed 's/[[:space:]]*$//')

          if [ "${#headers[@]}" -eq 0 ]; then
            echo "Template defines no '## ' section headers; nothing to enforce."
            exit 0
          fi

          # GitHub stores PR bodies with CRLF line endings. Normalize to LF and
          # strip trailing whitespace per line so a stray space does not fail an
          # otherwise-correct header.
          body="$(printf '%s' "${PR_BODY:-}" | tr -d '\r' | sed 's/[[:space:]]*$//')"

          missing=0
          for header in "${headers[@]}"; do
            # A herestring, not a pipe: under `set -o pipefail`, `grep -qxF`
            # exiting on its first match sends SIGPIPE to whatever is still
            # writing the other end of the pipe. When the header matched
            # early in a long body, that raced a real match against a
            # "broken pipe" write error, and pipefail surfaced the write
            # error as the pipeline's exit status even though grep found the
            # header, turning a real match into a false "missing" (observed
            # on PR #208). A herestring hands grep its input with no
            # concurrent writer to sigpipe, so there is nothing to race.
            if grep -qxF "$header" <<<"$body"; then
              echo "ok: $header"
            else
              echo "missing: $header"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo
            echo "The PR description is missing one or more required sections."
            echo "Every '## ' heading from $TEMPLATE must appear in the body,"
            echo "verbatim and with its '## ' formatting. Restore the missing"
            echo "heading(s) and this check will re-run on the edit."
            exit 1
          fi

          echo
          echo "All required template sections are present."
