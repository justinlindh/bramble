# PHASE-2 PORT PENDING: Gitea-coupled publish path, dispatch-only until rewritten
name: CI Smoke Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create smoke artifact
        run: |
          mkdir -p out
          echo "smoke-run $(date -u +%Y-%m-%dT%H:%M:%SZ)" > out/smoke.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-smoke-artifact
          path: out/smoke.txt
