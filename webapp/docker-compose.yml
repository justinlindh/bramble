services:
  bramble-webapp:
    build: .
    environment:
      - MODE=local
    expose:
      - "8085"

  mock-node:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./mock:/app
    command: sh -c "npm install && node server.mjs"
    expose:
      - "3005"
    ports:
      - "3005:3005"

  ws-proxy:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./ws-proxy:/app
    command: sh -c "npm install && node server.mjs"
    expose:
      - "3006"

  caddy:
    image: caddy:2-alpine
    ports:
      - "3004:80"
      - "3443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bramble-webapp
      - mock-node
      - ws-proxy

volumes:
  caddy_data:
  caddy_config:
