services:
  bramble-webapp:
    build: .
    expose:
      - "80"

  mock-node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./mock:/app
    command: sh -c "npm install && node server.mjs"
    expose:
      - "3005"
    ports:
      - "3005:3005"

  caddy:
    image: caddy:2-alpine
    ports:
      - "3004:80"
      - "3443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bramble-webapp
      - mock-node

volumes:
  caddy_data:
  caddy_config:
