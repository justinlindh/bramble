<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#0d1117"/>
  <!-- Bramble leaf / mesh node icon -->
  <circle cx="50" cy="50" r="8" fill="#238636"/>
  <!-- Branches -->
  <line x1="50" y1="50" x2="25" y2="30" stroke="#238636" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="75" y2="30" stroke="#238636" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="20" y2="60" stroke="#238636" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="80" y2="60" stroke="#238636" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50" y2="80" stroke="#238636" stroke-width="3" stroke-linecap="round"/>
  <!-- Nodes at branch tips -->
  <circle cx="25" cy="30" r="5" fill="#238636" opacity="0.8"/>
  <circle cx="75" cy="30" r="5" fill="#238636" opacity="0.8"/>
  <circle cx="20" cy="60" r="5" fill="#238636" opacity="0.8"/>
  <circle cx="80" cy="60" r="5" fill="#238636" opacity="0.8"/>
  <circle cx="50" cy="80" r="5" fill="#238636" opacity="0.8"/>
</svg>
