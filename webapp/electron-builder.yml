appId: org.bramblemesh.app
productName: Bramble
copyright: Copyright © 2026 Bramble Mesh

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - public/bramble-logo.png
  - "!node_modules"

extraResources:
  - from: server/
    to: server/
    filter:
      - "**/*.mjs"
  - from: mock/
    to: mock/
    filter:
      - "**/*.mjs"

linux:
  description: Desktop companion for the Bramble LoRa mesh - connect to nodes over LAN, WiFi, or serial.
  synopsis: Bramble LoRa mesh companion
  target:
    - AppImage
    - deb
    - pacman
  icon: public/bramble-logo.png
  category: Utility
  maintainer: bramblemesh.org

mac:
  target:
    - dmg
  # Both arch dmgs are built, so make the arch explicit in both filenames
  # (the default omits it for x64).
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: public/bramble-logo.png
  category: public.app-category.utilities
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - nsis
  icon: public/bramble-logo.png

nsis:
  # No spaces in the filename (the default is "Bramble Setup x.y.z.exe";
  # GitHub rewrites spaces in release asset names).
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
