appId: org.bramblemesh.app
productName: Bramble
copyright: Copyright © 2026 Bramble Mesh

# Update feed. electron-updater reads the update metadata (latest.yml on
# Windows, latest-linux.yml on Linux) from a GitHub release. Declaring the
# provider here is also what makes electron-builder emit those yml files next
# to the installers at package time; the release workflow attaches them to the
# webapp-vX.Y.Z release so self-updating builds (Windows NSIS, Linux AppImage)
# can find them. deb/pacman and the unsigned macOS dmg do not self-update: the
# app detects that and points the user at the releases page instead.
publish:
  provider: github
  owner: justinlindh
  repo: bramble
  releaseType: release

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - public/bramble-logo.png
  - "!node_modules"

extraResources:
  - from: server/
    to: server/
    filter:
      - "**/*.mjs"
  - from: mock/
    to: mock/
    filter:
      - "**/*.mjs"

linux:
  description: Desktop companion for the Bramble LoRa mesh - connect to nodes over LAN, WiFi, or serial.
  synopsis: Bramble LoRa mesh companion
  target:
    - AppImage
    - deb
    - pacman
  icon: public/bramble-logo.png
  category: Utility
  maintainer: bramblemesh.org

mac:
  target:
    - dmg
  # Both arch dmgs are built, so make the arch explicit in both filenames
  # (the default omits it for x64).
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: public/bramble-logo.png
  category: public.app-category.utilities
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - nsis
  icon: public/bramble-logo.png

nsis:
  # No spaces in the filename (the default is "Bramble Setup x.y.z.exe";
  # GitHub rewrites spaces in release asset names).
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
