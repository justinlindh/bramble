openapi: 3.1.0
info:
  title: Bramble Mesh Node API
  description: >
    JSON-RPC 2.0 API for Bramble mesh nodes.
    Methods are invoked via JSON-RPC over serial (UART), WebSocket, or BLE.
    Each method is mapped to a POST path for codegen and documentation purposes.
    The actual wire format is standard JSON-RPC 2.0.
    WebSocket and BLE connections require the per-device auth token by default;
    serial is unauthenticated by design (physical access is the trust anchor).
    Unauthenticated WS/BLE clients may call only bramble.ping and
    bramble.getVersion; every other method answers Unauthorized (-1005).
  version: 0.6.0
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://bramble.local
    description: Bramble node HTTP host (WebSocket JSON-RPC upgrades on /ws)

security:
  - deviceToken: []

paths:
  # ── Query Methods ──────────────────────────────────────────────────────────

  /rpc/bramble.getStatus:
    post:
      operationId: getStatus
      summary: Get node status
      description: >
        Returns current node status including identity, firmware/protocol
        versions, radio health, packet counters, uptime, heap, and battery.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Node status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /rpc/bramble.getWifiStatus:
    post:
      operationId: getWifiStatus
      summary: Get WiFi interface status
      description: Returns current WiFi mode and link information.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: WiFi status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WifiStatusResponse'

  /rpc/bramble.getDiagnostics:
    post:
      operationId: getDiagnostics
      summary: Get node diagnostics
      description: Returns runtime memory diagnostics and task stack high-water marks.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDiagnosticsRequest'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Diagnostics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsResponse'

  /rpc/bramble.getIdentity:
    post:
      operationId: getIdentity
      summary: Get node identity
      description: Returns the node's address and public key hash.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Node identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'

  /rpc/bramble.getPeerVerification:
    post:
      operationId: getPeerVerification
      summary: Get a peer's SAS verification state
      description: Returns the identity safety number (SAS), verified flag, and keyChanged flag for a peer address. The SAS is empty when the peer is not yet pinned.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: string
                  description: Peer node address (hex).
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Peer verification state
          content:
            application/json:
              schema:
                type: object
                properties:
                  sas:
                    type: string
                    description: 7-digit identity safety number, empty when the peer is unpinned.
                  verified:
                    type: boolean
                  keyChanged:
                    type: boolean

  /rpc/bramble.setPeerVerified:
    post:
      operationId: setPeerVerified
      summary: Set a peer's SAS-verified state
      description: Marks a peer verified (or clears verification) after an out-of-band safety-number comparison. Persists the verified bit. Authenticated.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [address, verified]
              properties:
                address:
                  type: string
                  description: Peer node address (hex).
                verified:
                  type: boolean
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Verification state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /rpc/bramble.getVersion:
    post:
      operationId: getVersion
      summary: Get firmware version info
      description: >
        Returns firmware version, protocol version, and hardware identifier.
        On the unauthenticated allowlist: callable without the device token,
        so a pairing UI can identify the device before prompting for the token.
      tags: [query]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Version info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /rpc/bramble.getDeliveryEvents:
    post:
      operationId: getDeliveryEvents
      summary: Get delivery replay events since a sequence number
      description: >
        Returns persisted delivery events for ACK and broadcast-delivery telemetry.
        Use `sinceEventSeq` (or `since_event_seq`) for incremental replay.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sinceEventSeq:
                  type: integer
                  minimum: 0
                since_event_seq:
                  type: integer
                  minimum: 0
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1024
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Delivery replay window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEventsResponse'

  /rpc/bramble.getNeighbors:
    post:
      operationId: getNeighbors
      summary: Get direct radio neighbors
      description: Returns list of nodes heard directly via radio with signal quality metrics.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Neighbor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborsResponse'

  /rpc/bramble.getRoutes:
    post:
      operationId: getRoutes
      summary: Get routing table
      description: Returns all known routes including direct and multi-hop paths.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Route table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutesResponse'

  /rpc/bramble.getMessages:
    post:
      operationId: getMessages
      summary: Get stored messages
      description: Returns messages in the node's message store.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Message list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesResponse'

  /rpc/bramble.getAirtime:
    post:
      operationId: getAirtime
      summary: Get airtime budget status
      description: Returns per-tier airtime budget usage and remaining allocation.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Airtime stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirtimeResponse'

  /rpc/bramble.getPeerLocations:
    post:
      operationId: getPeerLocations
      summary: Get peer location data
      description: Returns location information for all known peers, varying by sharing tier.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Peer locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerLocationsResponse'

  /rpc/bramble.ping:
    post:
      operationId: ping
      summary: Ping the node
      description: >
        Health check. Returns pong with node address and protocol version.
        On the unauthenticated allowlist: callable without the device token.
      tags: [query]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Pong response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'

  # ── Config / Action Methods ────────────────────────────────────────────────

  /rpc/bramble.getConfig:
    post:
      operationId: getConfig
      summary: Get full node configuration
      description: Returns identity, radio settings, channels, mailbox, and location config.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Full configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'

  /rpc/bramble.sendMessage:
    post:
      operationId: sendMessage
      summary: Send a direct text message
      description: >
        Sends a unicast message to a destination address.
        Returns immediately with a packet identifier; delivery status arrives
        via bramble.onAck notification.
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Message queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'

  /rpc/bramble.sendBroadcast:
    post:
      operationId: sendBroadcast
      summary: Broadcast a text message
      description: Sends a broadcast message on the public channel.
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendBroadcastParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Broadcast queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendBroadcastResponse'

  /rpc/bramble.sendProbe:
    post:
      operationId: sendProbe
      summary: Send a network probe
      description: >
        Broadcasts a probe packet. Responses arrive asynchronously as
        probe.ack notifications, followed by a probe.complete notification.
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Probe initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendProbeResponse'

  /rpc/bramble.setRadio:
    post:
      operationId: setRadio
      summary: Update radio parameters
      description: Sets one or more radio parameters (frequency, spreading factor, bandwidth, TX power).
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRadioParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Radio updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRadioResponse'

  /rpc/bramble.setNodeName:
    post:
      operationId: setNodeName
      summary: Set the node display name
      description: Sets the node name (max 32 characters).
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNodeNameParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Name updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetNodeNameResponse'

  /rpc/bramble.addChannel:
    post:
      operationId: addChannel
      summary: Add a channel
      description: Adds a new channel with the given name and pre-shared key.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChannelParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Channel added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddChannelResponse'

  /rpc/bramble.removeChannel:
    post:
      operationId: removeChannel
      summary: Remove a channel
      description: Removes a channel by index.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveChannelParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Channel removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveChannelResponse'

  /rpc/bramble.setDefaultChannel:
    post:
      operationId: setDefaultChannel
      summary: Set the default channel
      description: Sets which channel is used by default for outgoing messages.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDefaultChannelParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Default channel updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /rpc/bramble.setMailbox:
    post:
      operationId: setMailbox
      summary: Enable or disable mailbox mode
      description: Toggles store-and-forward mailbox functionality.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMailboxParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Mailbox setting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetMailboxResponse'

  /rpc/bramble.setFloodTransport:
    post:
      operationId: setFloodTransport
      summary: Enable or disable the flood transport
      description: >-
        Toggles the unicast flood transport (Flooding F1 Task 1). When on, a
        received unicast DATA not addressed to this node is relayed through
        the same multi-hop flood engine broadcast DATA already uses, instead
        of the reactive route-lookup forward. Default off (reactive
        unchanged); NVS-persisted.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFloodTransportParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Flood transport setting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetFloodTransportResponse'

  /rpc/bramble.setFloodHopLimit:
    post:
      operationId: setFloodHopLimit
      summary: Set the flood-transport origination hop budget
      description: >-
        Sets the operator-settable hop limit a freshly-originated flood DATA
        (and its flooded-ACK) is stamped with under the flood transport, so
        best-effort reach can be matched to the expected network diameter. The
        value is clamped to 1..32; the clamped value that took effect is echoed
        back and persisted. Default 8 (shipped behavior unchanged). This is
        separate from the reactive routing hop budget, which is untouched.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFloodHopLimitParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Flood hop limit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetFloodHopLimitResponse'

  /rpc/bramble.setLocationConfig:
    post:
      operationId: setLocationConfig
      summary: Configure location sharing
      description: Enables/disables location sharing and sets default parameters.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLocationConfigParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Location config updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLocationConfigResponse'

  /rpc/bramble.setLocationContact:
    post:
      operationId: setLocationContact
      summary: Add or update a location contact
      description: Sets the sharing tier and parameters for a specific peer address.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLocationContactParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLocationContactResponse'

  /rpc/bramble.removeLocationContact:
    post:
      operationId: removeLocationContact
      summary: Remove a location contact
      description: Stops sharing location with the specified peer.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveLocationContactParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Contact removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveLocationContactResponse'

  /rpc/bramble.shareLocationOnce:
    post:
      operationId: shareLocationOnce
      summary: Share location once with a peer
      description: Sends a one-time location update to the specified address.
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareLocationOnceParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Location shared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLocationOnceResponse'

  /rpc/bramble.reboot:
    post:
      operationId: reboot
      summary: Reboot the node
      description: Triggers a software reboot of the node.
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Reboot initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /rpc/bramble.setBroadcastTelemetryMode:
    post:
      operationId: setBroadcastTelemetryMode
      summary: Set broadcast telemetry mode
      description: Sets telemetry emission mode for broadcast delivery events.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBroadcastTelemetryModeParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Broadcast telemetry mode updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetBroadcastTelemetryModeResponse'

  # ── Traffic Debug Methods ──────────────────────────────────────────────────

  /rpc/bramble.setTrafficDebug:
    post:
      operationId: setTrafficDebug
      summary: Configure traffic debug telemetry
      description: >
        Enable or disable traffic debug event recording and configure sampling parameters.
        Settings are persisted to NVS and survive reboots.
      tags: [debug]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTrafficDebugParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Traffic debug config updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetTrafficDebugResponse'

  /rpc/bramble.getTrafficDebug:
    post:
      operationId: getTrafficDebug
      summary: Get traffic debug configuration and buffer state
      description: >
        Returns current traffic debug configuration, ring buffer utilization,
        and dropped event count.
      tags: [debug]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Traffic debug status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTrafficDebugResponse'

  /rpc/bramble.getTrafficEvents:
    post:
      operationId: getTrafficEvents
      summary: Retrieve traffic events from ring buffer
      description: >
        Fetch traffic events from the in-memory ring buffer.
        Use since_seq to request only new events (incremental pull).
        Events are returned in chronological order (oldest first).
      tags: [debug]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetTrafficEventsParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Traffic events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTrafficEventsResponse'

  # ── Auth Methods ──────────────────────────────────────────────────────────

  /rpc/bramble.setAuthToken:
    post:
      operationId: setAuthToken
      summary: Set WebSocket authentication token
      description: >
        Sets the token required to authenticate WebSocket connections.
        Pass an empty string to disable authentication and allow open access.
        Changes take effect immediately for new connections.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAuthTokenParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Auth token updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /rpc/bramble.getAuthToken:
    post:
      operationId: getAuthToken
      summary: Get WebSocket authentication token
      description: Returns the current authentication token and whether auth is enabled.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Auth token info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuthTokenResponse'

  /rpc/bramble.setNetworkKey:
    post:
      operationId: setNetworkKey
      summary: Provision the control-plane network key
      description: >
        Provisions the per-fleet network key that keys the RREP/RERR/ACK/
        delivery-receipt/beacon control-plane MACs. Pass the raw 32-byte key
        as 64 hex characters. Persisted to NVS and applied immediately (the
        beacon subkey is re-derived live). Authenticated callers only. This is
        a write-only secret: the key is never read back (see
        bramble.getNetworkKeyStatus for a one-way fingerprint). Until
        provisioned the node is inert on the control plane (no fallback key).
        The key proves fleet membership, not per-node identity: any key holder
        can still forge control messages on behalf of another holder (see
        docs/SECURITY-MODEL.md section 3).
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNetworkKeyParams'
      responses:
        '400':
          description: Bad request (key not 64 hex characters)
        '200':
          description: Network key provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /rpc/bramble.generateNetworkKey:
    post:
      operationId: generateNetworkKey
      summary: Mint and provision a fresh control-plane network key
      description: >
        Generates a fresh entropy-gated 32-byte network key on the device,
        provisions THIS node with it (persisted to NVS, beacon subkey
        re-derived live), and returns the raw key so the operator can copy it
        to the other nodes in the fleet. This makes the local node the fleet
        founder. Returning the raw key is deliberate: it crosses only the
        operator's own local control channel, the same trust boundary
        setNetworkKey already relies on to accept a raw key. The key is never
        broadcast or logged. Authenticated callers only. Calling this on an
        already-provisioned node RE-KEYS it. On entropy failure the node
        provisions nothing and returns a JSON-RPC error (fail closed).
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Network key generated and provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateNetworkKeyResponse'

  /rpc/bramble.getNetworkKeyStatus:
    post:
      operationId: getNetworkKeyStatus
      summary: Report network-key provisioning status
      description: >
        Returns whether a real per-fleet network key is provisioned and a
        one-way fingerprint (SHA256(key)[0:4] as 8 lowercase hex) so an
        operator can confirm a fleet converged on the same key without the key
        ever being read back. An unprovisioned node has NO usable key (there is
        no public-PSK fallback) and reports the all-zero fingerprint
        "00000000", which marks it as inert (not meshing) until a key is set.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Network key status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetNetworkKeyStatusResponse'

  /rpc/bramble.setAnchor:
    post:
      operationId: setAnchor
      summary: Provision the fleet trust-anchor public key
      description: >
        Provisions the fleet trust anchor's Ed25519 PUBLIC key (trust-anchor
        campaign, P0). The anchor holder is an offline operator client that
        endorses each node's identity key; the device only ever holds the
        anchor public key, never the private key, and never signs
        endorsements. Pass the raw 32-byte public key as 64 hex characters.
        Persisted to NVS. Authenticated callers only. P0 is inert: nothing
        reads the anchor for a trust decision yet (later phases pin
        endorsed-only identities).
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAnchorParams'
      responses:
        '400':
          description: Bad request (anchor_pubkey not 64 hex characters)
        '200':
          description: Anchor public key provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /rpc/bramble.getAnchorStatus:
    post:
      operationId: getAnchorStatus
      summary: Report trust-anchor provisioning status
      description: >
        Returns whether a fleet trust anchor is provisioned and, when it is, a
        one-way fingerprint (SHA256(anchor_pub)[0:4] as 8 lowercase hex) so an
        operator can confirm a fleet shares one anchor without the key being
        echoed. The anchor_fingerprint field is present only when anchored.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Anchor status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAnchorStatusResponse'

  /rpc/bramble.setEndorsement:
    post:
      operationId: setEndorsement
      summary: Provision this node's own endorsement certificate
      description: >
        Provisions THIS node's own endorsement certificate (trust-anchor
        campaign, P1): the fleet anchor's Ed25519 signature vouching for this
        node's identity key, bound to a validity window. The device never
        SIGNS an endorsement; it only accepts one the anchor already signed,
        and verifies it against this node's own identity key and the
        provisioned anchor before persisting. Rejected when no anchor is
        provisioned, when not_after is 0 (the "no cert" sentinel), when either
        field is malformed, or when the signature does not verify. On success
        the cert is persisted to NVS and a fresh attestation is triggered so
        the fleet learns the cert promptly. Authenticated callers only.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEndorsementParams'
      responses:
        '400':
          description: >
            Bad request (no anchor provisioned, not_after 0, malformed
            not_after/endorsement_sig, or signature verification failed)
        '200':
          description: Endorsement certificate provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /rpc/bramble.setAllowedOrigins:
    post:
      operationId: setAllowedOrigins
      summary: Set the extra WebSocket Origin allowlist
      description: >
        Persists the extra WS Origin allowlist for connections that do not
        present the valid token. Entries are full origins
        (scheme://host[:port]) or the literal "null" opt-in for sandboxed/file
        pages; commas and spaces are rejected and the joined list must fit in
        255 characters. An empty array clears the allowlist. Changes apply
        immediately.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAllowedOriginsParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Origin allowlist updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /rpc/bramble.getAllowedOrigins:
    post:
      operationId: getAllowedOrigins
      summary: Get the extra WebSocket Origin allowlist
      description: Returns the persisted extra WS Origin allowlist entries.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Origin allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllowedOriginsResponse'

  # ── OTA ───────────────────────────────────────────────────────────────────

  /rpc/bramble.otaUpdate:
    post:
      operationId: otaUpdate
      summary: Start an OTA firmware update
      description: >
        Initiates a firmware OTA update from an artifact path resolved against
        the device's allowlisted OTA origin (see bramble.otaGetOrigin /
        bramble.otaSetOrigin). Raw URLs are rejected. Returns immediately; the
        node reboots automatically on success. The downloaded image must carry
        a valid signature trusted by the running firmware and must pass the
        soft anti-rollback floor unless allow_downgrade is set.
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtaUpdateParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: OTA started or error details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaUpdateResponse'

  /rpc/bramble.otaGetOrigin:
    post:
      operationId: otaGetOrigin
      summary: Report the allowlisted OTA origin and anti-rollback floor
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '200':
          description: Current OTA origin configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaGetOriginResponse'

  /rpc/bramble.otaSetOrigin:
    post:
      operationId: otaSetOrigin
      summary: Override or reset the allowlisted OTA origin
      description: >
        Persists an OTA origin override in NVS. The origin must be an
        https:// base URL (http:// only on builds with
        CONFIG_BRAMBLE_OTA_ALLOW_HTTP); userinfo, query, and fragment are
        rejected. Pass reset=true to return to the default origin.
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtaSetOriginParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Effective origin after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaSetOriginResponse'

  /rpc/bramble.otaStatus:
    post:
      operationId: otaStatus
      summary: Live progress of the background OTA task
      description: >
        Live progress of the background OTA task; poll after otaUpdate or
        subscribe to bramble.onOtaEvent.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '200':
          description: Current OTA progress snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaStatusResponse'

  # ── Hardware / Power ───────────────────────────────────────────────────────

  /rpc/bramble.getBattery:
    post:
      operationId: getBattery
      summary: Get battery status
      description: Returns battery voltage in millivolts and estimated charge percentage.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Battery status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBatteryResponse'

  /rpc/bramble.setBacklight:
    post:
      operationId: setBacklight
      summary: Set display backlight brightness
      description: >
        Sets the display backlight PWM duty cycle (0 = off, 255 = full brightness).
        Returns an error if the board has no backlight control pin.
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBacklightParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Backlight updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetBacklightResponse'

  /rpc/bramble.sleep:
    post:
      operationId: sleep
      summary: Enter deep sleep
      description: >
        Puts the node into ESP deep sleep. Wake sources are LoRa DIO1 (any incoming
        radio packet) and optionally a timer. The RPC response is sent before sleep begins.
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SleepParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Sleep acknowledged (node will enter deep sleep after response flushes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SleepResponse'

  /rpc/bramble.getGpsPosition:
    post:
      operationId: getGpsPosition
      summary: Get current GPS position
      description: >
        Returns the latest GPS fix. Returns valid=false on boards without GPS
        capability or when no fix is currently available.
        Use bramble.onGpsEvent notifications for fix transition events.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: GPS position (or not-supported indicator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGpsPositionResponse'

  # ── Storage (T-Deck Plus only) ─────────────────────────────────────────────

  /rpc/bramble.getStorageInfo:
    post:
      operationId: getStorageInfo
      summary: Get SD card storage info (T-Deck Plus only)
      description: >
        Returns SD card presence and mount point.
        Only registered on boards built with CONFIG_BRAMBLE_BOARD_TDECK_PLUS.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Storage status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStorageInfoResponse'

  # ── Audio (T-Deck Plus only) ───────────────────────────────────────────────

  /rpc/bramble.playTone:
    post:
      operationId: playTone
      summary: Play a predefined audio tone (T-Deck Plus only)
      description: >
        Plays a named alert tone on the T-Deck Plus audio hardware.
        Only registered on boards built with CONFIG_BRAMBLE_BOARD_TDECK_PLUS.
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayToneParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Tone queued for playback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyParams'

  /rpc/bramble.setVolume:
    post:
      operationId: setVolume
      summary: Set audio volume (T-Deck Plus only)
      description: >
        Sets audio output volume 0–100.
        Only registered on boards built with CONFIG_BRAMBLE_BOARD_TDECK_PLUS.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetVolumeParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Volume updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyParams'

  /rpc/bramble.setMuted:
    post:
      operationId: setMuted
      summary: Mute or unmute audio (T-Deck Plus only)
      description: >
        Mutes or unmutes the audio output.
        Only registered on boards built with CONFIG_BRAMBLE_BOARD_TDECK_PLUS.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMutedParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Mute state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyParams'

  /rpc/bramble.getAudioStatus:
    post:
      operationId: getAudioStatus
      summary: Get audio status (T-Deck Plus only)
      description: >
        Returns audio hardware availability, volume level, mute state, and
        playback status. Only registered on boards with CONFIG_BRAMBLE_BOARD_TDECK_PLUS.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Audio status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAudioStatusResponse'

  # ── Bench Debug Methods (screenshot + input injection) ──────────────────────

  /rpc/bramble.screenshot:
    post:
      operationId: screenshot
      summary: Capture the current LVGL screen (T-Deck Plus bench debug)
      description: >
        Captures the LVGL UI and returns it in base64 chunks (RGB565, 320x240).
        capture defaults to true when no offset is given: pass capture=true (or
        omit offset) to take a fresh snapshot and read chunk 0, then repeat with
        capture=false and increasing offset to fetch the rest of the same frame.
        Each response's decoded chunk is capped at 6KB. On boards without a
        graphical UI, returns {"error":"no graphical ui"} instead of failing.
        Authenticated.
      tags: [debug]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                capture:
                  type: boolean
                  description: Take a fresh snapshot. Defaults to true when offset is omitted.
                offset:
                  type: integer
                  description: Byte offset into the last captured frame (ignored when capturing).
                max_len:
                  type: integer
                  description: Max decoded chunk length in bytes, capped at 6144.
      responses:
        '400':
          description: Bad request (invalid params, or no frame captured yet)
        '200':
          description: Screenshot chunk
          content:
            application/json:
              schema:
                type: object
                properties:
                  width:
                    type: integer
                  height:
                    type: integer
                  format:
                    type: string
                    description: Pixel format, currently always "rgb565".
                  total:
                    type: integer
                    description: Total frame size in bytes.
                  offset:
                    type: integer
                    description: Byte offset of this chunk within the frame.
                  data:
                    type: string
                    description: Base64-encoded chunk (self-contained, decode independently).
                  len:
                    type: integer
                    description: Decoded length of this chunk in bytes.
                  error:
                    type: string
                    description: Present instead of the fields above on boards without a graphical UI.

  /rpc/bramble.injectInput:
    post:
      operationId: injectInput
      summary: Inject trackball/keyboard input (T-Deck Plus bench debug)
      description: >
        Injects a synthetic trackball or keyboard event through the same ring
        the real drivers feed, so LVGL group/focus/textarea behavior matches
        physical input exactly. Touch injection is out of scope. On boards
        without a graphical UI, returns {"error":"no graphical ui"} instead
        of failing. Authenticated.
      tags: [debug]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [trackball, key, text]
                dir:
                  type: string
                  enum: [up, down, left, right, select]
                  description: Required when type is "trackball".
                char:
                  type: string
                  description: Single character. Required when type is "key".
                text:
                  type: string
                  description: String queued one character at a time. Required when type is "text".
                enter:
                  type: boolean
                  description: When type is "text", queue a trailing newline after the text.
      responses:
        '400':
          description: Bad request (invalid params)
        '200':
          description: Input queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  queued:
                    type: integer
                    description: Number of events/characters successfully queued.
                  error:
                    type: string
                    description: Present instead of ok/queued on boards without a graphical UI.

  # ── Beacon Policy ──────────────────────────────────────────────────────────

  /rpc/bramble.setBeaconPolicy:
    post:
      operationId: setBeaconPolicy
      summary: Configure beacon transmission policy
      description: >
        Sets beacon mode (fixed or adaptive) and timing parameters.
        All fields are optional; omitted fields retain their current values.
      tags: [config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBeaconPolicyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Beacon policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /rpc/bramble.getBeaconPolicy:
    post:
      operationId: getBeaconPolicy
      summary: Get beacon policy configuration and runtime status
      description: Returns the current beacon policy configuration and live runtime status.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Beacon policy config and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBeaconPolicyResponse'

  /rpc/phy.enable:
    post:
      operationId: phyEnable
      summary: Enable PHY passthrough (hardware bridge)
      description: >
        Enables the hardware-bridge passthrough mode (DESIGN.md section 10):
        received frames are forwarded up as bramble.onPhyFrame notifications
        and phy.tx transmits raw frames. Gated hard: authenticated only,
        auto-expires after a TTL (default 30 min), never persists across
        reboot, and refuses while the node holds a live channel identity
        unless force is set.
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_s:
                  type: integer
                  description: Auto-expire window in seconds (default 1800, 0 selects the default).
                force:
                  type: boolean
                  description: Override the live-channel-identity refusal.
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: >
            Passthrough status, or a refusal (enabled=false, requires_force=true)
            when the node holds a live channel identity and force was not set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhyStatusResponse'

  /rpc/phy.disable:
    post:
      operationId: phyDisable
      summary: Disable PHY passthrough
      description: Disables passthrough immediately.
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Passthrough status after disable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhyStatusResponse'

  /rpc/phy.status:
    post:
      operationId: phyStatus
      summary: Get PHY passthrough status
      description: Returns whether passthrough is active and its remaining TTL.
      tags: [query]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyParams'
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Passthrough status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhyStatusResponse'

  /rpc/phy.tx:
    post:
      operationId: phyTx
      summary: Transmit a raw frame via PHY passthrough
      description: >
        Transmits a raw hex-encoded frame on the real channel. Refused unless
        passthrough is active. The frame still passes through the tx_gate
        (airtime budget, listen-before-talk, ToA debit).
      tags: [action]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [frame]
              properties:
                frame:
                  type: string
                  description: Raw frame bytes, lowercase hex (2 chars per byte, up to 255 bytes).
      responses:
        '400':
          description: Bad request (invalid params or request body)
        '200':
          description: Transmit result (ok=false with error when refused or gated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

components:
  schemas:
    # ── Primitives / Empty ───────────────────────────────────────────────────

    EmptyParams:
      type: object
      description: No parameters required.
      properties: {}

    OkResponse:
      type: object
      description: >
        Generic acknowledgment response. Handlers that fail softly return
        ok=false with an error message in the same shape.
      required: [ok]
      properties:
        ok:
          type: boolean
          description: True on success.
        error:
          type: string
          description: Error message (present only when ok=false).

    PhyStatusResponse:
      type: object
      description: PHY passthrough gate state (DESIGN.md section 10).
      required: [enabled, forced, ttl_s, remaining_s]
      properties:
        enabled:
          type: boolean
          description: True when passthrough is active (enabled and TTL not expired).
        forced:
          type: boolean
          description: True when enabled with force=true (live-identity override).
        ttl_s:
          type: integer
          description: Configured TTL for the current window, in seconds.
        remaining_s:
          type: integer
          description: Seconds until auto-expire (0 when inactive).
        requires_force:
          type: boolean
          description: >
            Present and true on a phy.enable refusal, when the node holds a
            live channel identity and force was not set.
        error:
          type: string
          description: Refusal message (present only on a phy.enable refusal).

    # ── Reusable Types ───────────────────────────────────────────────────────

    Position:
      type: object
      description: GPS position with accuracy and motion data.
      required: [lat, lon, alt, accuracy, timestampMs]
      properties:
        lat:
          type: number
          description: Latitude in decimal degrees.
        lon:
          type: number
          description: Longitude in decimal degrees.
        alt:
          type: number
          description: Altitude in meters.
        accuracy:
          type: number
          description: Horizontal accuracy in meters.
        speed:
          type: number
          description: Speed in meters per second.
        heading:
          type: number
          description: Heading in degrees (0-360).
        timestampMs:
          type: integer
          description: Position fix timestamp (Unix ms).

    Neighbor:
      type: object
      description: A directly heard radio neighbor.
      required: [address, rssi, snr, deliveryRate, airtimeRemaining, last_seen_ms]
      properties:
        address:
          type: string
          description: Neighbor address as 8-char uppercase hex.
        rssi:
          type: integer
          description: Received signal strength (dBm).
        snr:
          type: number
          description: Signal-to-noise ratio (dB).
        deliveryRate:
          type: integer
          description: Link delivery rate metric (0-255).
        airtimeRemaining:
          type: integer
          description: Neighbor-advertised airtime budget remaining.
        last_seen_ms:
          type: integer
          description: Milliseconds since last packet received.
        name:
          type: string
          description: Neighbor display name (present only when known).

    Route:
      type: object
      description: A routing table entry.
      required: [dest, next_hop, hop_count, metric, state, use_count]
      properties:
        dest:
          type: string
          description: Destination address as 8-char uppercase hex.
        next_hop:
          type: string
          description: Next-hop address as 8-char uppercase hex.
        hop_count:
          type: integer
          description: Number of hops to destination.
        metric:
          type: integer
          description: Route cost metric (lower is better).
        state:
          type: string
          enum: [discovering, unverified, active, stale, broken, unknown]
          description: Route state.
        use_count:
          type: integer
          description: Number of times this route has been used.

    Channel:
      type: object
      description: A configured channel.
      required: [id, name, hasPsk, epoch, is_default]
      properties:
        id:
          type: integer
          description: Channel index.
        name:
          type: string
          description: Channel display name.
        hasPsk:
          type: boolean
          description: Whether a pre-shared key is configured.
        epoch:
          type: integer
          description: Key epoch counter.
        is_default:
          type: boolean
          description: Whether this is the default channel.

    Message:
      type: object
      description: A stored message from the on-device ring buffer.
      required: [from, to, direction, text, channel, broadcast, timestamp_s]
      properties:
        from:
          type: string
          description: Sender address as 8-char uppercase hex.
        to:
          type: string
          description: Destination address as 8-char uppercase hex.
        direction:
          type: string
          enum: [incoming, outgoing, broadcast_in, broadcast_out]
          description: Message direction relative to this node.
        text:
          type: string
          description: Message text content.
        channel:
          type: integer
          description: Channel index the message was sent or received on.
        broadcast:
          type: boolean
          description: True for broadcast messages.
        timestamp_s:
          type: integer
          description: Message timestamp (Unix seconds).
        rssi:
          type: integer
          description: RSSI at receive time (omitted when 0/unknown).
        snr:
          type: integer
          description: SNR at receive time (omitted when 0/unknown).
        status:
          type: string
          enum: [sent, delivered, failed]
          description: Delivery status for outgoing messages (omitted when none).

    LocationTier:
      type: string
      enum: [full, coarse, presence, 'off']
      description: Location sharing tier.

    LocationSource:
      type: string
      enum: [gps, manual, hybrid]
      description: Source mode for location reporting.

    LocationContactRule:
      type: object
      description: Per-peer location sharing rule.
      required: [address]
      properties:
        address:
          type: string
          description: Peer address as 8-char uppercase hex.
        enabled:
          type: boolean
          description: Whether rule is enabled.
        tier:
          $ref: '#/components/schemas/LocationTier'
        interval_s:
          type: integer
          description: Override update interval in seconds.

    LocationChannelTarget:
      type: object
      description: Per-channel location sharing rule.
      required: [channel]
      properties:
        channel:
          type: integer
          description: Channel index.
        enabled:
          type: boolean
          description: Whether rule is enabled.
        tier:
          $ref: '#/components/schemas/LocationTier'
        interval_s:
          type: integer
          description: Override update interval in seconds.

    LocationConfig:
      type: object
      description: Canonical location configuration.
      required: [enabled, tier, default_tier, interval_s, source, contact_rules, channel_targets]
      properties:
        enabled:
          type: boolean
          description: Whether location sharing is enabled.
        tier:
          $ref: '#/components/schemas/LocationTier'
        default_tier:
          $ref: '#/components/schemas/LocationTier'
        interval_s:
          type: integer
          description: Default update interval in seconds.
        source:
          $ref: '#/components/schemas/LocationSource'
        contact_rules:
          type: array
          items:
            $ref: '#/components/schemas/LocationContactRule'
        channel_targets:
          type: array
          items:
            $ref: '#/components/schemas/LocationChannelTarget'
        lat:
          type: number
          description: Configured manual latitude (present only when set).
        lon:
          type: number
          description: Configured manual longitude (present only when set).

    LocationPeer:
      type: object
      description: Location data for a peer node.
      required: [addr, name, tier, position, online, lastUpdatedMs]
      properties:
        addr:
          type: string
          description: Peer address as 8-char uppercase hex.
        name:
          type: string
          description: Peer display name.
        tier:
          $ref: '#/components/schemas/LocationTier'
        position:
          $ref: '#/components/schemas/Position'
        online:
          type: boolean
          description: Whether the peer is currently online.
        lastUpdatedMs:
          type: integer
          description: Unix timestamp (ms) of last update.

    # ── Response Schemas ─────────────────────────────────────────────────────

    StatusResponse:
      type: object
      description: Node status information.
      required:
        - address
        - firmware_version
        - protocol_version
        - hardware
        - radio_ok
        - peers
        - beacon_tx
        - beacon_rx
        - packets_tx
        - packets_rx
        - uptime_s
        - free_heap
        - battery_mv
        - battery_pct
        - gps_available
        - supports_delivery_event_sync
        - identity_pins
        - identity_conflicts
        - identity_sig_failures
        - identity_addr_mismatches
        - identity_unendorsed
        - identity_expired
      properties:
        address:
          type: string
          description: Node address as 8-char uppercase hex.
        firmware_version:
          type: string
          description: Firmware version string.
        protocol_version:
          type: string
          description: Protocol version string.
        hardware:
          type: string
          description: Hardware platform identifier (board short name).
        radio_ok:
          type: boolean
          description: Whether the LoRa radio initialised successfully.
        peers:
          type: integer
          description: Number of direct neighbors.
        beacon_tx:
          type: integer
          description: Total beacons transmitted.
        beacon_rx:
          type: integer
          description: Total beacons received.
        packets_tx:
          type: integer
          description: Total packets transmitted.
        packets_rx:
          type: integer
          description: Total packets received.
        uptime_s:
          type: integer
          description: Seconds since boot.
        free_heap:
          type: integer
          description: Free heap memory in bytes.
        battery_mv:
          type: integer
          description: Battery voltage in millivolts.
        battery_pct:
          type: integer
          description: Estimated battery charge percentage.
        gps_available:
          type: boolean
          description: Whether this board has GPS hardware.
        supports_delivery_event_sync:
          type: boolean
          description: True when bramble.getDeliveryEvents incremental replay is supported.
        identity_pins:
          type: integer
          description: >-
            Verified per-node identity pins currently held (TOFU pin store,
            RAM-only; resets on reboot).
        identity_conflicts:
          type: integer
          description: >-
            Delivered identity attestations refused because a pinned address
            re-attested under different keys (impersonation / DM-key-change
            signal).
        identity_sig_failures:
          type: integer
          description: >-
            Delivered (network-key-valid) identity attestations whose Ed25519
            signature failed to verify (keyed-insider misbehavior signal).
        identity_addr_mismatches:
          type: integer
          description: >-
            Delivered identity attestations refused because their source
            address did not derive from their own Ed25519 key (address
            impersonation attempts; rejected even on first contact).
        identity_unendorsed:
          type: integer
          description: >-
            Trust-anchor campaign (P2): delivered identity attestations refused
            on an anchored node because they carried no valid fleet-anchor
            endorsement cert. Always 0 on a node with no anchor provisioned.
        identity_expired:
          type: integer
          description: >-
            Trust-anchor campaign (P2): delivered identity attestations refused
            on an anchored node because their endorsement cert had expired
            against the synced wall clock. Always 0 on a node with no anchor
            provisioned (and for v1 permanent certs).

    WifiStatusResponse:
      type: object
      description: Current WiFi status.
      required: [mode, ssid, ip, rssi, mac, clients]
      properties:
        mode:
          type: string
          enum: ['off', station, ap]
          description: Active WiFi operating mode.
        ssid:
          type: string
          description: Current SSID (AP SSID in AP mode, joined network in station mode).
        ip:
          type: string
          description: Current IPv4 address.
        rssi:
          type: integer
          description: Station RSSI; 0 in AP mode.
        mac:
          type: string
          description: WiFi MAC address in colon-separated hex format.
        clients:
          type: integer
          description: Connected AP client count; 0 in station mode.

    GetDiagnosticsRequest:
      type: object
      description: Optional parameters for bramble.getDiagnostics.
      properties:
        include_heap_dump:
          type: boolean
          description: If true, triggers heap_caps_dump() to serial logs before returning diagnostics.

    TaskStackHighWaterMark:
      type: object
      required: [task, hwm_words, hwm_bytes]
      properties:
        task:
          type: string
          description: FreeRTOS task name.
        hwm_words:
          type: number
          description: Stack high-water mark in words.
        hwm_bytes:
          type: number
          description: Stack high-water mark in bytes.

    HeapDiagnostics:
      type: object
      required:
        - internal_free
        - internal_min_ever_free
        - internal_largest_free_block
        - dma_free
        - dma_largest_free_block
        - psram_free
        - psram_min_ever_free
      properties:
        internal_free:
          type: number
        internal_min_ever_free:
          type: number
        internal_largest_free_block:
          type: number
        dma_free:
          type: number
        dma_largest_free_block:
          type: number
        psram_free:
          type: number
        psram_min_ever_free:
          type: number

    DiagnosticsResponse:
      type: object
      description: Runtime diagnostics returned by bramble.getDiagnostics.
      required: [uptime_s, free_heap, heap, task_stack_hwm]
      properties:
        uptime_s:
          type: number
          description: Device uptime in seconds.
        free_heap:
          type: number
          description: Total free heap bytes.
        heap:
          $ref: '#/components/schemas/HeapDiagnostics'
        task_stack_hwm:
          type: array
          items:
            $ref: '#/components/schemas/TaskStackHighWaterMark'

    IdentityResponse:
      type: object
      description: Node identity information.
      required: [address, pubkey_hash, ed25519_pub]
      properties:
        address:
          type: string
          description: Node address as hex string (e.g. "1A2B3C4D").
        pubkey_hash:
          type: string
          description: Public key hash as hex string.
        ed25519_pub:
          type: string
          description: >
            The full identity Ed25519 public key as 64 lowercase hex
            characters. Enrollment uses this to request a trust-anchor
            endorsement (address/pubkey_hash are only truncated hashes).
          pattern: '^[0-9a-f]{64}$'

    VersionResponse:
      type: object
      description: Firmware version information.
      required: [firmware_version, protocol_version, hardware, supports_delivery_event_sync]
      properties:
        firmware_version:
          type: string
          description: Firmware version string.
        protocol_version:
          type: string
          description: Protocol version string.
        hardware:
          type: string
          description: Hardware platform identifier.
        supports_delivery_event_sync:
          type: boolean
          description: True when bramble.getDeliveryEvents incremental replay is supported.

    PingResponse:
      type: object
      description: Ping/pong response.
      required: [pong, address, protocol_version]
      properties:
        pong:
          type: boolean
          description: Always true.
        address:
          type: string
          description: Node address as hex string.
        protocol_version:
          type: string
          description: Protocol version string.

    DeliveryEvent:
      type: object
      required: [event_seq, event_type, timestamp_ms, payload]
      properties:
        event_seq:
          type: integer
        event_id:
          type: string
        event_type:
          type: string
          enum: [ack, broadcast_delivery]
        packet_id:
          type: string
          description: Packet id for ACK delivery events.
        broadcast_id:
          type: string
          description: Broadcast id for broadcast delivery events.
        timestamp_ms:
          type: integer
        payload:
          type: object
          additionalProperties: true

    DeliveryEventsResponse:
      type: object
      required: [events, latest_event_seq]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryEvent'
        latest_event_seq:
          type: integer

    NeighborsResponse:
      type: object
      required: [neighbors]
      properties:
        neighbors:
          type: array
          items:
            $ref: '#/components/schemas/Neighbor'

    RoutesResponse:
      type: object
      required: [routes]
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'

    MessagesResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    AirtimeResponse:
      type: object
      description: Current airtime budget state (flat firmware format).
      required:
        - critical_remaining_ms
        - normal_remaining_ms
        - broadcast_remaining_ms
        - receipt_remaining_ms
        - critical_max_ms
        - normal_max_ms
        - broadcast_max_ms
        - receipt_max_ms
        - next_refill_ms
      properties:
        critical_remaining_ms:
          type: integer
        normal_remaining_ms:
          type: integer
        broadcast_remaining_ms:
          type: integer
        receipt_remaining_ms:
          type: integer
        critical_max_ms:
          type: integer
        normal_max_ms:
          type: integer
        broadcast_max_ms:
          type: integer
        receipt_max_ms:
          type: integer
        next_refill_ms:
          type: integer

    PeerLocationsResponse:
      type: object
      required: [peerLocations]
      properties:
        peerLocations:
          type: array
          items:
            $ref: '#/components/schemas/LocationPeer'

    ConfigResponse:
      type: object
      description: Full node configuration.
      required:
        - node_name
        - address
        - pubkey_hash
        - radio
        - channels
        - location
        - broadcast_telemetry_mode
        - mailboxEnabled
        - floodTransportEnabled
        - floodHopLimit
      properties:
        node_name:
          type: string
          description: Node display name ("(unnamed)" when unset).
        address:
          type: string
          description: Node address as 8-char uppercase hex.
        pubkey_hash:
          type: string
          description: Public key hash as 8-char uppercase hex.
        radio:
          type: object
          required: [frequency_mhz, sf, bw_hz, tx_power_dbm, coding_rate, profile]
          properties:
            frequency_mhz:
              type: number
              description: Frequency in MHz.
            sf:
              type: integer
              description: LoRa spreading factor (6-12).
            bw_hz:
              type: integer
              description: Bandwidth in Hz (125000, 250000, or 500000).
            tx_power_dbm:
              type: integer
              description: Transmit power in dBm.
            coding_rate:
              type: integer
              description: Coding rate denominator (5-8).
            profile:
              type: string
              description: Radio profile name (currently always "custom").
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        location:
          $ref: '#/components/schemas/LocationConfig'
        broadcast_telemetry_mode:
          type: string
          enum: ['off', recipient_only, path_sampled]
          description: Telemetry emission mode for broadcast delivery events.
        mailboxEnabled:
          type: boolean
          description: Whether store-and-forward mailbox is enabled.
        floodTransportEnabled:
          type: boolean
          description: Whether the unicast flood transport is enabled.
        floodHopLimit:
          type: integer
          description: >-
            Flood-transport origination hop budget (1..32, default 8). Only
            the flood transport uses it; reactive routing is unaffected.

    # ── Request Params ───────────────────────────────────────────────────────

    SendMessageParams:
      type: object
      description: Parameters for sending a direct message.
      required: [dest, text]
      properties:
        dest:
          type: string
          description: Destination node address as 8-char uppercase hex (e.g. "04CAAAF8").
        text:
          type: string
          description: Message text content.
        channel:
          type: integer
          description: >
            Optional channel index to send on. When set, dest "FFFFFFFE" is
            accepted as a channel-broadcast alias for "FFFFFFFF".

    SendMessageResponse:
      type: object
      required: [packetId, status, fragmented, max_bytes, actual_bytes]
      properties:
        packetId:
          type: string
          description: Packet ID as uppercase hex string.
        status:
          type: string
          enum: [sent]
        channel:
          type: integer
          description: Channel index used (present only for channel sends).
        fragmented:
          type: boolean
          description: Whether this message will be sent as multiple fragments.
        fragments_total:
          type: integer
          description: Total number of fragments (only present if fragmented=true).
        max_bytes:
          type: integer
          description: Maximum message size in bytes (616 with fragmentation).
        actual_bytes:
          type: integer
          description: Actual message size in bytes.

    SendBroadcastParams:
      type: object
      required: [text]
      properties:
        text:
          type: string

    SendBroadcastResponse:
      type: object
      description: Response fields currently emitted by firmware for bramble.sendBroadcast.
      required: [broadcast_id, status, broadcast, channel, fragmented, max_bytes, actual_bytes]
      properties:
        broadcast_id:
          type: string
          description: Broadcast identifier as uppercase hex string.
        status:
          type: string
          enum: [sent]
        broadcast:
          type: boolean
        channel:
          type: integer
        fragmented:
          type: boolean
          description: Whether this message will be sent as multiple fragments.
        fragments_total:
          type: integer
          description: Total number of fragments (only present if fragmented=true).
        max_bytes:
          type: integer
          description: Maximum message size in bytes (616 with fragmentation).
        actual_bytes:
          type: integer
          description: Actual message size in bytes.

    SendProbeResponse:
      type: object
      required: [ok, probe_id, ack_window, rounds_total]
      properties:
        ok:
          type: boolean
          description: True when the probe sweep started.
        probe_id:
          type: string
          description: Probe identifier as 8-char uppercase hex.
        ack_window:
          type: integer
          description: Seconds to wait for probe responses.
        rounds_total:
          type: integer
          description: Number of probe rounds in the sweep.

    SetRadioParams:
      type: object
      description: Radio parameters to update. All fields optional.
      properties:
        tx_power_dbm:
          type: integer
          description: Transmit power in dBm.
        sf:
          type: integer
          description: LoRa spreading factor (6-12).
        bw_hz:
          type: integer
          description: Bandwidth in Hz (125000, 250000, 500000).
        coding_rate:
          type: integer
          description: Coding rate denominator (5-8).
        frequency_mhz:
          type: number
          description: Frequency in MHz.

    SetRadioResponse:
      type: object
      description: >
        Response from bramble.setRadio. On success echoes the applied
        configuration; on validation failure returns ok=false with an error.
      required: [ok]
      properties:
        ok:
          type: boolean
        frequency_mhz:
          type: number
          description: Applied frequency in MHz (success only).
        sf:
          type: integer
          description: Applied spreading factor (success only).
        bw_hz:
          type: integer
          description: Applied bandwidth in Hz (success only).
        tx_power_dbm:
          type: integer
          description: Applied TX power in dBm, clamped to the region plan (success only).
        coding_rate:
          type: integer
          description: Applied coding rate denominator (success only).
        error:
          type: string
          description: Error message when ok=false.

    SetNodeNameParams:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Node display name (max 32 characters).
          maxLength: 32

    SetNodeNameResponse:
      type: object
      required: [ok, name]
      properties:
        ok:
          type: boolean
        name:
          type: string
          description: The applied node name.

    AddChannelParams:
      type: object
      required: [name, psk]
      properties:
        name:
          type: string
          description: Channel display name.
        psk:
          type: string
          description: Pre-shared key (base64 or hex encoded).

    AddChannelResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        index:
          type: integer
          description: Index of the newly added channel (success only).
        name:
          type: string
          description: Channel display name (success only).
        error:
          type: string
          description: Error message when ok=false.

    RemoveChannelParams:
      type: object
      required: [index]
      properties:
        index:
          type: integer
          description: Channel index to remove.

    RemoveChannelResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        channels:
          type: integer
          description: Remaining channel count (success only).
        error:
          type: string
          description: Error message when ok=false.

    SetDefaultChannelParams:
      type: object
      required: [index]
      properties:
        index:
          type: integer
          description: Channel index to set as default.

    SetMailboxParams:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Whether to enable mailbox mode.

    SetMailboxResponse:
      type: object
      required: [ok, enabled]
      properties:
        ok:
          type: boolean
        enabled:
          type: boolean
          description: The applied mailbox state.

    SetFloodTransportParams:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Whether to enable the unicast flood transport.

    SetFloodTransportResponse:
      type: object
      required: [ok, enabled]
      properties:
        ok:
          type: boolean
        enabled:
          type: boolean
          description: The applied flood transport state.

    SetFloodHopLimitParams:
      type: object
      required: [hops]
      properties:
        hops:
          type: integer
          minimum: 1
          maximum: 32
          description: >-
            Flood-transport origination hop budget. Clamped to 1..32; the
            clamped value is what takes effect and is returned.

    SetFloodHopLimitResponse:
      type: object
      required: [ok, hops]
      properties:
        ok:
          type: boolean
        hops:
          type: integer
          description: The applied (clamped) flood hop limit.

    SetLocationConfigParams:
      type: object
      description: Canonical location policy update. All fields optional for partial updates.
      properties:
        enabled:
          type: boolean
          description: Enable or disable location sharing.
        default_tier:
          $ref: '#/components/schemas/LocationTier'
        interval_s:
          type: integer
          description: Default update interval in seconds.
        source:
          $ref: '#/components/schemas/LocationSource'
        contact_rules:
          type: array
          items:
            $ref: '#/components/schemas/LocationContactRule'
        channel_targets:
          type: array
          items:
            $ref: '#/components/schemas/LocationChannelTarget'
        lat:
          type: number
          description: Manual latitude in decimal degrees (boards without GPS).
        lon:
          type: number
          description: Manual longitude in decimal degrees (boards without GPS).

    SetLocationConfigResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          description: True when the config update is accepted.

    SetLocationContactParams:
      type: object
      required: [address]
      properties:
        address:
          type: string
          description: Peer address as 8-char uppercase hex.
        enabled:
          type: boolean
          description: Whether this contact rule is enabled.
        tier:
          $ref: '#/components/schemas/LocationTier'
        interval_s:
          type: integer
          description: Contact-specific update interval in seconds.

    SetLocationContactResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          description: True when the contact update is accepted.

    RemoveLocationContactParams:
      type: object
      required: [address]
      properties:
        address:
          type: string
          description: Peer address as 8-char uppercase hex.

    RemoveLocationContactResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          description: True when the contact removal is accepted.

    ShareLocationOnceParams:
      type: object
      required: [address]
      properties:
        address:
          type: string
          description: Peer address as 8-char uppercase hex.
        tier:
          $ref: '#/components/schemas/LocationTier'

    ShareLocationOnceResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          description: True when the one-time share was sent.
        lat:
          type: number
          description: Latitude that was shared (success only).
        lon:
          type: number
          description: Longitude that was shared (success only).
        tier:
          $ref: '#/components/schemas/LocationTier'
        packetId:
          type: string
          description: Packet ID as uppercase hex string (success only).
        error:
          type: string
          description: Error message when ok=false.

    SetBroadcastTelemetryModeParams:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: ['off', recipient_only, path_sampled]

    SetBroadcastTelemetryModeResponse:
      type: object
      required: [ok, broadcast_telemetry_mode]
      properties:
        ok:
          type: boolean
        broadcast_telemetry_mode:
          type: string
          enum: ['off', recipient_only, path_sampled]

    BroadcastDeliveryNotification:
      type: object
      description: Delivery telemetry notification for a previously queued broadcast packet.
      required: [recipient, broadcast_id, status, rssi_at_dest]
      properties:
        recipient:
          type: string
          description: Recipient node address as 8-char uppercase hex.
        broadcast_id:
          type: string
          description: Broadcast identifier returned by bramble.sendBroadcast.
        status:
          type: string
          description: Delivery state for this telemetry event.
          enum: [delivered]
        rssi_at_dest:
          type: integer
          description: RSSI measured at recipient, in dBm.
        relayPath:
          type: array
          description: Optional sampled relay path when telemetry mode includes path sampling.
          items:
            type: object
            required: [addr]
            properties:
              addr:
                type: string
                description: Relay node address as 8-char uppercase hex.

    # ── Traffic Debug / Monitor Stream Types ──────────────────────────────

    SetTrafficDebugParams:
      $ref: '#/components/schemas/TrafficDebugConfig'

    TrafficDebugConfig:
      type: object
      description: Canonical traffic debug configuration used by monitor/event-stream APIs.
      properties:
        enabled:
          type: boolean
          description: Enable or disable traffic event recording.
          default: false
        include_tx:
          type: boolean
          description: Record TX (transmit) events.
          default: true
        include_rx:
          type: boolean
          description: Record RX (receive) events.
          default: true
        sample_rate:
          type: integer
          description: >
            Sampling rate percentage (0-100). 100 = capture all events,
            50 = capture ~50% of events (randomized sampling).
          minimum: 0
          maximum: 100
          default: 100

    TrafficDebugStatus:
      allOf:
        - $ref: '#/components/schemas/TrafficDebugConfig'
        - type: object
          required: [enabled, include_tx, include_rx, sample_rate, buffer_capacity, buffer_count, dropped_count]
          properties:
            buffer_capacity:
              type: integer
              description: Ring buffer capacity (max events that can be stored).
            buffer_count:
              type: integer
              description: Number of events currently in buffer.
            dropped_count:
              type: integer
              description: Total events dropped due to buffer wrap or backpressure.

    SetTrafficDebugResponse:
      allOf:
        - type: object
          description: Response from bramble.setTrafficDebug.
          required: [ok]
          properties:
            ok:
              type: boolean
              description: Always true on success.
        - $ref: '#/components/schemas/TrafficDebugConfig'

    GetTrafficDebugResponse:
      allOf:
        - type: object
          description: Response from bramble.getTrafficDebug.
        - $ref: '#/components/schemas/TrafficDebugStatus'

    GetTrafficEventsParams:
      type: object
      description: Parameters for bramble.getTrafficEvents.
      properties:
        since_seq:
          type: integer
          description: >
            Only return events with seq > since_seq. Use 0 or omit to fetch all available events.
          default: 0
        limit:
          type: integer
          description: Maximum number of events to return (1-512).
          minimum: 1
          maximum: 512
          default: 100

    GetTrafficEventsResponse:
      type: object
      description: Response from bramble.getTrafficEvents.
      required: [events, returned, total_available]
      properties:
        events:
          type: array
          description: Array of traffic events (oldest first).
          items:
            $ref: '#/components/schemas/TrafficEvent'
        returned:
          type: integer
          description: Number of events returned in this response.
        total_available:
          type: integer
          description: Total events currently available in buffer.

    TrafficEvent:
      type: object
      description: >
        A single traffic event capturing TX or RX packet metadata.
        Used for airtime analysis and network efficiency monitoring.
      required: [seq, timestamp_ms, pkt_type, category, airtime_tier, packet_len, rssi, is_tx]
      properties:
        seq:
          type: integer
          description: Monotonic sequence number (unique per event).
        timestamp_ms:
          type: integer
          description: Event timestamp in milliseconds since boot.
        pkt_type:
          type: integer
          description: Packet type ID from firmware packet.h.
        category:
          type: string
          description: Classified traffic category.
          enum: [beacon, timesync, routing, ack, chat, maintenance, other, unknown]
        airtime_tier:
          type: string
          description: Airtime bucket used for this packet.
          enum: [none, normal, critical, broadcast, unknown]
        packet_len:
          type: integer
          description: Packet length in bytes (on-air payload size).
        rssi:
          type: integer
          description: Received signal strength in dBm (0 for TX events).
        is_tx:
          type: boolean
          description: true if this is a TX event, false for RX.

    MonitorEventStreamNotification:
      type: object
      description: Canonical JSON-RPC notification envelope for monitor/event-stream events.
      required: [jsonrpc, method, params]
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        method:
          $ref: '#/components/schemas/MonitorEventMethod'
        params:
          oneOf:
            - $ref: '#/components/schemas/BroadcastDeliveryNotification'
            - $ref: '#/components/schemas/TrafficEvent'
            - $ref: '#/components/schemas/WifiEvent'
            - $ref: '#/components/schemas/GpsEvent'
            - $ref: '#/components/schemas/LocationEvent'
          description: Notification payload for the emitted monitor event.

    MonitorEventMethod:
      type: string
      description: Canonical monitor/event-stream notification method names.
      enum: [bramble.onBroadcastDelivery, bramble.onTrafficEvent, bramble.onWifiEvent, bramble.onGpsEvent, bramble.onLocationEvent]

    WifiEvent:
      type: object
      required: [event, mode, connected, ip]
      properties:
        event:
          type: string
          enum: [connected, disconnected, ip_changed]
        mode:
          type: string
          enum: ['off', sta, ap]
        connected:
          type: boolean
        ssid:
          type: string
        ip:
          type: string
        rssi:
          type: integer

    GpsEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum: [fix_acquired, fix_lost]
        valid:
          type: boolean
        lat:
          type: number
        lon:
          type: number
        alt_m:
          type: integer
        accuracy_m:
          type: integer

    LocationEvent:
      type: object
      required: [event, tier, timestamp_ms]
      properties:
        event:
          type: string
          enum: [sent, received]
        peer:
          type: string
          description: Hex peer address for received events.
        tier:
          type: integer
        timestamp_ms:
          type: integer
        rssi:
          type: integer
        snr:
          type: integer
        count:
          type: integer
          description: Number of recipients in a location send cycle.

    # ── Auth ─────────────────────────────────────────────────────────────────

    SetAuthTokenParams:
      type: object
      description: Parameters for bramble.setAuthToken.
      required: [token]
      properties:
        token:
          type: string
          description: >
            Auth token string (max 127 chars). Pass an empty string to disable
            authentication and allow open access.
          maxLength: 127

    GetAuthTokenResponse:
      type: object
      description: Response from bramble.getAuthToken.
      required: [token, enabled]
      properties:
        token:
          type: string
          description: Current token string (empty string when auth is disabled).
        enabled:
          type: boolean
          description: True when a non-empty token is configured.

    SetNetworkKeyParams:
      type: object
      description: Parameters for bramble.setNetworkKey.
      required: [key]
      properties:
        key:
          type: string
          description: >
            The raw 32-byte network key as exactly 64 hex characters
            (case-insensitive).
          pattern: '^[0-9a-fA-F]{64}$'

    GetNetworkKeyStatusResponse:
      type: object
      description: Response from bramble.getNetworkKeyStatus.
      required: [provisioned, fingerprint]
      properties:
        provisioned:
          type: boolean
          description: >
            True when a real per-fleet key has been provisioned; false when
            the node is still on the public-PSK fallback.
        fingerprint:
          type: string
          description: >
            SHA256(network_key)[0:4] as 8 lowercase hex characters. Matches
            across nodes that share a key; never reveals the key.
          pattern: '^[0-9a-f]{8}$'

    GenerateNetworkKeyResponse:
      type: object
      description: Response from bramble.generateNetworkKey.
      required: [key, fingerprint]
      properties:
        key:
          type: string
          description: >
            The freshly-minted raw 32-byte network key as 64 lowercase hex
            characters, for the operator to copy to the other nodes. This node
            is already provisioned with it.
          pattern: '^[0-9a-f]{64}$'
        fingerprint:
          type: string
          description: >
            SHA256(network_key)[0:4] as 8 lowercase hex characters, matching
            bramble.getNetworkKeyStatus on every node provisioned with this key.
          pattern: '^[0-9a-f]{8}$'

    SetAnchorParams:
      type: object
      description: Parameters for bramble.setAnchor.
      required: [anchor_pubkey]
      properties:
        anchor_pubkey:
          type: string
          description: >
            The fleet trust anchor's raw 32-byte Ed25519 public key as exactly
            64 hex characters (case-insensitive).
          pattern: '^[0-9a-fA-F]{64}$'

    GetAnchorStatusResponse:
      type: object
      description: Response from bramble.getAnchorStatus.
      required: [anchored, endorsed]
      properties:
        anchored:
          type: boolean
          description: True when a fleet trust anchor public key is provisioned.
        anchor_fingerprint:
          type: string
          description: >
            SHA256(anchor_pub)[0:4] as 8 lowercase hex characters. Present only
            when anchored; matches across nodes that share an anchor and never
            reveals the key.
          pattern: '^[0-9a-f]{8}$'
        endorsed:
          type: boolean
          description: >
            True when this node holds its own endorsement certificate AND that
            certificate still verifies against the currently provisioned anchor
            and this node's identity key. Reports live enrollment state, so it
            flips to false after an anchor rotation that invalidates the stored
            cert (never true when anchored is false).

    SetEndorsementParams:
      type: object
      description: Parameters for bramble.setEndorsement.
      required: [not_after, endorsement_sig]
      properties:
        not_after:
          type: string
          description: >
            Certificate validity bound as a big-endian uint64 in exactly 16 hex
            characters (a hex string, NOT a JSON number: UINT64_MAX does not
            survive JSON double precision). Milliseconds since the Unix epoch;
            "ffffffffffffffff" means permanent. Must not be 0.
          pattern: '^[0-9a-fA-F]{16}$'
        endorsement_sig:
          type: string
          description: >
            The anchor's raw 64-byte Ed25519 signature over this node's
            identity key and not_after, as exactly 128 hex characters.
          pattern: '^[0-9a-fA-F]{128}$'

    SetAllowedOriginsParams:
      type: object
      description: Parameters for bramble.setAllowedOrigins.
      required: [origins]
      properties:
        origins:
          type: array
          description: >
            Full origins (scheme://host[:port]) or the literal "null". Entries
            must not contain commas or spaces; the comma-joined list must fit
            in 255 characters. An empty array clears the allowlist.
          items:
            type: string

    GetAllowedOriginsResponse:
      type: object
      description: Response from bramble.getAllowedOrigins.
      required: [origins]
      properties:
        origins:
          type: array
          description: Persisted extra WS Origin allowlist entries.
          items:
            type: string

    # ── OTA ──────────────────────────────────────────────────────────────────

    OtaUpdateParams:
      type: object
      description: Parameters for bramble.otaUpdate.
      required: [path]
      properties:
        path:
          type: string
          description: >
            Artifact path relative to the device's allowlisted OTA origin,
            e.g. stable/v1.4.0/heltec-v3/bramble.bin. Absolute URLs, path
            traversal, and special characters are rejected.
        allow_downgrade:
          type: boolean
          description: >
            Accept an image version below the anti-rollback floor and lower
            the floor to it. Defaults to false.

    OtaUpdateResponse:
      type: object
      description: Response from bramble.otaUpdate.
      required: [ok]
      properties:
        ok:
          type: boolean
          description: True when the OTA task started successfully.
        note:
          type: string
          description: Informational message about OTA status.
        url:
          type: string
          description: Fully resolved download URL (origin + path).
        partition:
          type: string
          description: Name of the currently running partition.
        error:
          type: string
          description: Error message when ok=false.
        last_error:
          type: string
          description: Failure reason from the previous OTA attempt, if any.

    OtaGetOriginResponse:
      type: object
      description: Response from bramble.otaGetOrigin.
      required: [ok, origin, default_origin, overridden, running_version]
      properties:
        ok:
          type: boolean
        origin:
          type: string
          description: Effective OTA origin used to resolve artifact paths.
        default_origin:
          type: string
          description: Compiled-in default origin.
        overridden:
          type: boolean
          description: True when an NVS override is stored.
        version_floor:
          type: string
          description: Anti-rollback floor version, when one is recorded.
        running_version:
          type: string
          description: Version of the running firmware.

    OtaSetOriginParams:
      type: object
      description: Parameters for bramble.otaSetOrigin.
      properties:
        origin:
          type: string
          description: New OTA origin base URL (https required by policy).
        reset:
          type: boolean
          description: Remove the override and return to the default origin.

    OtaSetOriginResponse:
      type: object
      description: Response from bramble.otaSetOrigin.
      required: [ok]
      properties:
        ok:
          type: boolean
        origin:
          type: string
          description: Effective origin after the change.
        overridden:
          type: boolean
        error:
          type: string
          description: Error message when ok=false.

    OtaStatusResponse:
      type: object
      description: Response from bramble.otaStatus.
      required: [state, bytes, total, percent, running_version]
      properties:
        state:
          type: string
          enum: [idle, downloading, verifying, rebooting, failed]
          description: Current phase of the background OTA task.
        bytes:
          type: integer
          description: Bytes downloaded so far in the current attempt.
        total:
          type: integer
          description: Total expected bytes for the current attempt, or 0 if unknown.
        percent:
          type: integer
          description: Download percent complete; 0 when total is 0.
        last_error:
          type: string
          description: Failure reason from the previous OTA attempt, if any.
        running_version:
          type: string
          description: Version of the running firmware.
        version_floor:
          type: string
          description: Anti-rollback floor version, when one is recorded.

    # ── Hardware / Power ──────────────────────────────────────────────────────

    GetBatteryResponse:
      type: object
      description: Response from bramble.getBattery.
      required: [voltage_mv, percentage]
      properties:
        voltage_mv:
          type: integer
          description: Battery voltage in millivolts.
        percentage:
          type: integer
          description: Estimated battery charge percentage (0–100).

    SetBacklightParams:
      type: object
      description: Parameters for bramble.setBacklight.
      required: [level]
      properties:
        level:
          type: integer
          description: Backlight PWM duty cycle (0 = off, 255 = full brightness).
          minimum: 0
          maximum: 255

    SetBacklightResponse:
      type: object
      description: Response from bramble.setBacklight.
      required: [level]
      properties:
        level:
          type: integer
          description: Applied backlight duty cycle after range clamping.

    SleepParams:
      type: object
      description: Parameters for bramble.sleep. All fields optional.
      properties:
        wake_after_s:
          type: integer
          description: >
            Timer wake interval in seconds. If omitted or 0 the node wakes only
            on LoRa DIO1 (incoming radio packet).
          minimum: 1

    SleepResponse:
      type: object
      description: Response from bramble.sleep.
      required: [ok]
      properties:
        ok:
          type: boolean
          description: Always true when deep sleep is about to begin.
        note:
          type: string
          description: Human-readable description of the configured wake source.
        wake_after_s:
          type: integer
          description: Timer wake interval that was applied (present only when requested).

    GetGpsPositionResponse:
      type: object
      description: Response from bramble.getGpsPosition.
      required: [valid]
      properties:
        valid:
          type: boolean
          description: >
            True when a GPS fix is available and all position fields are populated.
            False when GPS is not available or no fix has been acquired.
        lat:
          type: number
          description: Latitude in decimal degrees.
        lon:
          type: number
          description: Longitude in decimal degrees.
        alt:
          type: number
          description: Altitude in meters.
        speed_kmh:
          type: number
          description: Ground speed in km/h.
        heading_deg:
          type: number
          description: Heading in degrees (0–360, 0 = North).
        accuracy_m:
          type: integer
          description: Horizontal accuracy estimate in meters.
        timestamp:
          type: integer
          description: Unix timestamp of the GPS fix (seconds).

    # ── Storage (T-Deck Plus only) ─────────────────────────────────────────

    GetStorageInfoResponse:
      type: object
      description: Response from bramble.getStorageInfo (T-Deck Plus only).
      required: [sd_present]
      properties:
        sd_present:
          type: boolean
          description: True when an SD card is inserted and mounted.
        mount_point:
          type: string
          description: Filesystem mount path (present only when sd_present=true).

    # ── Audio (T-Deck Plus only) ───────────────────────────────────────────

    PlayToneParams:
      type: object
      description: Parameters for bramble.playTone (T-Deck Plus only).
      required: [tone]
      properties:
        tone:
          type: string
          description: Predefined tone name to play.
          enum: [message_rx, message_tx, peer_join, peer_leave, error, boot, gps_fix]

    SetVolumeParams:
      type: object
      description: Parameters for bramble.setVolume (T-Deck Plus only).
      required: [volume]
      properties:
        volume:
          type: integer
          description: Audio volume level (0 = silent, 100 = maximum).
          minimum: 0
          maximum: 100

    SetMutedParams:
      type: object
      description: Parameters for bramble.setMuted (T-Deck Plus only).
      required: [muted]
      properties:
        muted:
          type: boolean
          description: True to mute audio output; false to unmute.

    GetAudioStatusResponse:
      type: object
      description: Response from bramble.getAudioStatus (T-Deck Plus only).
      required: [available, volume, muted, playing]
      properties:
        available:
          type: boolean
          description: True when audio hardware is initialised and functional.
        volume:
          type: integer
          description: Current volume level (0–100).
        muted:
          type: boolean
          description: True when audio is muted.
        playing:
          type: boolean
          description: True when a tone is currently playing.

    # ── Beacon Policy ──────────────────────────────────────────────────────

    BeaconPolicyConfig:
      type: object
      description: Beacon transmission policy configuration.
      required: [enabled, mode, baseIntervalMs, minIntervalMs, maxIntervalMs, denseThreshold, churnThreshold, churnWindowMs]
      properties:
        enabled:
          type: boolean
          description: Whether beacon transmission is enabled.
        mode:
          type: string
          enum: [fixed, adaptive]
          description: fixed = constant interval; adaptive = density/churn-driven.
        baseIntervalMs:
          type: integer
          description: Baseline beacon interval in milliseconds (adaptive stable mode).
        minIntervalMs:
          type: integer
          description: Minimum beacon interval in milliseconds (adaptive churn mode).
        maxIntervalMs:
          type: integer
          description: Maximum beacon interval in milliseconds (adaptive dense mode).
        denseThreshold:
          type: integer
          description: Neighbor count above which dense mode activates.
        churnThreshold:
          type: integer
          description: Join/leave events within churnWindowMs that trigger churn mode.
        churnWindowMs:
          type: integer
          description: Sliding window duration for churn event detection in milliseconds.

    BeaconPolicyStatus:
      type: object
      description: Beacon policy runtime status.
      required: [activeMode, currentIntervalMs, neighborCount, churnEvents, lastTransitionMs, inBackoff]
      properties:
        activeMode:
          type: string
          enum: [fixed, adaptive]
          description: Currently active beacon mode.
        currentIntervalMs:
          type: integer
          description: Current beacon interval in milliseconds.
        neighborCount:
          type: integer
          description: Number of direct neighbors at last policy evaluation.
        churnEvents:
          type: integer
          description: Number of churn events detected in the current window.
        lastTransitionMs:
          type: integer
          description: Timestamp (ms since boot) of the last mode transition.
        inBackoff:
          type: boolean
          description: True when the beacon timer is in a rate-limiting backoff period.

    SetBeaconPolicyParams:
      type: object
      description: Parameters for bramble.setBeaconPolicy. All fields optional.
      properties:
        enabled:
          type: boolean
          description: Enable or disable beacon transmission.
        mode:
          type: string
          enum: [fixed, adaptive]
          description: Beacon timing mode.
        baseIntervalMs:
          type: integer
          description: Baseline beacon interval in milliseconds.
        minIntervalMs:
          type: integer
          description: Minimum beacon interval in milliseconds.
        maxIntervalMs:
          type: integer
          description: Maximum beacon interval in milliseconds.
        denseThreshold:
          type: integer
          description: Neighbor count threshold for dense mode.
        churnThreshold:
          type: integer
          description: Churn event count to trigger churn mode.
        churnWindowMs:
          type: integer
          description: Churn detection window in milliseconds.

    GetBeaconPolicyResponse:
      type: object
      description: Response from bramble.getBeaconPolicy.
      required: [config, status]
      properties:
        config:
          $ref: '#/components/schemas/BeaconPolicyConfig'
        status:
          $ref: '#/components/schemas/BeaconPolicyStatus'

    # ── Notification Payloads ──────────────────────────────────────────────

    OnMessagePayload:
      type: object
      description: Params of the bramble.onMessage notification.
      required: [from, text, rssi, snr, channel, broadcast]
      properties:
        from:
          type: string
          description: Sender address as 8-char uppercase hex.
        text:
          type: string
          description: Message text content.
        rssi:
          type: integer
          description: RSSI at receive time (dBm).
        snr:
          type: integer
          description: SNR at receive time (dB).
        channel:
          type: integer
          description: Channel index, or -1 for the default/public channel.
        broadcast:
          type: boolean
          description: True for broadcast messages.

    OnAckPayload:
      type: object
      description: >
        Params of the bramble.onAck notification. status=delivered events
        carry from, rssi_at_dest, and relayPath; status=failed events carry
        only packet_id, status, and (for fast-fail) reason.
      required: [packet_id, status]
      properties:
        packet_id:
          type: string
          description: Packet ID returned by bramble.sendMessage, uppercase hex.
        status:
          type: string
          enum: [delivered, failed]
        from:
          type: string
          description: Acking node address as 8-char uppercase hex (delivered only).
        rssi_at_dest:
          type: integer
          description: RSSI measured at the destination in dBm (delivered only).
        relayPath:
          type: array
          description: Relay path extracted from the ACK (delivered only).
          items:
            type: object
            required: [addr, rssi]
            properties:
              addr:
                type: string
                description: Relay node address as 8-char uppercase hex.
              rssi:
                type: integer
                description: RSSI at this hop (0 when unknown; final hop carries rssi_at_dest).
        reason:
          type: string
          description: Failure reason for route-error fast-fails (failed only, optional).

    OnProbeResultPayload:
      type: object
      description: Params of the bramble.onProbeResult notification.
      required: [address, hops, rssi, snr, latency_ms, probe_round, probe_id]
      properties:
        address:
          type: string
          description: Responder address as 8-char uppercase hex.
        hops:
          type: integer
          description: Hop count to the responder.
        rssi:
          type: integer
          description: RSSI of the probe response (dBm).
        snr:
          type: integer
          description: SNR of the probe response (dB).
        latency_ms:
          type: integer
          description: Round-trip latency in milliseconds.
        probe_round:
          type: integer
          description: Sweep round this response was heard in (1-based).
        probe_id:
          type: string
          description: Probe identifier as 8-char uppercase hex.

    OnProbeCompletePayload:
      type: object
      description: Params of the bramble.onProbeComplete notification.
      required: [probe_id, unique_count, duration_ms, rounds_total, responders]
      properties:
        probe_id:
          type: string
          description: Probe identifier as 8-char uppercase hex.
        unique_count:
          type: integer
          description: Number of unique responders.
        duration_ms:
          type: integer
          description: Collection window duration in milliseconds.
        rounds_total:
          type: integer
          description: Number of probe rounds in the sweep.
        responders:
          type: array
          items:
            type: object
            required: [address, hops, rssi, snr, latency_ms, seen_rounds]
            properties:
              address:
                type: string
                description: Responder address as 8-char uppercase hex.
              hops:
                type: integer
              rssi:
                type: integer
              snr:
                type: integer
              latency_ms:
                type: integer
              seen_rounds:
                type: integer
                description: Number of rounds this responder was heard in.

    OnIdentityChangePayload:
      type: object
      description: Params of the bramble.onIdentityChange notification.
      required: [new_address, reason]
      properties:
        new_address:
          type: string
          description: Regenerated node address as 8-char uppercase hex.
        reason:
          type: string
          enum: [address_collision]
          description: Why the identity changed.

  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: >
        Per-device auth token (generated on first boot, NVS-persisted).
        WebSocket clients send "Authorization: Bearer <token>" or the ?token=
        query parameter; BLE clients write the token as the first write on a
        new connection; serial is unauthenticated by design. Without the token
        only bramble.ping and bramble.getVersion are callable.

# ── Notifications (extension) ──────────────────────────────────────────────

x-notifications:
  bramble.onMessage:
    description: >
      Incoming message received from the mesh. Delivered as a JSON-RPC
      notification (no id field).
    payload:
      $ref: '#/components/schemas/OnMessagePayload'

  bramble.onAck:
    description: >
      Delivery acknowledgment or failure for a previously sent message.
      Matches the packetId returned by bramble.sendMessage.
    payload:
      $ref: '#/components/schemas/OnAckPayload'

  bramble.onBroadcastDelivery:
    description: >
      Broadcast delivery telemetry event emitted after bramble.sendBroadcast.
      Correlate using broadcast_id from SendBroadcastResponse.
      One broadcast may produce multiple delivery notifications.
    payload:
      $ref: '#/components/schemas/BroadcastDeliveryNotification'
    envelope:
      $ref: '#/components/schemas/MonitorEventStreamNotification'

  bramble.onNeighborChange:
    description: >
      Neighbor table has changed. Client should re-fetch via
      bramble.getNeighbors for updated data. Sent without a params field.

  bramble.onPeerLocation:
    description: >
      A peer location update was received and cached. Client should re-fetch
      via bramble.getPeerLocations for updated data. Sent without a params
      field.

  bramble.onIdentityChange:
    description: >
      This node detected an address collision and regenerated its identity.
      Clients should refresh anything keyed on the node address.
    payload:
      $ref: '#/components/schemas/OnIdentityChangePayload'

  bramble.onProbeResult:
    description: >
      Probe response received from a peer node. Multiple notifications
      may arrive for a single probe, followed by bramble.onProbeComplete.
    payload:
      $ref: '#/components/schemas/OnProbeResultPayload'

  bramble.onProbeComplete:
    description: >
      Probe collection window has closed; no more responses expected.
      Carries the aggregated responder list for the sweep.
    payload:
      $ref: '#/components/schemas/OnProbeCompletePayload'

  bramble.onTrafficEvent:
    description: >
      Real-time traffic event notification. Emitted when traffic debug is enabled
      and a new TX or RX event is recorded. Clients can use this for live monitoring
      or reconnect backfill via bramble.getTrafficEvents(since_seq).
    payload:
      $ref: '#/components/schemas/TrafficEvent'
    envelope:
      $ref: '#/components/schemas/MonitorEventStreamNotification'

  bramble.onWifiEvent:
    description: WiFi state transition event (connect/disconnect/IP change).
    payload:
      $ref: '#/components/schemas/WifiEvent'
    envelope:
      $ref: '#/components/schemas/MonitorEventStreamNotification'

  bramble.onGpsEvent:
    description: GPS fix transition event.
    payload:
      $ref: '#/components/schemas/GpsEvent'
    envelope:
      $ref: '#/components/schemas/MonitorEventStreamNotification'

  bramble.onLocationEvent:
    description: Location sharing send/receive event.
    payload:
      $ref: '#/components/schemas/LocationEvent'
    envelope:
      $ref: '#/components/schemas/MonitorEventStreamNotification'
