name: Web Client Build Publish

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'webapp/**'
      - 'web-flasher/**'
      - '.gitea/workflows/webapp-build-publish.yml'

jobs:
  build-test-publish:
    runs-on: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and test webapp
        run: |
          rm -rf webapp/public/web-flasher
          mkdir -p webapp/public/web-flasher
          cp -a web-flasher/. webapp/public/web-flasher/
          cd webapp
          npm ci
          npm test
          npm run build

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          tags=()

          immutable_sha_tag="sha-${GITHUB_SHA}"

          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags+=("main")
            tags+=("${immutable_sha_tag}")
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${GITHUB_REF_NAME}"
            tags+=("${version}")
            tags+=("$(printf '%s' "${version}" | sed -E 's/^(v[0-9]+\.[0-9]+)\.[0-9]+$/\1/')")
            tags+=("$(printf '%s' "${version}" | sed -E 's/^(v[0-9]+)\.[0-9]+\.[0-9]+$/\1/')")
            tags+=("${immutable_sha_tag}")
          fi

          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No publishable tags for ref ${GITHUB_REF}; exiting."
            exit 1
          fi

          printf 'tags=%s\n' "$(IFS=,; echo "${tags[*]}")" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_PAT" | docker login registry.idiotica.org -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push web-client image
        env:
          IMAGE_REPO: registry.idiotica.org/dumbot/bramble-web-client
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
          DOCKERFILE_PATH: webapp/Dockerfile
          BUILD_CONTEXT: webapp
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --use --name bramble-webapp-builder >/dev/null 2>&1 || docker buildx use bramble-webapp-builder

          tag_args=()
          IFS=',' read -r -a tags <<< "$IMAGE_TAGS"
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "${IMAGE_REPO}:${tag}")
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f "${DOCKERFILE_PATH}" \
            "${BUILD_CONTEXT}" \
            "${tag_args[@]}" \
            --push

      - name: Trigger host deploy workflow
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API_BASE: ${{ vars.GITEA_API_BASE }}
          IMAGE_REF: registry.idiotica.org/dumbot/bramble-web-client:sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api_base="${GITEA_API_BASE:-http://172.17.0.1:3001}"
          payload="$(cat <<JSON
          {
            "event_type": "deploy-bramble-web-client",
            "client_payload": {
              "image_ref": "${IMAGE_REF}",
              "dry_run": "false",
              "check_only": "false"
            }
          }
          JSON
          )"

          curl -fsS -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            "${api_base}/api/v1/repos/justinlindh/dockers/dispatches" \
            -d "${payload}"
