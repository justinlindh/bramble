name: Quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
      - 'chore/**'
      - 'ci/**'
    paths:
      - '.gitea/workflows/quality.yml'
      - 'scripts/**'
      - 'test/**'
      - 'main/**'
      - 'components/**'
      - 'docs/**'
      - 'README.md'

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests
    runs-on: linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assert host test deps are pre-baked on the runner
        run: |
          for tool in cmake make gcc g++; do
            command -v "$tool" >/dev/null || { echo "::error::$tool missing from runner image"; exit 1; }
          done
          test -f /usr/include/openssl/ssl.h || { echo "::error::libssl-dev missing from runner image"; exit 1; }
      - name: Run host test suite
        run: bash test/run_all_tests.sh

  shellcheck:
    name: ShellCheck
    runs-on: linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert shellcheck is pre-baked on the runner
        run: command -v shellcheck >/dev/null || { echo "::error::shellcheck missing from runner image"; exit 1; }
      - name: ShellCheck required baseline scope
        run: |
          shellcheck \
            scripts/ci-build-firmware.sh \
            scripts/ci-publish-ota.sh \
            scripts/flash-all.sh \
            scripts/publish-firmware-release.sh \
            scripts/sha256-artifacts.sh \
            scripts/test-ota-ci-board-matrix.sh \
            scripts/traffic-capture.sh \
            scripts/validate-broadcast-telemetry.sh

  actionlint:
    name: Actionlint
    runs-on: linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv ./actionlint /usr/local/bin/actionlint
      - name: Lint quality workflow
        run: actionlint -color -oneline -ignore 'shellcheck reported issue.*SC2317' -config-file .actionlint.yaml .gitea/workflows/quality.yml

  ruff:
    name: Ruff
    runs-on: linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (pinned)
        run: |
          curl -LsSf https://astral.sh/uv/0.8.15/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Ruff required baseline profile
        run: uvx --from 'ruff==0.12.10' ruff check scripts --select E9,F63,F7,F82

  clang-format:
    name: Clang-format
    runs-on: linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert clang-format is pre-baked on the runner
        run: command -v clang-format >/dev/null || { echo "::error::clang-format missing from runner image"; exit 1; }
      - name: Clang-format check (full strict scope)
        run: bash scripts/lint/run-clang-format-check.sh --strict

  cppcheck:
    name: cppcheck
    runs-on: linux
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck (not pre-baked on the runner image)
        run: |
          # The runner image carries an arm64 foreign arch whose security
          # mirror lacks arm64 indexes; apt-get update exits nonzero even
          # though the amd64 indexes it needs are fetched. Tolerate that,
          # then let the install fail honestly if cppcheck is unavailable.
          sudo apt-get update || true
          command -v cppcheck >/dev/null || sudo apt-get install -y cppcheck
      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --std=c11 --quiet --error-exitcode=2 --suppress=normalCheckLevelMaxBranches \
            main components

  board-build-smoke:
    name: Board build smoke (heltec-v3)
    if: github.event_name != 'pull_request'
    runs-on: idf-node
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ESP-IDF toolchain
        run: bash scripts/ci-ensure-idf.sh
      - name: Build heltec-v3 via wrapper
        env:
          HOME: /tmp/cihome
          ESP_ROM_ELF_DIR: /tmp/esp-rom-elf
        run: |
          mkdir -p "$HOME" "$ESP_ROM_ELF_DIR"
          bash scripts/flash.sh local heltec-v3 build

