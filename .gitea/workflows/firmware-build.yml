name: Firmware Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.gitea/workflows/firmware-build.yml'
      - 'scripts/ci-build-firmware.sh'
      - 'docker/firmware-builder/**'

jobs:
  firmware-build:
    runs-on: idf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware artifacts
        run: bash scripts/ci-build-firmware.sh

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware-build-artifacts
          path: build-artifacts/firmware-ci
          if-no-files-found: error
