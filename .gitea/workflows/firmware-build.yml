name: Firmware Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'firmware-v*' ]
    paths:
      - '.gitea/workflows/firmware-build.yml'
      - 'scripts/ci-build-firmware.sh'
      - 'scripts/ci-publish-ota.sh'
      - 'docker/firmware-builder/**'
      - 'main/**'
      - 'components/**'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - 'sdkconfig.defaults.*'

jobs:
  firmware-build:
    runs-on: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and channel
        id: version
        run: |
          REF_NAME="${GITHUB_REF_NAME:-}"
          if [[ "$REF_NAME" =~ ^firmware-v(.+)$ ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            CHANNEL="dev"
            VERSION=$(CHANNEL=dev bash scripts/ci-publish-ota.sh --print-version)
            echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved: channel=$(grep channel "$GITHUB_OUTPUT" | tail -1) version=$(grep version "$GITHUB_OUTPUT" | tail -1)"

      - name: Build firmware artifacts
        env:
          BRAMBLE_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          source scripts/ci-source-idf.sh
          # Strip leading v for PROJECT_VER
          export BRAMBLE_BUILD_VERSION="${BRAMBLE_BUILD_VERSION#v}"
          bash scripts/ci-build-firmware.sh

      - name: Publish OTA via authenticated endpoint
        env:
          OTA_PUBLISH_KEY: ${{ secrets.OTA_PUBLISH_KEY }}
          OTA_PUBLISH_URL: https://bramblemesh.org/ota/publish
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          missing=()
          command -v curl >/dev/null 2>&1 || missing+=(curl)
          command -v jq >/dev/null 2>&1 || missing+=(jq)
          if [ ${#missing[@]} -gt 0 ]; then
            apt-get update
            apt-get install -y "${missing[@]}"
          fi
          chmod +x scripts/ci-publish-ota.sh

          for board in heltec-v3 tdeck-plus heltec-v4; do
            echo "Publishing board: $board"
            BOARD="$board" \
            BOOTLOADER="build-artifacts/firmware-ci/$board/bootloader.bin" \
            PARTITION="build-artifacts/firmware-ci/$board/partition-table.bin" \
            FIRMWARE="build-artifacts/firmware-ci/$board/bramble.bin" \
            scripts/ci-publish-ota.sh
          done

      - name: Verify published release completeness in index
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -fsSL https://bramblemesh.org/ota/index.json -o /tmp/ota-index.json

          jq -e \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --argjson boards '["heltec-v3","tdeck-plus","heltec-v4"]' \
            '
            def matches_board_artifact($board; $name):
              ((.file // "") | endswith("/" + $board + "/" + $name)) or
              ((.path // "") | endswith("/" + $board + "/" + $name));

            def has_required_for_board($board):
              any(.artifacts[]?; .board == $board and matches_board_artifact($board; "bootloader.bin")) and
              any(.artifacts[]?; .board == $board and matches_board_artifact($board; "partition-table.bin")) and
              any(.artifacts[]?; .board == $board and matches_board_artifact($board; "bramble.bin"));

            (.releases | map(select(.version == $version and .channel == $channel)) | first) as $release
            | $release != null
            and ([$boards[] | . as $b | $release | has_required_for_board($b)] | all)
            ' /tmp/ota-index.json >/dev/null

          echo "Verified complete published release in index: channel=$CHANNEL version=$VERSION boards=heltec-v3,tdeck-plus,heltec-v4"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-artifacts
          path: |
            build-artifacts/firmware-ci/**/*.bin
            build-artifacts/firmware-ci/**/flasher_args.json
            build-artifacts/firmware-ci/**/SHA256SUMS.txt
          if-no-files-found: error

