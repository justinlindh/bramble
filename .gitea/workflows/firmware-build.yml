name: Firmware Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.gitea/workflows/firmware-build.yml'
      - 'scripts/ci-build-firmware.sh'
      - 'docker/firmware-builder/**'

jobs:
  firmware-build:
    runs-on: idf-node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware artifacts
        run: |
          . /opt/esp/idf/export.sh
          bash scripts/ci-build-firmware.sh

      - name: Publish OTA release to mounted /ota
        env:
          OTA_ROOT: /ota
        run: |
          echo "[ota] mount check"
          mount | grep ' /ota ' || { echo '/ota mount missing'; exit 1; }
          echo "[ota] listing"
          ls -la "$OTA_ROOT"
          VERSION="$(git describe --tags --always --dirty)"
          if echo "$VERSION" | grep -Eq '^v[0-9]'; then CHANNEL=stable; else CHANNEL=dev; fi
          ./scripts/publish-firmware-release.sh "$OTA_ROOT" "$CHANNEL" "$VERSION" \
            heltec-v3=build-artifacts/firmware-ci/bootloader.bin \
            heltec-v3=build-artifacts/firmware-ci/partition-table.bin \
            heltec-v3=build-artifacts/firmware-ci/bramble.bin
          node scripts/validate-firmware-index.js "$OTA_ROOT/index.json"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware-build-artifacts
          path: |
            build-artifacts/firmware-ci/*.bin
            build-artifacts/firmware-ci/flasher_args.json
            build-artifacts/firmware-ci/SHA256SUMS.txt
          if-no-files-found: error

