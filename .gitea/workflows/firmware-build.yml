name: Firmware Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.gitea/workflows/firmware-build.yml'
      - 'scripts/ci-build-firmware.sh'
      - 'docker/firmware-builder/**'

jobs:
  firmware-build:
    runs-on: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure modern Docker CLI is available
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y ca-certificates curl gnupg
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            chmod a+r /etc/apt/keyrings/docker.gpg
            . /etc/os-release
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
            apt-get update
            apt-get install -y docker-ce-cli
          fi
          docker version

      - name: Build firmware builder container
        run: docker build -t bramble-firmware-builder:espidf-v5.4.1 -f docker/firmware-builder/Dockerfile .

      - name: Build firmware artifacts in container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            bramble-firmware-builder:espidf-v5.4.1 \
            bash scripts/ci-build-firmware.sh

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware-build-artifacts
          path: build-artifacts/firmware-ci
          if-no-files-found: error
