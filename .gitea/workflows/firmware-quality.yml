name: Firmware Quality (Phase 2.3)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitea/workflows/firmware-quality.yml'
      - '.actionlint.yaml'
      - '.clang-format'
      - '.clang-tidy'
      - '.shellcheckrc'
      - '.markdownlint-cli2.yaml'
      - 'scripts/lint/**'
      - 'scripts/*.sh'
      - 'main/**'
      - 'components/**'
      - 'docs/**'
      - 'README.md'
  push:
    branches: [ main ]
    paths:
      - '.gitea/workflows/firmware-quality.yml'
      - '.actionlint.yaml'
      - '.clang-format'
      - '.clang-tidy'
      - '.shellcheckrc'
      - '.markdownlint-cli2.yaml'
      - 'scripts/lint/**'
      - 'scripts/*.sh'
      - 'main/**'
      - 'components/**'
      - 'docs/**'
      - 'README.md'

concurrency:
  group: firmware-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-markdownlint:
    name: Required markdownlint
    runs-on: linux
    timeout-minutes: 10
    env:
      MARKDOWNLINT_VERSION: 0.21.0
      MARKDOWNLINT_CACHE_DIR: /tmp/markdownlint-tools
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js and restore markdownlint cache
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs npm
      - name: Restore markdownlint tool cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ env.MARKDOWNLINT_CACHE_DIR }}
          key: ${{ runner.os }}-markdownlint-${{ env.MARKDOWNLINT_VERSION }}-${{ hashFiles('.gitea/workflows/firmware-quality.yml', '.markdownlint-cli2.yaml') }}
      - name: Install markdownlint-cli2 (cached)
        run: |
          set -euo pipefail
          BIN_PATH="${MARKDOWNLINT_CACHE_DIR}/node_modules/.bin/markdownlint-cli2"
          if [ ! -x "$BIN_PATH" ]; then
            npm install --cache "$HOME/.npm" --prefix "$MARKDOWNLINT_CACHE_DIR" "markdownlint-cli2@${MARKDOWNLINT_VERSION}"
          fi
          "$BIN_PATH" --version
      - name: Run markdownlint strict wrapper (changed files)
        env:
          PATH: ${{ env.MARKDOWNLINT_CACHE_DIR }}/node_modules/.bin:${{ env.PATH }}
        run: bash scripts/lint/run-markdownlint.sh --strict --changed

  required-clang-format:
    name: Required clang-format
    runs-on: linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Run clang-format strict wrapper (changed files)
        run: bash scripts/lint/run-clang-format-check.sh --strict --changed

  required-shellcheck:
    name: Required shellcheck
    runs-on: linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck strict wrapper
        run: bash scripts/lint/run-shellcheck.sh --strict

  required-actionlint:
    name: Required actionlint
    runs-on: linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv ./actionlint /usr/local/bin/actionlint
      - name: Run actionlint on firmware-quality workflow
        run: actionlint -color -oneline -ignore 'shellcheck reported issue.*SC2317' -config-file .actionlint.yaml .gitea/workflows/firmware-quality.yml

  required-clang-tidy:
    name: Required clang-tidy (heltec-v3 compile DB)
    runs-on: idf-node
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ESP-IDF toolchain and persist env
        run: bash scripts/ci-ensure-idf.sh --github-env
      - name: Build heltec-v3 via wrapper (compile_commands)
        env:
          HOME: /tmp/cihome
        run: |
          mkdir -p "$HOME"
          bash scripts/flash.sh local heltec-v3 build
      - name: Run clang-tidy wrapper
        run: bash scripts/lint/run-clang-tidy-advisory.sh build-heltec-v3

