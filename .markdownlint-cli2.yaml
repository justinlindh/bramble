config:
  default: true
  MD013: false # line length handled by editor/review for now
  MD024: # allow repeated heading text across different, non-sibling sections
    siblings_only: true # (per-board tables, per-project comparison subsections, changelog entries)
  MD033: false # allow inline HTML in ESP-IDF/docs tooling docs
  MD036: false # bold field labels (e.g. **Params**, **Trigger conditions**) are a
    # deliberate flat sub-label style in spec docs (docs/rpc/events.md,
    # docs/bramble-protocol-spec.md), not sloppy headings; promoting them to real
    # headings would add anchors/nav entries never meant to exist
  MD041: false # many docs intentionally omit top-level heading
  MD060: false # table pipe alignment/spacing is a cosmetic source-only nit with
    # no rendered difference; enforcing it forces constant re-padding of every
    # hand-maintained table on every edit
# No `globs:` here on purpose. markdownlint-cli2 UNIONS config globs with any
# command-line file arguments, so a repo-wide "**/*.md" glob here would drag
# every untracked markdown on disk (gitignored build output, editor scratch,
# agent worktrees) into runs that name explicit files, and a tree that is clean
# in CI would fail locally. scripts/lint/run-markdownlint.sh owns file
# selection: it passes exactly the git-tracked markdown files. The ignores
# below still apply to command-line arguments (docs/archive/ is tracked but
# frozen, and the others guard vendored/derived trees for editor integrations
# that lint single files against this config).
ignores:
  - "build/**"
  - "**/managed_components/**"
  - "**/node_modules/**"
  - ".git/**"
  - "docs/archive/**"
